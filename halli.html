<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Halli's Games</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:Arial,sans-serif;background:#fff2f7;color:#51315f;text-align:center}header{padding:18px;font-size:31px;font-weight:900;background:linear-gradient(100deg,#ffb4d0,#ffe780,#9ee7f5)}a,button{border:0;border-radius:22px;background:#fff;color:#51315f;padding:15px 18px;font-size:20px;font-weight:900;box-shadow:0 6px #d8c9d0;text-decoration:none}.nav,.games{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:12px}.games button{min-width:145px}.stage{position:relative;max-width:820px;height:620px;margin:8px auto 20px;background:linear-gradient(#dff8ff,#fff7cf);border:6px solid white;border-radius:30px;overflow:hidden;touch-action:none}.bubble,.balloon,.star,.splash{position:absolute;display:grid;place-items:center;user-select:none;touch-action:none}.bubble{border-radius:50%;background:radial-gradient(circle at 30% 25%,white,#7ee5ff 25%,#b98cff 65%,#ff9fd1);opacity:.82}.balloon{font-size:72px}.star{font-size:58px}.center{position:absolute;inset:0;display:grid;place-items:center;font-size:150px}.babyBtns{position:absolute;bottom:20px;left:0;right:0;display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.babyBtns button{font-size:35px;padding:12px}.label{font-size:22px;font-weight:900;padding:4px}</style></head><body><header>🫧 Halli's Happy Play</header><div class="nav"><a href="index.html">🏠 Home</a></div><div class="games"><button data-game="bubbles">🫧 Bubbles</button><button data-game="balloons">🎈 Balloons</button><button data-game="peek">🙈 Peek-a-Boo</button><button data-game="animals">🐶 Animals</button><button data-game="stars">⭐ Stars</button><button data-game="baby">🍼 Baby Care</button><button data-game="colors">🌈 Color Splash</button></div><div class="label" id="label">Tap a game!</div><div class="stage" id="stage"></div><script>
const stage=document.getElementById('stage'),label=document.getElementById('label');let timer=null;function stop(){if(timer)clearInterval(timer);timer=null;stage.innerHTML='';stage.onclick=null}function say(s){if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.rate=.9;speechSynthesis.speak(u)}}function pop(el){el.style.transform='scale(1.8)';el.style.opacity=0;setTimeout(()=>el.remove(),180)}function bubble(){let b=document.createElement('div'),z=55+Math.random()*70;b.className='bubble';b.style.width=b.style.height=z+'px';b.style.left=Math.random()*Math.max(20,stage.clientWidth-z)+'px';b.style.top=stage.clientHeight+'px';b.style.transition='top 5s linear,transform .18s,opacity .18s';b.onpointerdown=e=>{e.stopPropagation();pop(b)};stage.appendChild(b);requestAnimationFrame(()=>b.style.top='-120px');setTimeout(()=>b.remove(),5200)}
function game(k){stop();if(k==='bubbles'){label.textContent='🫧 Pop the bubbles!';for(let i=0;i<8;i++)setTimeout(bubble,i*180);timer=setInterval(bubble,650)}if(k==='balloons'){label.textContent='🎈 Pop the balloons!';let add=()=>{let b=document.createElement('div');b.className='balloon';b.textContent=['🎈','🎈','🎈'][0];b.style.left=Math.random()*Math.max(20,stage.clientWidth-80)+'px';b.style.top=stage.clientHeight+'px';b.style.transition='top 6s linear,transform .2s,opacity .2s';b.onpointerdown=e=>{e.stopPropagation();pop(b);say('Pop!')};stage.appendChild(b);requestAnimationFrame(()=>b.style.top='-100px');setTimeout(()=>b.remove(),6200)};for(let i=0;i<5;i++)setTimeout(add,i*250);timer=setInterval(add,900)}if(k==='peek'){label.textContent='🙈 Tap the hands!';let d=document.createElement('div');d.className='center';d.textContent='🙈';d.onclick=()=>{d.textContent='👶';say('Peek a boo!');setTimeout(()=>d.textContent='🙈',1100)};stage.appendChild(d)}if(k==='animals'){label.textContent='🐾 Tap an animal!';let a=document.createElement('div');a.className='center';a.style.fontSize='90px';a.style.display='flex';a.style.flexWrap='wrap';a.style.gap='22px';a.style.justifyContent='center';a.style.alignContent='center';[['🐶','Woof woof'],['🐱','Meow'],['🐮','Moo'],['🦆','Quack quack'],['🐷','Oink oink'],['🐑','Baa baa']].forEach(q=>{let b=document.createElement('button');b.textContent=q[0];b.style.fontSize='65px';b.onclick=()=>say(q[1]);a.appendChild(b)});stage.appendChild(a)}if(k==='stars'){label.textContent='⭐ Touch the night sky!';stage.style.background='#17224f';stage.onclick=e=>{let r=stage.getBoundingClientRect(),s=document.createElement('div');s.className='star';s.textContent='⭐';s.style.left=(e.clientX-r.left-25)+'px';s.style.top=(e.clientY-r.top-25)+'px';stage.appendChild(s);say('Twinkle!')}}else if(k!=='stars')stage.style.background='linear-gradient(#dff8ff,#fff7cf)';if(k==='baby'){label.textContent='🍼 Help the baby!';stage.innerHTML='<div class="center">👶</div><div class="babyBtns"><button>🍼</button><button>🧸</button><button>🛌</button><button>💗</button></div>';[...stage.querySelectorAll('button')].forEach((b,i)=>b.onclick=()=>{let words=['Yum yum!','Teddy bear!','Night night!','Love you!'];say(words[i]);label.textContent=words[i]})}if(k==='colors'){label.textContent='🌈 Touch anywhere!';let cs=['#ff6b8a','#ffd84d','#6fd36f','#62c9ff','#a77bf3','#ff9f43'];stage.onclick=e=>{let r=stage.getBoundingClientRect(),s=document.createElement('div');s.className='splash';let z=70+Math.random()*80;s.style.width=s.style.height=z+'px';s.style.borderRadius=Math.random()>.5?'50%':'20%';s.style.background=cs[Math.floor(Math.random()*cs.length)];s.style.left=e.clientX-r.left-z/2+'px';s.style.top=e.clientY-r.top-z/2+'px';stage.appendChild(s)}}}
document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>game(b.dataset.game));game('bubbles');
</script></body></html>
