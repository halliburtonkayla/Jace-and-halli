<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>🫧 Halli's Games</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial Rounded MT Bold,Arial,sans-serif;background:#fff7df;color:#25324a;touch-action:manipulation}header{padding:18px;text-align:center;background:linear-gradient(135deg,#73d7ff,#ffe274,#ff9fc9);border-bottom:6px solid #fff}h1{margin:0;font-size:clamp(28px,6vw,52px)}main{max-width:1000px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:14px}.card,.btn{display:block;text-decoration:none;color:inherit;text-align:center;border:0;border-radius:26px;padding:20px 12px;font-size:20px;font-weight:800;background:white;box-shadow:0 5px 0 #d5d5d5}.card{min-height:145px}.emo{display:block;font-size:58px;margin-bottom:8px}.btn{display:inline-block;min-height:auto;padding:13px 18px;background:#ffe36f}.back{margin-bottom:15px}.panel{background:white;border-radius:25px;padding:16px;margin:12px 0}.status{text-align:center;font-size:24px;font-weight:900;min-height:40px}button:active,.card:active{transform:translateY(3px)}</style></head><body><header><h1>🫧 Halli's Games</h1></header><main><a class="btn back" href="index.html">🏠 Home</a><div class="grid"><a class="card" href="bubbles.html"><span class="emo">🫧</span>Pop Bubbles</a><button class="card" data-say="moo"><span class="emo">🐮</span>Animal Sounds</button><button class="card" data-say="peek a boo"><span class="emo">🙈</span>Peek-a-Boo</button><button class="card" data-say="ding ding music"><span class="emo">🎵</span>Music</button><button class="card" data-say="red blue yellow green"><span class="emo">🌈</span>Colors</button><button class="card" data-say="pop"><span class="emo">🎈</span>Balloons</button><button class="card" data-say="twinkle twinkle"><span class="emo">⭐</span>Stars</button><button class="card" data-say="baby teddy bear ball"><span class="emo">🧸</span>Baby & Toys</button></div><div class="status" id="msg"></div></main><script>document.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>{msg.textContent=b.dataset.say.toUpperCase()+'!';if('speechSynthesis'in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(b.dataset.say))}b.animate([{transform:'scale(1)'},{transform:'scale(1.12)'},{transform:'scale(1)'}],{duration:350})});</script></body></html>
