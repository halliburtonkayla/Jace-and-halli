<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Town Driving</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:#111;font-family:Arial Rounded MT Bold,Arial,sans-serif}canvas{width:100%;height:100%;display:block;touch-action:none}.home{position:fixed;z-index:5;left:12px;top:12px;width:58px;height:58px;border-radius:50%;border:4px solid #fff;background:#1788e8;color:#fff;font-size:25px;font-weight:900}.hud{position:fixed;z-index:5;right:12px;top:12px;background:#0009;border:3px solid #fff;border-radius:20px;padding:9px 14px;color:#fff;font-size:18px}.ctrl{position:fixed;z-index:5;bottom:18px;width:92px;height:92px;border-radius:50%;border:5px solid #fff;font-size:24px;font-weight:1000;box-shadow:0 8px 20px #0008}.left{left:18px}.right{left:122px}.go{right:20px;width:112px;height:112px;background:#54df65}.restart{position:fixed;z-index:5;right:16px;top:68px;border:3px solid #fff;border-radius:18px;padding:10px;background:#ffd43b;font-weight:900}.celebrate{display:none;position:fixed;inset:0;z-index:9;align-items:center;justify-content:center;flex-direction:column;background:#123a8cdd;color:#fff;font-size:60px;text-align:center}.celebrate button{font-size:25px;padding:18px;border-radius:20px}</style></head><body><button class="home" onclick="location.href='jace.html'">⌂</button><div class="hud"><b id="score">0%</b></div><button class="restart" onclick="reset()">↻</button><canvas id="g"></canvas><button class="ctrl left" id="L">◀</button><button class="ctrl right" id="R">▶</button><button class="ctrl go" id="G">GO</button><div class="celebrate" id="yay">★ GREAT JOB! ★<button onclick="reset()">PLAY AGAIN</button></div><script>
const TYPE='town',c=document.getElementById('g'),x=c.getContext('2d');let W,H,dpr,px=0,py=0,ang=-Math.PI/2,speed=0,keys={l:0,r:0,g:0},trail=[],score=0,particles=[],objects=[],last=performance.now();
function size(){dpr=devicePixelRatio||1;W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',size);size();
function hold(id,k){let e=document.getElementById(id);e.onpointerdown=q=>{q.preventDefault();keys[k]=1;e.setPointerCapture?.(q.pointerId)};['pointerup','pointercancel','pointerleave'].forEach(n=>e.addEventListener(n,()=>keys[k]=0))}hold('L','l');hold('R','r');hold('G','g');
function reset(){px=W*.5;py=H*.67;ang=-Math.PI/2;speed=0;trail=[];score=0;particles=[];document.getElementById('score').textContent='0%';document.getElementById('yay').style.display='none';objects=[];for(let i=0;i<18;i++)objects.push({x:70+Math.random()*(W-140),y:120+Math.random()*(H-260),r:18+Math.random()*16,t:i%5})}reset();
function bg(){let grad=x.createLinearGradient(0,0,0,H);grad.addColorStop(0,TYPE==='farm'?'#73c9ff':TYPE==='monster'?'#efb260':TYPE==='construction'?'#ffd06a':TYPE==='town'?'#76d5ff':'#78d86d');grad.addColorStop(.45,TYPE==='monster'?'#d18a42':'#bce98d');grad.addColorStop(1,TYPE==='monster'?'#8b542f':'#56aa4c');x.fillStyle=grad;x.fillRect(0,0,W,H);
if(TYPE==='town'){x.fillStyle='#555';x.fillRect(W*.18,0,W*.28,H);x.fillRect(0,H*.35,W,H*.22);x.strokeStyle='#fff';x.setLineDash([25,20]);x.lineWidth=4;x.beginPath();x.moveTo(W*.32,0);x.lineTo(W*.32,H);x.moveTo(0,H*.46);x.lineTo(W,H*.46);x.stroke();x.setLineDash([])}
else if(TYPE==='farm'){x.fillStyle='#b97a42';x.fillRect(0,H*.18,W*.34,H*.32);x.fillStyle='#e2b84c';for(let i=0;i<8;i++)x.fillRect(i*W/8,H*.56,W/16,H*.35)}
else if(TYPE==='construction'){x.fillStyle='#b78652';x.beginPath();x.arc(W*.25,H*.35,90,0,7);x.fill();x.fillStyle='#777';x.beginPath();x.arc(W*.76,H*.42,75,0,7);x.fill()}
else if(TYPE==='monster'){for(let i=0;i<6;i++){x.fillStyle='#6b3f25';x.beginPath();x.arc(i*W/5,H*.65+Math.sin(i)*45,70,Math.PI,0);x.fill()}}
else{x.fillStyle='#2f8f35';for(let i=0;i<80;i++){let gx=(i*79)%W,gy=100+(i*47)%(H-130);x.fillRect(gx,gy,3,18)}}
}
function deco(){objects.forEach(o=>{x.save();x.translate(o.x,o.y);if(TYPE==='yard'){x.fillStyle=o.t===0?'#69452b':o.t===1?'#e94b7c':'#2c7736';x.beginPath();x.arc(0,0,o.r,0,7);x.fill()}else if(TYPE==='farm'){x.fillStyle=o.t<2?'#d9b04b':'#7a4a2d';x.fillRect(-o.r,-o.r,o.r*2,o.r*2)}else if(TYPE==='monster'){x.strokeStyle='#222';x.lineWidth=8;x.beginPath();x.arc(0,0,o.r,0,7);x.stroke()}else if(TYPE==='construction'){x.fillStyle='#777';x.beginPath();x.arc(0,0,o.r,0,7);x.fill()}else{x.fillStyle=['#f35','#fc3','#58d','#fff'][o.t%4];x.fillRect(-o.r,-o.r,o.r*2,o.r*1.5)}x.restore()})}
function vehicle(){x.save();x.translate(px,py);x.rotate(ang+Math.PI/2);let bounce=TYPE==='monster'?Math.sin(performance.now()/90)*4:0;x.translate(0,bounce);x.fillStyle='#111';x.fillRect(-35,-36,14,75);x.fillRect(21,-36,14,75);x.fillStyle=TYPE==='farm'?'#43a94b':TYPE==='monster'?'#e52f2f':TYPE==='construction'?'#f4c430':TYPE==='town'?'#2788e8':'#d93b2f';x.beginPath();x.roundRect(-31,-48,62,98,14);x.fill();x.fillStyle='#bde8ff';x.fillRect(-22,-30,44,26);if(TYPE==='yard'){x.fillStyle='#222';x.fillRect(-38,32,76,25)}if(TYPE==='farm'){x.fillStyle='#222';x.fillRect(-24,34,48,28)}if(TYPE==='monster'){x.strokeStyle='#111';x.lineWidth=12;x.beginPath();x.arc(-37,-25,18,0,7);x.arc(37,-25,18,0,7);x.arc(-37,30,18,0,7);x.arc(37,30,18,0,7);x.stroke()}x.restore()}
function update(dt){if(keys.g)speed=Math.min(TYPE==='monster'?220:150,speed+120*dt);else speed=Math.max(0,speed-60*dt);let turn=(keys.r?1:0)-(keys.l?1:0);ang+=turn*2.25*dt*(.25+speed/150);let nx=px+Math.cos(ang)*speed*dt,ny=py+Math.sin(ang)*speed*dt;let hit=objects.some(o=>Math.hypot(nx-o.x,ny-o.y)<o.r+30);if(hit){speed*=-.22}else{px=nx;py=ny;if(speed>20){trail.push({x:px,y:py,a:ang});if(trail.length>900)trail.shift();score=Math.min(100,score+dt*.85);document.getElementById('score').textContent=Math.floor(score)+'%';if(TYPE==='yard'||TYPE==='farm')for(let i=0;i<2;i++)particles.push({x:px+(Math.random()-.5)*45,y:py+(Math.random()-.5)*45,vx:(Math.random()-.5)*50,vy:-Math.random()*45,l:1})}}if(px<25||px>W-25||py<75||py>H-25){px=Math.max(25,Math.min(W-25,px));py=Math.max(75,Math.min(H-25,py));speed*=-.2}particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt});particles=particles.filter(p=>p.l>0);if(score>=90)document.getElementById('yay').style.display='flex'}
function draw(){bg();if(TYPE==='yard'||TYPE==='farm'){x.strokeStyle=TYPE==='yard'?'#9bd56e':'#d5c06b';x.lineWidth=58;x.lineCap='round';x.beginPath();trail.forEach((p,i)=>i?x.lineTo(p.x,p.y):x.moveTo(p.x,p.y));x.stroke()}deco();particles.forEach(p=>{x.globalAlpha=p.l;x.fillStyle='#b9dc54';x.fillRect(p.x,p.y,5,5)});x.globalAlpha=1;vehicle()}
function loop(t){let dt=Math.min(.035,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
