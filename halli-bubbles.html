<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Bubble Pop</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Arial,sans-serif;background:#fff8df;color:#17335c;overscroll-behavior:none}
header{padding:20px 12px;text-align:center;font-size:clamp(28px,7vw,44px);font-weight:900;background:linear-gradient(110deg,#65d9ef,#ffe56d,#ff9db4)}
.wrap{max-width:900px;margin:auto;padding:16px}
nav{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
a,button{border:0;border-radius:22px;padding:15px 18px;font-size:clamp(18px,4vw,25px);font-weight:900;background:#ffe36d;color:#17335c;text-decoration:none;box-shadow:0 6px 0 #d3d3d3;touch-action:manipulation}
button:active,a:active{transform:translateY(3px);box-shadow:0 3px 0 #ccc}
.game{position:relative;min-height:520px;border-radius:30px;overflow:hidden;background:white;border:5px solid #eee}
.msg{text-align:center;font-size:24px;font-weight:900;padding:10px}
.big{font-size:70px}

#game{background:linear-gradient(#bfefff,#f8ffff)}
.bub{position:absolute;border-radius:50%;background:radial-gradient(circle at 30% 25%,white 0 8%,#b9f3ff88 20%,#dcaaff99 65%,#79dfffaa);border:3px solid #fff9;animation:up linear forwards}
@keyframes up{from{transform:translateY(560px)}to{transform:translateY(-130px)}}
</style></head>
<body><header>🫧 Bubble Pop</header><div class="wrap"><nav><a href="halli.html">⬅️ Halli's Games</a></nav><div class="msg">Tap every bubble! 🫧 <b id="score">0</b> pops</div><div class="game" id="game"></div></div><script>
const g=document.querySelector('#game'),s=document.querySelector('#score');let n=0;
function bubble(){let b=document.createElement('button');b.className='bub';let z=55+Math.random()*65;b.style.width=b.style.height=z+'px';b.style.left=Math.random()*Math.max(1,g.clientWidth-z)+'px';b.style.animationDuration=(4+Math.random()*3)+'s';b.setAttribute('aria-label','Pop bubble');b.addEventListener('pointerdown',e=>{e.preventDefault();n++;s.textContent=n;b.textContent='✨';b.style.background='transparent';b.style.border='0';setTimeout(()=>b.remove(),120)});g.appendChild(b);setTimeout(()=>b.remove(),7200)}
setInterval(bubble,550);for(let i=0;i<7;i++)setTimeout(bubble,i*120);
</script></body></html>
