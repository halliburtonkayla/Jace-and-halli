<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>👨‍🍳 Little Chef</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial Rounded MT Bold,Arial,sans-serif;background:#fff7df;color:#25324a;touch-action:manipulation}header{padding:18px;text-align:center;background:linear-gradient(135deg,#73d7ff,#ffe274,#ff9fc9);border-bottom:6px solid #fff}h1{margin:0;font-size:clamp(28px,6vw,52px)}main{max-width:1000px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:14px}.card,.btn{display:block;text-decoration:none;color:inherit;text-align:center;border:0;border-radius:26px;padding:20px 12px;font-size:20px;font-weight:800;background:white;box-shadow:0 5px 0 #d5d5d5}.card{min-height:145px}.emo{display:block;font-size:58px;margin-bottom:8px}.btn{display:inline-block;min-height:auto;padding:13px 18px;background:#ffe36f}.back{margin-bottom:15px}.panel{background:white;border-radius:25px;padding:16px;margin:12px 0}.status{text-align:center;font-size:24px;font-weight:900;min-height:40px}button:active,.card:active{transform:translateY(3px)}.food{font-size:48px}</style></head><body><header><h1>👨‍🍳 Little Chef</h1></header><main><a class="btn back" href="jace.html">⬅️ Jace's Games</a><div class="grid" id="foods"></div><div class="panel status" id="stage">Pick something to cook!</div></main><script>const data={"\ud83c\udf55": ["Spread sauce \ud83c\udf45", "Add cheese \ud83e\uddc0", "Add toppings \ud83c\udf44", "Bake it \ud83d\udd25", "Pizza ready! \ud83c\udf55"], "\ud83e\udd5e": ["Pour batter \ud83e\udd63", "Flip it!", "Add fruit \ud83c\udf53", "Pancakes ready!"], "\ud83c\udf54": ["Make patty", "Cook it \ud83c\udf73", "Add cheese \ud83e\uddc0", "Stack it \ud83c\udf54"], "\ud83c\udf6a": ["Mix dough \ud83e\udd63", "Make shapes \u2b50", "Bake \ud83d\udd25", "Cookies ready!"], "\ud83c\udf2e": ["Fill shell", "Add cheese", "Add lettuce \ud83e\udd6c", "Taco ready!"], "\ud83e\uddc1": ["Mix batter", "Bake \ud83d\udd25", "Add frosting", "Sprinkles \u2728"]};const f=document.querySelector('#foods'),stage=document.querySelector('#stage');Object.keys(data).forEach(k=>{let b=document.createElement('button');b.className='card food';b.textContent=k;b.onclick=()=>{let i=0;function go(){stage.innerHTML='<div style="font-size:90px">'+k+'</div><p>'+data[k][i]+'</p><button class="btn" id="doit">Do it! 👆</button>';doit.onclick=()=>{i++;if(i>=data[k].length)stage.innerHTML='<div style="font-size:100px">'+k+'</div>⭐ Great cooking!';else go()}}go()};f.appendChild(b)});</script></body></html>
