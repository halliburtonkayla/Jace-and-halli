<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Jace's Little Chef</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:Arial Rounded MT Bold,Arial,sans-serif;background:linear-gradient(#7bdcff,#fff0a0);color:#56351e;user-select:none}
header{text-align:center;padding:18px;background:linear-gradient(90deg,#ef493e,#ffd83d,#4ec86b);font-size:34px;font-weight:900}.wrap{max-width:900px;margin:auto;padding:12px}
.back{display:inline-block;background:#fff;padding:11px 15px;border-radius:18px;text-decoration:none;color:#56351e;font-weight:900}.recipes{display:flex;gap:8px;overflow-x:auto;padding:12px 0}.recipes button,.action{border:0;border-radius:18px;padding:12px;background:#fff;font-weight:900;font-size:17px;box-shadow:0 5px 0 #0002;min-width:100px}
.kitchen{background:#fff;border-radius:28px;padding:12px}.instruction{text-align:center;font-size:23px;font-weight:900;min-height:62px}.counter{position:relative;height:420px;background:linear-gradient(#fff6d9 0 66%,#d79b62 66%);border-radius:24px;overflow:hidden;touch-action:none}
.target{position:absolute;left:50%;top:185px;transform:translateX(-50%);width:260px;height:150px;border:5px dashed #b6a17e;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:60px}
.item{position:absolute;font-size:58px;touch-action:none;cursor:grab;filter:drop-shadow(0 5px 3px #0003);z-index:5}.item.drag{transform:scale(1.15)}
.pan{position:absolute;left:50%;top:185px;transform:translateX(-50%);font-size:130px}.food{position:absolute;left:50%;top:220px;transform:translateX(-50%);font-size:90px;z-index:4}
.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}.action{background:#ffe04d;font-size:19px}.progress{text-align:center;font-size:24px;padding:8px;font-weight:900}.hidden{display:none}
#stirZone{position:absolute;left:50%;top:175px;transform:translateX(-50%);width:230px;height:180px;border-radius:50%;background:#e9d2a5;border:8px solid #9c714b;display:flex;align-items:center;justify-content:center;font-size:80px;touch-action:none}
</style></head><body><header>👨‍🍳 Jace's Little Chef</header><div class="wrap"><a class="back" href="jace.html">⬅️ Jace's World</a>
<div class="recipes" id="recipes"></div><div class="kitchen"><div class="instruction" id="inst">Pick something to cook!</div><div class="progress" id="progress"></div><div class="counter" id="counter"></div><div class="controls" id="controls"></div></div></div>
<script>
const recipes={
burger:{name:'Burger',icon:'🍔',parts:[['🍞','Bottom bun'],['🥩','Patty'],['🧀','Cheese'],['🥬','Lettuce'],['🍅','Tomato'],['🍞','Top bun']],type:'stack'},
pizza:{name:'Pizza',icon:'🍕',parts:[['🫓','Dough'],['🍅','Sauce'],['🧀','Cheese'],['🍕','Pepperoni']],type:'stack'},
sandwich:{name:'Sandwich',icon:'🥪',parts:[['🍞','Bread'],['🥩','Meat'],['🧀','Cheese'],['🥬','Lettuce'],['🍞','Bread']],type:'stack'},
tacos:{name:'Tacos',icon:'🌮',parts:[['🌮','Shell'],['🥩','Meat'],['🧀','Cheese'],['🥬','Lettuce'],['🍅','Tomato']],type:'stack'},
pancakes:{name:'Pancakes',icon:'🥞',parts:[['🥣','Mix'],['🥚','Egg'],['🥛','Milk']],type:'mix'},
cookies:{name:'Cookies',icon:'🍪',parts:[['🥣','Flour'],['🧈','Butter'],['🥚','Egg'],['🍫','Chocolate chips']],type:'mix'},
cupcakes:{name:'Cupcakes',icon:'🧁',parts:[['🥣','Mix'],['🥚','Egg'],['🥛','Milk']],type:'mix'},
eggs:{name:'Eggs',icon:'🍳',parts:[['🥚','Egg'],['🧈','Butter']],type:'pan'},
spaghetti:{name:'Spaghetti',icon:'🍝',parts:[['🍝','Noodles'],['💧','Water'],['🍅','Sauce']],type:'mix'},
nuggets:{name:'Nuggets',icon:'🍗',parts:[['🍗','Chicken'],['🥣','Breading']],type:'mix'}
};
let cur=null,step=0,placed=[],stirCount=0,cooked=false;const C=document.querySelector('#counter'),I=document.querySelector('#inst'),P=document.querySelector('#progress'),CTL=document.querySelector('#controls');
function say(t){if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.rate=.9;speechSynthesis.speak(u)}}
Object.keys(recipes).forEach(k=>{let b=document.createElement('button');b.innerHTML=recipes[k].icon+'<br>'+recipes[k].name;b.onclick=()=>start(k);document.querySelector('#recipes').appendChild(b)});
function start(k){cur=recipes[k];step=0;placed=[];cooked=false;C.innerHTML='<div class="target" id="target">🍽️</div>';CTL.innerHTML='';I.textContent='Drag the '+cur.parts[0][1]+' onto the plate.';P.textContent='Step 1 of '+(cur.parts.length+2);spawn();say(I.textContent)}
function spawn(){document.querySelectorAll('.item').forEach(x=>x.remove());let [emoji,name]=cur.parts[step];let d=document.createElement('div');d.className='item';d.textContent=emoji;d.dataset.name=name;d.style.left=(25+(step%3)*100)+'px';d.style.top='35px';C.appendChild(d);drag(d)}
function drag(el){let offX=0,offY=0;el.onpointerdown=e=>{el.setPointerCapture(e.pointerId);let r=el.getBoundingClientRect();offX=e.clientX-r.left;offY=e.clientY-r.top;el.classList.add('drag')};el.onpointermove=e=>{if(!el.hasPointerCapture(e.pointerId))return;let r=C.getBoundingClientRect();el.style.left=(e.clientX-r.left-offX)+'px';el.style.top=(e.clientY-r.top-offY)+'px'};el.onpointerup=e=>{el.classList.remove('drag');let a=el.getBoundingClientRect(),t=document.querySelector('#target').getBoundingClientRect();if(a.left<t.right&&a.right>t.left&&a.top<t.bottom&&a.bottom>t.top){placed.push(el.textContent);el.remove();step++;document.querySelector('#target').textContent=placed.join('');if(step<cur.parts.length){I.textContent='Great! Now drag the '+cur.parts[step][1]+'.';P.textContent='Step '+(step+1)+' of '+(cur.parts.length+2);say(I.textContent);spawn()}else nextStage()}else{I.textContent='Oops! Drag it onto the plate.'}}}
function nextStage(){P.textContent='Mixing time!';if(cur.type==='stack'){I.textContent='You built it! Now press COOK.';button('🔥 COOK',cook)}else{I.textContent='Use your finger to stir in circles!';C.innerHTML='<div id="stirZone">🥣</div>';let z=document.querySelector('#stirZone');let active=false,lastAngle=null,total=0;z.onpointerdown=e=>{active=true;z.setPointerCapture(e.pointerId)};z.onpointermove=e=>{if(!active)return;let r=z.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,a=Math.atan2(e.clientY-cy,e.clientX-cx);if(lastAngle!==null){let diff=Math.abs(a-lastAngle);if(diff>Math.PI)diff=2*Math.PI-diff;total+=diff;z.style.transform='translateX(-50%) rotate('+(total*40)+'deg)';if(total>8){active=false;I.textContent='Great stirring! Now cook it.';say(I.textContent);CTL.innerHTML='';button('🔥 COOK',cook)}}lastAngle=a};z.onpointerup=()=>active=false}}
function button(txt,fn){let b=document.createElement('button');b.className='action';b.textContent=txt;b.onclick=fn;CTL.appendChild(b)}
function cook(){CTL.innerHTML='';I.textContent='Cooking... watch it!';C.innerHTML='<div class="pan">🍳</div><div class="food">'+(cur.type==='stack'?placed.join(''): '🥣')+'</div>';let n=3;let timer=document.createElement('div');timer.style='position:absolute;top:30px;left:0;right:0;text-align:center;font-size:70px;font-weight:900';timer.textContent=n;C.appendChild(timer);let id=setInterval(()=>{n--;timer.textContent=n||'✨';if(n<=0){clearInterval(id);cooked=true;C.innerHTML='<div style="font-size:150px;text-align:center;padding-top:120px">'+cur.icon+'</div>';I.textContent='YUM! You really made '+cur.name+'!';P.textContent='⭐ ⭐ ⭐';say('Great job Chef Jace! You made '+cur.name+'!');button('🍽️ MAKE IT AGAIN',()=>start(Object.keys(recipes).find(k=>recipes[k]===cur))) }},700)}
</script></body></html>
