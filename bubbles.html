<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>🫧 Bubble World</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial Rounded MT Bold,Arial,sans-serif;background:#fff7df;color:#25324a;touch-action:manipulation}header{padding:18px;text-align:center;background:linear-gradient(135deg,#73d7ff,#ffe274,#ff9fc9);border-bottom:6px solid #fff}h1{margin:0;font-size:clamp(28px,6vw,52px)}main{max-width:1000px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:14px}.card,.btn{display:block;text-decoration:none;color:inherit;text-align:center;border:0;border-radius:26px;padding:20px 12px;font-size:20px;font-weight:800;background:white;box-shadow:0 5px 0 #d5d5d5}.card{min-height:145px}.emo{display:block;font-size:58px;margin-bottom:8px}.btn{display:inline-block;min-height:auto;padding:13px 18px;background:#ffe36f}.back{margin-bottom:15px}.panel{background:white;border-radius:25px;padding:16px;margin:12px 0}.status{text-align:center;font-size:24px;font-weight:900;min-height:40px}button:active,.card:active{transform:translateY(3px)}#field{position:relative;height:560px;border-radius:28px;overflow:hidden;background:linear-gradient(#bdeaff,#f6eaff)}.bubble{position:absolute;border-radius:50%;border:4px solid white;background:rgba(255,130,210,.45);font-size:30px}</style></head><body><header><h1>🫧 Bubble World</h1></header><main><a class="btn back" href="jace.html">⬅️ Jace's Games</a><button class="btn" id="more">More Bubbles!</button><div class="status" id="score">Pop them!</div><div id="field"></div></main><script>let n=0;function add(){for(let i=0;i<18;i++){let b=document.createElement('button'),z=55+Math.random()*70;b.className='bubble';b.style.width=b.style.height=z+'px';b.style.left=Math.random()*85+'%';b.style.top=Math.random()*85+'%';b.textContent='🫧';b.onclick=()=>{b.remove();score.textContent='POP! ⭐ '+(++n)};field.appendChild(b)}}more.onclick=add;add();</script></body></html>
