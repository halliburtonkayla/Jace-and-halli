<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Color Splash</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Arial,sans-serif;background:#fff8df;color:#17335c;overscroll-behavior:none}
header{padding:20px 12px;text-align:center;font-size:clamp(28px,7vw,44px);font-weight:900;background:linear-gradient(110deg,#65d9ef,#ffe56d,#ff9db4)}
.wrap{max-width:900px;margin:auto;padding:16px}
nav{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
a,button{border:0;border-radius:22px;padding:15px 18px;font-size:clamp(18px,4vw,25px);font-weight:900;background:#ffe36d;color:#17335c;text-decoration:none;box-shadow:0 6px 0 #d3d3d3;touch-action:manipulation}
button:active,a:active{transform:translateY(3px);box-shadow:0 3px 0 #ccc}
.game{position:relative;min-height:520px;border-radius:30px;overflow:hidden;background:white;border:5px solid #eee}
.msg{text-align:center;font-size:24px;font-weight:900;padding:10px}
.big{font-size:70px}

#splash{background:#fff;touch-action:none}.spot{position:absolute;width:110px;height:110px;border-radius:50%;transform:translate(-50%,-50%);animation:pop .35s}@keyframes pop{from{transform:translate(-50%,-50%) scale(.1)}to{transform:translate(-50%,-50%) scale(1)}}
</style></head>
<body><header>🌈 Color Splash</header><div class="wrap"><nav><a href="halli.html">⬅️ Halli's Games</a></nav><div class="msg" id="name">Tap anywhere! 🌈</div><div class="game" id="splash"></div></div><script>
const g=document.querySelector('#splash'),nm=document.querySelector('#name');let cs=[['Red','#f44336'],['Blue','#2196f3'],['Yellow','#ffdf32'],['Green','#4caf50'],['Purple','#9c6ade'],['Pink','#ff72a5'],['Orange','#ff8c32']];
g.onpointerdown=e=>{let r=g.getBoundingClientRect(),c=cs[Math.floor(Math.random()*cs.length)],d=document.createElement('div');d.className='spot';d.style.background=c[1];d.style.left=(e.clientX-r.left)+'px';d.style.top=(e.clientY-r.top)+'px';g.appendChild(d);nm.textContent=c[0]+'! ✨';if('speechSynthesis'in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(c[0]))}}
</script></body></html>
