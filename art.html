<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Jace & Halli Coloring Book</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#fff8df;font-family:Arial Rounded MT Bold,Arial,sans-serif;color:#17335c}
header{padding:22px 10px;text-align:center;font-size:32px;font-weight:900;background:linear-gradient(110deg,#65d9ef,#ffe56d,#ff9db4)}
.wrap{max-width:950px;margin:auto;padding:14px}
.nav,.palette,.pages{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center;margin:12px 0}
button,a{border:0;border-radius:20px;padding:13px 16px;font-size:18px;font-weight:900;background:#ffe36d;color:#17335c;box-shadow:0 5px #ccc;text-decoration:none}
.pagebtn{background:#eadfff}.pagebtn.active{outline:5px solid #17335c}
.swatch{width:48px;height:48px;border-radius:50%;padding:0;border:4px solid white;box-shadow:0 0 0 2px #aaa}
.swatch.active{outline:5px solid #17335c}
.book{background:white;border:7px solid #ddd;border-radius:28px;padding:10px;overflow:hidden;box-shadow:0 10px 28px #0002}
svg{display:block;width:100%;height:auto;max-height:68vh;touch-action:manipulation;background:white}
.paint{fill:#fff;stroke:#202020;stroke-width:5;stroke-linejoin:round;stroke-linecap:round;cursor:pointer}
.detail{fill:none;stroke:#202020;stroke-width:5;stroke-linejoin:round;stroke-linecap:round;pointer-events:none}
#status{text-align:center;font-weight:900;font-size:18px;padding:8px}
</style>
</head>
<body>
<header>Jace & Halli's Stay-In-The-Lines Coloring Book</header>
<div class="wrap">
 <div class="nav"><a href="index.html">Home</a><button onclick="resetPage()">New Copy</button></div>
 <div class="pages">
  <button class="pagebtn active" data-page="truck">Monster Truck</button>
  <button class="pagebtn" data-page="dino">Dinosaur</button>
  <button class="pagebtn" data-page="doll">Baby Doll</button>
  <button class="pagebtn" data-page="balloons">Balloons</button>
  <button class="pagebtn" data-page="blocks">Toy Blocks</button>
 </div>
 <div class="palette" id="palette"></div>
 <div id="status">Pick a color, then tap a section. The color stays inside the lines.</div>
 <div class="book" id="book"></div>
</div>
<script>
const colors=['#ef4444','#f97316','#facc15','#84cc16','#22c55e','#06b6d4','#3b82f6','#6366f1','#a855f7','#ec4899','#8b5e3c','#111827','#ffffff'];
let color=colors[0],current='truck';
const pal=document.getElementById('palette');
colors.forEach((c,i)=>{const b=document.createElement('button');b.className='swatch'+(i===0?' active':'');b.style.background=c;b.onclick=()=>{color=c;document.querySelectorAll('.swatch').forEach(x=>x.classList.remove('active'));b.classList.add('active')};pal.appendChild(b)});

const sheets={
truck:`<svg viewBox="0 0 800 600" aria-label="Monster truck coloring sheet">
<rect class="paint" x="0" y="0" width="800" height="600"/>
<path class="paint" d="M155 325 L255 325 L315 235 L515 235 L590 325 L675 325 L700 410 L120 410 Z"/>
<path class="paint" d="M330 255 L405 255 L405 320 L285 320 Z"/><path class="paint" d="M425 255 L500 255 L560 320 L425 320 Z"/>
<circle class="paint" cx="235" cy="430" r="82"/><circle class="paint" cx="585" cy="430" r="82"/>
<circle class="paint" cx="235" cy="430" r="34"/><circle class="paint" cx="585" cy="430" r="34"/>
<path class="detail" d="M150 365 H675 M115 410 H705 M350 350 h120 M170 330 l-35-45 h-55"/>
</svg>`,
dino:`<svg viewBox="0 0 800 600" aria-label="Dinosaur coloring sheet">
<rect class="paint" x="0" y="0" width="800" height="600"/>
<path class="paint" d="M105 375 C155 245 300 220 420 280 C470 305 515 280 535 220 C552 170 625 145 680 185 C735 225 710 305 640 315 C590 323 555 350 555 395 L540 470 L470 470 L455 395 C405 430 345 442 275 425 L250 495 L180 495 L185 405 C145 405 115 395 105 375 Z"/>
<path class="paint" d="M205 300 L170 245 L240 275 Z"/><path class="paint" d="M285 267 L265 205 L330 260 Z"/><path class="paint" d="M370 272 L375 205 L420 285 Z"/>
<circle class="paint" cx="650" cy="220" r="13"/><path class="detail" d="M630 265 q35 20 62 -5 M105 375 C65 350 50 320 60 285"/>
</svg>`,
doll:`<svg viewBox="0 0 800 600" aria-label="Baby doll coloring sheet">
<rect class="paint" x="0" y="0" width="800" height="600"/>
<circle class="paint" cx="400" cy="175" r="105"/>
<path class="paint" d="M300 315 Q400 265 500 315 L540 470 Q400 520 260 470 Z"/>
<path class="paint" d="M305 330 Q220 340 175 410 L225 445 Q280 405 330 390 Z"/>
<path class="paint" d="M495 330 Q580 340 625 410 L575 445 Q520 405 470 390 Z"/>
<path class="paint" d="M330 475 L310 555 L370 555 L400 485 Z"/><path class="paint" d="M470 475 L490 555 L430 555 L400 485 Z"/>
<path class="paint" d="M315 115 Q400 45 485 115 Q470 70 400 65 Q330 70 315 115 Z"/>
<circle class="detail" cx="360" cy="170" r="8"/><circle class="detail" cx="440" cy="170" r="8"/><path class="detail" d="M365 215 Q400 240 435 215"/>
</svg>`,
balloons:`<svg viewBox="0 0 800 600" aria-label="Balloons coloring sheet">
<rect class="paint" x="0" y="0" width="800" height="600"/>
<ellipse class="paint" cx="200" cy="190" rx="90" ry="115"/><ellipse class="paint" cx="395" cy="145" rx="95" ry="120"/><ellipse class="paint" cx="595" cy="205" rx="92" ry="118"/>
<ellipse class="paint" cx="300" cy="340" rx="86" ry="110"/><ellipse class="paint" cx="505" cy="350" rx="86" ry="110"/>
<path class="detail" d="M200 305 C230 400 335 435 400 550 M395 265 C390 360 420 455 400 550 M595 323 C555 405 470 455 400 550 M300 450 C330 495 365 520 400 550 M505 460 C475 500 445 525 400 550"/>
</svg>`,
blocks:`<svg viewBox="0 0 800 600" aria-label="Toy blocks coloring sheet">
<rect class="paint" x="0" y="0" width="800" height="600"/>
<rect class="paint" x="115" y="370" width="180" height="150" rx="12"/><rect class="paint" x="310" y="370" width="180" height="150" rx="12"/><rect class="paint" x="505" y="370" width="180" height="150" rx="12"/>
<rect class="paint" x="210" y="205" width="180" height="150" rx="12"/><rect class="paint" x="405" y="205" width="180" height="150" rx="12"/>
<rect class="paint" x="310" y="40" width="180" height="150" rx="12"/>
<path class="detail" d="M180 470 Q205 405 230 470 Z M365 410 h70 l-35 70 Z M570 420 q35-40 70 0 q-35 60-70 0 M275 250 h50 v60 h-50 Z M455 250 q40-50 80 0 q-40 65-80 0 M360 95 h80 M400 55 v80"/>
</svg>`
};

function render(){
 const book=document.getElementById('book');book.innerHTML=sheets[current];
 book.querySelectorAll('.paint').forEach(el=>el.addEventListener('pointerdown',e=>{e.preventDefault();el.style.fill=color}));
}
function resetPage(){render();document.getElementById('status').textContent='Fresh page ready. Tap inside a shape to color it.'}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{current=b.dataset.page;document.querySelectorAll('[data-page]').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()});
render();
</script>
</body>
</html>
