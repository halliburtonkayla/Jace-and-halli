<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Jace & Halli Whiteboard</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;background:#dcecff;font-family:Arial Rounded MT Bold,Arial,sans-serif;color:#17335c}.app{height:100dvh;display:flex;flex-direction:column;padding:max(8px,env(safe-area-inset-top)) 8px max(8px,env(safe-area-inset-bottom));gap:8px}.top{height:66px;display:flex;gap:8px;align-items:center;justify-content:center;flex:0 0 auto}.home,.who,#clear,.eraser{border:0;border-radius:18px;background:white;font-weight:900;color:#17335c;box-shadow:0 4px 0 #0002}.home{width:58px;height:58px;display:grid;place-items:center;text-decoration:none;font-size:15px}.who{width:58px;height:58px;padding:3px;border-radius:50%;overflow:hidden}.who img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}.who.on{outline:5px solid #ffd94d}#clear{height:54px;padding:0 14px;font-size:13px}.board{flex:1 1 auto;min-height:0;width:min(98vw,1000px);margin:0 auto;background:#fff;border:9px solid #c99b62;border-radius:18px;box-shadow:0 8px 22px #0003;overflow:hidden;touch-action:none}.board canvas{width:100%;height:100%;display:block;touch-action:none}.tray{height:68px;flex:0 0 68px;display:flex;align-items:center;justify-content:center;gap:7px;overflow-x:auto;overflow-y:hidden;padding:4px 2px;touch-action:pan-x}.marker{flex:0 0 50px;width:50px;height:50px;border-radius:50%;border:5px solid white;box-shadow:0 3px 7px #0004}.eraser{flex:0 0 62px;height:50px;position:relative}.eraser:before{content:"";position:absolute;width:34px;height:20px;border-radius:7px;background:linear-gradient(135deg,#ff9bc5 0 48%,#eef2f7 49%);left:14px;top:15px;transform:rotate(-18deg)}@media(max-height:650px){.top{height:54px}.home,.who{width:48px;height:48px}#clear{height:46px}.tray{height:58px;flex-basis:58px}.marker{width:42px;height:42px;flex-basis:42px}.eraser{height:42px}.eraser:before{top:11px}}</style></head><body><main class="app"><div class="top"><a class="home" id="home" href="halli.html">HOME</a><button class="who" id="j" aria-label="Jace"><img src="assets/jace-photo.jpg" alt="Jace"></button><button class="who on" id="h" aria-label="Halli"><img src="assets/halli-photo.jpg" alt="Halli"></button><button id="clear">CLEAR</button></div><div class="board" id="board"><canvas id="c"></canvas></div><div class="tray" id="tray"></div></main><script>const c=document.getElementById('c'),x=c.getContext('2d'),board=document.getElementById('board');let color='#111',size=10,drawing=false,last=null;function fit(){const r=board.getBoundingClientRect();const old=document.createElement('canvas');old.width=c.width;old.height=c.height;if(c.width&&c.height)old.getContext('2d').drawImage(c,0,0);c.width=Math.max(1,Math.floor(r.width*devicePixelRatio));c.height=Math.max(1,Math.floor(r.height*devicePixelRatio));c.style.width=r.width+'px';c.style.height=r.height+'px';x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);x.lineCap='round';x.lineJoin='round';if(old.width)x.drawImage(old,0,0,old.width,old.height,0,0,r.width,r.height)}requestAnimationFrame(fit);addEventListener('resize',()=>requestAnimationFrame(fit));['#111','#ef3340','#1479ff','#20a94b','#ff9f1c','#8a45d6','#ff58a7','#8b5a2b'].forEach(v=>{let b=document.createElement('button');b.className='marker';b.style.background=v;b.setAttribute('aria-label','marker');b.onpointerdown=e=>{e.preventDefault();color=v;size=10};tray.appendChild(b)});let e=document.createElement('button');e.className='eraser';e.setAttribute('aria-label','eraser');e.onpointerdown=ev=>{ev.preventDefault();color='#fff';size=42};tray.appendChild(e);function p(ev){let r=c.getBoundingClientRect();return{x:ev.clientX-r.left,y:ev.clientY-r.top}}c.onpointerdown=ev=>{ev.preventDefault();drawing=true;last=p(ev);c.setPointerCapture(ev.pointerId);x.fillStyle=color;x.beginPath();x.arc(last.x,last.y,size/2,0,Math.PI*2);x.fill()};c.onpointermove=ev=>{if(!drawing)return;ev.preventDefault();let q=p(ev);x.strokeStyle=color;x.lineWidth=size;x.beginPath();x.moveTo(last.x,last.y);x.lineTo(q.x,q.y);x.stroke();last=q};c.onpointerup=c.onpointercancel=()=>drawing=false;clear.onpointerdown=ev=>{ev.preventDefault();x.clearRect(0,0,c.width/devicePixelRatio,c.height/devicePixelRatio)};j.onclick=()=>{j.classList.add('on');h.classList.remove('on');home.href='jace.html'};h.onclick=()=>{h.classList.add('on');j.classList.remove('on');home.href='halli.html'};document.addEventListener('touchmove',e=>{if(e.target.closest('.tray'))return;e.preventDefault()},{passive:false});</script></body></html>
