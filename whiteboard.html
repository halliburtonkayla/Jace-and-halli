<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Jace & Halli Whiteboard</title><style>*{box-sizing:border-box}body{margin:0;background:#dcecff;font-family:Arial Rounded MT Bold,Arial,sans-serif;color:#17335c}.top{padding:10px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}.home,.who,button{border:0;border-radius:18px;padding:13px 17px;background:white;font-weight:900;box-shadow:0 4px 0 #0002;text-decoration:none;color:#17335c}.who.on{outline:5px solid #ffd94d}.board{margin:8px auto;width:min(96vw,1000px);height:68vh;background:#fff;border:14px solid #c99b62;border-radius:20px;box-shadow:0 12px 30px #0003;touch-action:none;overflow:hidden}.board canvas{width:100%;height:100%;display:block;touch-action:none}.tray{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;padding:10px}.marker{width:54px;height:54px;border-radius:50%;border:6px solid white;box-shadow:0 4px 8px #0004}.eraser{font-size:28px}</style></head><body><div class="top"><a class="home" href="jace.html">🏠</a><button class="who on" id="j">JACE</button><button class="who" id="h">HALLI</button><button id="clear">CLEAR BOARD</button></div><div class="board"><canvas id="c"></canvas></div><div class="tray" id="tray"></div><script>const c=document.getElementById('c'),x=c.getContext('2d');let color='#111',size=9,drawing=false,last=null;function fit(){let r=c.getBoundingClientRect(),old=document.createElement('canvas');old.width=c.width;old.height=c.height;old.getContext('2d').drawImage(c,0,0);c.width=r.width*devicePixelRatio;c.height=r.height*devicePixelRatio;x.scale(devicePixelRatio,devicePixelRatio);x.lineCap='round';x.lineJoin='round';if(old.width)x.drawImage(old,0,0,r.width,r.height)}fit();addEventListener('resize',fit);['#111','#ef3340','#1479ff','#20a94b','#ff9f1c','#8a45d6','#ff58a7','#8b5a2b'].forEach(v=>{let b=document.createElement('button');b.className='marker';b.style.background=v;b.onclick=()=>{color=v;size=9};tray.appendChild(b)});let e=document.createElement('button');e.className='eraser';e.textContent='🧽 ERASER';e.onclick=()=>{color='#fff';size=34};tray.appendChild(e);function p(ev){let r=c.getBoundingClientRect();return{x:ev.clientX-r.left,y:ev.clientY-r.top}}c.onpointerdown=ev=>{drawing=true;last=p(ev);c.setPointerCapture(ev.pointerId)};c.onpointermove=ev=>{if(!drawing)return;let q=p(ev);x.strokeStyle=color;x.lineWidth=size;x.beginPath();x.moveTo(last.x,last.y);x.lineTo(q.x,q.y);x.stroke();last=q};c.onpointerup=c.onpointercancel=()=>drawing=false;clear.onclick=()=>x.clearRect(0,0,c.width,c.height);j.onclick=()=>{j.classList.add('on');h.classList.remove('on')};h.onclick=()=>{h.classList.add('on');j.classList.remove('on')};</script></body></html>
