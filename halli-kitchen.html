<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>BABY KITCHEN</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;touch-action:none;font-family:Arial Rounded MT Bold,Arial;background:linear-gradient(#ffc77d,#fff1ba)}.home{position:fixed;z-index:9;left:12px;top:12px;width:62px;height:62px;border-radius:50%;border:4px solid white;background:#ff70aa;color:#fff;font-size:28px}.room{position:absolute;inset:0;padding:95px 20px 20px;display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.toy{border:7px solid #fff;border-radius:35px;background:linear-gradient(145deg,#fff9,#ffffff33);position:relative;overflow:hidden;box-shadow:0 8px 18px #0002}.toy:before{content:"";position:absolute;left:20%;top:18%;width:60%;height:60%;border-radius:35%;background:var(--c);box-shadow:inset 0 0 25px #fff9,0 10px 15px #0002}.toy:active{transform:scale(.92)}.baby{position:absolute;left:36%;top:26%;width:28%;height:42%;border-radius:45% 45% 35% 35%;background:#c98255;border:9px solid #fff5;z-index:3;pointer-events:none}.baby:before{content:"";position:absolute;left:18%;top:25%;width:14%;height:14%;border-radius:50%;background:#222;box-shadow:40px 0 #222}.baby:after{content:"";position:absolute;left:35%;top:55%;width:30%;height:12%;border-radius:0 0 20px 20px;background:#fff}</style></head><body><button class="home" onclick="location.href='halli.html'">⌂</button><div class="baby" id="baby"></div><div class="room" id="room"></div><script>const data=["Pour batter","Stir stir","Fruit bowl","Open fridge","Oven light","Move food","Stack dishes","Yummy!"];const AC=window.AudioContext||window.webkitAudioContext;function sound(i){let a=new AC,o=a.createOscillator(),g=a.createGain();o.frequency.value=180+i*55;g.gain.value=.08;o.connect(g).connect(a.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.18);o.stop(a.currentTime+.2)}data.forEach((v,i)=>{let b=document.createElement('button');b.className='toy';b.style.setProperty('--c','hsl('+(i*51)+',80%,65%)');b.setAttribute('aria-label',v);b.onclick=()=>{sound(i);b.animate([{transform:'scale(1) rotate(0)'},{transform:'scale(1.18) rotate(8deg)'},{transform:'scale(1) rotate(0)'}],{duration:450});if(window.baby)baby.animate([{transform:'rotate(0)'},{transform:'rotate(-8deg) scale(1.05)'},{transform:'rotate(8deg)'},{transform:'rotate(0)'}],{duration:700});let u=new SpeechSynthesisUtterance(v);u.rate=.8;speechSynthesis.cancel();speechSynthesis.speak(u)};room.append(b)});</script></body></html>
