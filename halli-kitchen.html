<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Halli Little Kitchen</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#ffe3a8;color:#684936}.top{display:flex;gap:12px;align-items:center;padding:12px}.home{width:56px;height:56px;border:4px solid white;border-radius:50%;background:#ff6fa9;color:white;font-size:28px}.wrap{max-width:900px;margin:auto;padding:10px}.scene{height:340px;border:6px solid white;border-radius:34px;background:#fff3d6;position:relative;overflow:hidden}.counter{position:absolute;left:5%;right:5%;bottom:20px;height:105px;background:#e7bb87;border:7px solid white;border-radius:18px}.bowl{position:absolute;left:50%;bottom:55px;transform:translateX(-50%);width:190px;height:85px;background:#ff7fa8;border:6px solid white;border-radius:12px 12px 90px 90px;z-index:2}.spoon{position:absolute;width:14px;height:130px;background:#aab4bd;left:57%;bottom:105px;transform:rotate(25deg);border-radius:8px;z-index:3}.fridge{position:absolute;right:6%;top:30px;width:110px;height:180px;background:#b8e8f4;border:7px solid white;border-radius:15px}.msg{position:absolute;left:7%;top:35px;max-width:45%;background:white;padding:10px 14px;border-radius:18px;font-size:21px;font-weight:bold}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}.act{min-height:110px;border:4px solid white;border-radius:25px;background:#fff9;font-size:17px;font-weight:bold;color:#684936}.pic{display:block;font-size:44px}@media(max-width:620px){.actions{grid-template-columns:repeat(2,1fr)}}</style></head><body><header class="top"><button class="home">⌂</button><h1>Halli's Little Kitchen</h1></header><main class="wrap"><div class="scene"><div class="msg" id="msg">Let's make something yummy!</div><div class="fridge" id="fridge"></div><div class="counter"></div><div class="bowl" id="bowl"></div><div class="spoon" id="spoon"></div></div><div class="actions"><button class="act" data-m="Pour in the batter!"><span class="pic">🥣</span>Pour</button><button class="act" data-m="Stir, stir, stir!"><span class="pic">🥄</span>Stir</button><button class="act" data-m="Add some fruit!"><span class="pic">🍓</span>Fruit</button><button class="act" data-m="Open the refrigerator!"><span class="pic">🥛</span>Fridge</button><button class="act" data-m="Mix it up!"><span class="pic">🍌</span>Mix</button><button class="act" data-m="Stack the dishes!"><span class="pic">🍽️</span>Dishes</button><button class="act" data-m="Bake it!"><span class="pic">🧁</span>Bake</button><button class="act" data-m="Yummy! Great job!"><span class="pic">⭐</span>Yummy!</button></div></main><script>document.querySelector('.home').onclick=()=>location.href='halli.html';const msg=document.getElementById('msg'),spoon=document.getElementById('spoon'),bowl=document.getElementById('bowl'),fridge=document.getElementById('fridge');document.querySelectorAll('.act').forEach((b,i)=>b.onclick=()=>{msg.textContent=b.dataset.m;if(i===1||i===4)spoon.animate([{transform:'rotate(25deg)'},{transform:'rotate(-35deg)'},{transform:'rotate(45deg)'},{transform:'rotate(25deg)'}],{duration:650,iterations:2});else if(i===3)fridge.animate([{transform:'rotateY(0)'},{transform:'rotateY(-25deg)'},{transform:'rotateY(0)'}],{duration:700});else bowl.animate([{transform:'translateX(-50%) scale(1)'},{transform:'translateX(-50%) scale(1.08)'},{transform:'translateX(-50%) scale(1)'}],{duration:500});});</script></body></html>
