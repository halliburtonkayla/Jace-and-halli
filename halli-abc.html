<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>MY FIRST ABC BOOK</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:none;font-family:Arial Rounded MT Bold,Arial,sans-serif;background:#ffd6e8}button{font:inherit}.home{position:fixed;z-index:50;left:12px;top:12px;width:62px;height:62px;border-radius:50%;border:4px solid white;background:#ff72aa;color:white;font-size:28px;box-shadow:0 5px 12px #0004}.stage{position:absolute;inset:0;overflow:hidden}.big{position:absolute;border:0;background:transparent;touch-action:none}.pop{animation:pop .3s forwards}@keyframes pop{50%{transform:scale(1.5)}100%{transform:scale(0);opacity:0}}@keyframes bob{50%{transform:translateY(-18px)}}@keyframes wig{50%{transform:rotate(7deg) scale(1.05)}}.label{position:fixed;top:16px;left:85px;right:15px;text-align:center;color:#fff;text-shadow:0 3px 7px #0008;font-size:clamp(20px,5vw,34px);pointer-events:none}</style></head><body><button class="home" onclick="location.href='halli.html'">⌂</button><div class="label">MY FIRST ABC BOOK</div><div class="stage" id="stage"><div id="card" style="position:absolute;inset:90px 20px 80px;background:#fff;border-radius:40px;display:flex;align-items:center;justify-content:center;flex-direction:column"><div id="letter" style="font-size:min(42vw,260px);font-weight:1000;color:#ff4f9a">A</div><canvas id="pic" width="260" height="180"></canvas></div><button id="prev" style="position:fixed;bottom:15px;left:20px;width:100px;height:65px;border-radius:30px;border:0;font-size:35px">◀</button><button id="next" style="position:fixed;bottom:15px;right:20px;width:100px;height:65px;border-radius:30px;border:0;font-size:35px">▶</button></div><script>let n=0,names=['Apple','Ball','Cat','Dog','Elephant','Fish','Grapes','House','Ice cream','Juice','Key','Lion','Moon','Nest','Orange','Pig','Queen','Rainbow','Sun','Turtle','Umbrella','Violin','Whale','Xylophone','Yo-yo','Zebra'];function show(){let L=String.fromCharCode(65+n);letter.textContent=L;let q=pic.getContext('2d');q.clearRect(0,0,260,180);q.fillStyle='hsl('+(n*31)+',75%,65%)';q.beginPath();q.arc(130,90,65,0,7);q.fill();q.fillStyle='white';q.font='bold 70px Arial';q.textAlign='center';q.fillText(L,130,115)}function say(){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(letter.textContent+'! '+names[n]+'!'))}card.onclick=()=>{say();card.animate([{transform:'scale(1)'},{transform:'scale(.94)'},{transform:'scale(1)'}],{duration:300})};next.onclick=()=>{n=(n+1)%26;show();say()};prev.onclick=()=>{n=(n+25)%26;show();say()};show();</script></body></html>
