<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Story Books</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:Arial Rounded MT Bold,Arial;background:linear-gradient(#6ed4ff,#ffd95c,#ff9fc5);color:#17355e}header{text-align:center;padding:20px;font-size:38px;font-weight:900}.wrap{max-width:900px;margin:auto;padding:14px}.back,button{border:0;border-radius:20px;font-weight:900}.back{display:inline-block;background:#fff;padding:12px 16px;color:#17355e;text-decoration:none}.library{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:15px 0}.book{min-height:145px;background:#fff;border:5px solid #fff;border-radius:28px;font-size:18px;color:#17355e;box-shadow:0 7px 0 #0002}.book span{display:block;font-size:58px}.reader{display:none;background:#fff;border-radius:34px;padding:16px;text-align:center}.art{min-height:250px;border-radius:26px;background:linear-gradient(#b9ecff,#e7f7ae);display:flex;align-items:center;justify-content:center;font-size:105px;letter-spacing:8px}.title{font-size:27px;font-weight:900;margin:10px}.page{font-size:21px;line-height:1.5;min-height:175px;text-align:left;background:#fff9e7;border-radius:22px;padding:15px}.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}.controls button{padding:14px;background:#ffe05a;font-size:18px;color:#17355e}.progress{font-weight:900;margin:8px}.autoOn{background:#72df8b!important}@media(max-width:520px){.library{grid-template-columns:1fr}.art{min-height:210px;font-size:82px}.page{font-size:19px}}</style></head><body><header>📚 Jace & Halli's Talking Books</header><div class="wrap"><a class="back" href="index.html">🏠 Family Home</a><div id="library"><h2>Tap a book. It starts reading for you. 🔊</h2><div class="library" id="books"></div></div><div class="reader" id="reader"><div class="title" id="title"></div><div class="progress" id="progress"></div><div class="art" id="art"></div><div class="page" id="text"></div><div class="controls"><button id="prev">⬅️ Back</button><button id="pause">⏸️ Pause</button><button id="repeat">🔊 Read Again</button><button id="next">Next ➡️</button><button id="libraryBtn">📚 Books</button></div></div></div><script>
const stories=[{"title": "Jace and the Friendly Dinosaur", "icon": "\ud83e\udd96", "pages": [{"art": "\ud83c\udf05\ud83e\udd96", "text": "One bright morning, Jace heard a tiny thump outside. He peeked into the yard and found a friendly green dinosaur trying to hide behind a very small bush. The dinosaur whispered, \u201cHi, Jace. I\u2019m Dino. I think I\u2019m lost.\u201d Jace smiled. A lost dinosaur definitely needed a helper."}, {"art": "\ud83d\uddfa\ufe0f\ud83c\udf33", "text": "Jace and Dino started down a leafy trail. They passed tall trees, buzzing bugs, and a creek that sparkled in the sunshine. Dino was nervous, but Jace said, \u201cWe can do this together.\u201d They looked for clues that might lead Dino back to his family."}, {"art": "\ud83e\udd95\ud83d\udc63", "text": "Soon they found enormous footprints in the mud. One, two, three, four! Jace counted each print carefully. Dino bounced with excitement. \u201cThose look like my family\u2019s footprints!\u201d he said. They followed the tracks deeper into the green jungle."}, {"art": "\ud83c\udf09\ud83d\udca6", "text": "The trail stopped at a little creek. Jace found flat stepping stones. He and Dino crossed slowly\u2014step, step, step. Dino\u2019s tail splashed the water and made them both laugh. On the other side they heard a deep, friendly rumble in the distance."}, {"art": "\ud83e\udd5a\ud83c\udf3f", "text": "Near a giant fern, they discovered three dinosaur eggs tucked safely in a nest. Jace knew they should not touch them. He and Dino tiptoed around the nest and kept following the footprints. The rumbling sound grew closer."}, {"art": "\ud83e\udd95\ud83e\udd96\ud83d\udc95", "text": "Then two big dinosaurs appeared between the trees. Dino shouted, \u201cMy family!\u201d He ran to them for a giant dinosaur hug. They were so happy to see him. Dino\u2019s mama thanked Jace for being brave, careful, and kind."}, {"art": "\u2b50\ud83c\udf19", "text": "Before Jace went home, Dino gave him a smooth, shiny stone to remember their adventure. That night, Jace placed it beside his bed. He closed his eyes and wondered what adventure he and Dino might have tomorrow. The end."}]}, {"title": "Jace, Halli, and Mama's Store Adventure", "icon": "\ud83d\uded2", "pages": [{"art": "\ud83d\ude97\u2600\ufe0f", "text": "One day, Mama told Jace and Halli they were going on a store adventure. Jace climbed in, Halli got comfy, and off they went. Jace wondered what they would find. Halli was already pointing out colors she saw along the way."}, {"art": "\ud83d\uded2\ud83d\udc66\ud83d\udc76", "text": "At the store, Jace helped Mama with the cart while Halli looked around with big curious eyes. They had a mission: find everything on Mama\u2019s list. First came bananas. Jace spotted the bright yellow bunch right away."}, {"art": "\ud83c\udf4e\ud83c\udf4c\ud83e\udd5b", "text": "Next they found red apples, milk, and something for dinner. Jace helped count: one, two, three apples. Halli smiled at all the colorful packages. Mama said they were doing a great job being her helpers."}, {"art": "\ud83e\uddf8\ud83d\ude99", "text": "When they passed the toys, Jace saw trucks and Halli noticed dolls. They stopped to look, but Mama reminded them they still had shopping to finish. Jace said goodbye to the trucks for now, and the adventure continued."}, {"art": "\ud83e\udd63\ud83c\udf5e\ud83e\uddc0", "text": "They found bread, cereal, and cheese. Jace checked the cart like a serious little shopper. Halli clapped. Almost everything on the list was there. Mama thanked them for helping instead of racing through the aisles."}, {"art": "\ud83d\udcb3\ud83d\udecd\ufe0f", "text": "At checkout, they watched the groceries travel along the belt. Beep, beep, beep! Jace helped count the bags. Halli waved at the cashier. Soon everything was packed and ready for the ride home."}, {"art": "\ud83c\udfe0\ud83d\udc95", "text": "Back home, Mama, Jace, and Halli put their things away. Their ordinary shopping trip had turned into a teamwork adventure. Jace had counted, Halli had spotted colors, and Mama had two very busy helpers. The end."}]}, {"title": "Jace and the Big Baseball Day", "icon": "\u26be", "pages": [{"art": "\u26be\u2600\ufe0f", "text": "Jace grabbed his baseball and hurried outside. In his imagination, the backyard became the biggest baseball stadium in the world. The crowd was cheering, and Jace was ready to practice."}, {"art": "\ud83e\udde2\ud83e\udd4e", "text": "First he practiced throwing. He aimed carefully and tossed the ball. Then he tried again. Each throw got a little better. Jace learned that practice did not mean doing everything perfectly\u2014it meant trying again."}, {"art": "\ud83c\udfcf\u2b50", "text": "Next came batting practice. Jace got ready, watched the ball, and swung. Whoosh! He missed one. Then another. But he kept going. On the next try\u2014SMACK! The ball went rolling across the yard."}, {"art": "\ud83c\udfc3\u200d\u2642\ufe0f\ud83d\udca8", "text": "Jace ran like he was rounding the bases. First base, second base, third base, HOME! He threw his hands in the air. In his pretend stadium, the crowd went wild."}, {"art": "\ud83d\udc76\ud83d\udc4f", "text": "Halli came to watch and gave Jace a big clap. Jace showed her the ball and made sure they played safely. He rolled it gently toward her instead of throwing it hard."}, {"art": "\ud83d\udcaa\u26be", "text": "Jace practiced one more time. He remembered to watch the ball and keep trying. Some hits were big, some were little, and some were misses. Every try helped him learn."}, {"art": "\ud83c\udf19\ud83c\udfe0", "text": "When it was time to go inside, Jace carried his baseball with a smile. Tomorrow there could be another game, another practice, and another chance to learn. The end."}]}, {"title": "Halli's Colorful Surprise", "icon": "\ud83c\udfa8", "pages": [{"art": "\ud83c\udfa8\ud83d\udc76", "text": "Halli found some colors and decided it was time to make art. She looked at the paper. She looked at the colors. Then she looked at herself. That gave her a very creative idea."}, {"art": "\ud83e\ude77\ud83d\udc9b\ud83d\udc99", "text": "Pink here. Yellow there. A little blue somewhere else. Halli was having a wonderful time. The paper had colors\u2014but somehow Halli had even more colors than the paper."}, {"art": "\ud83d\ude2e\ud83d\udc95", "text": "Mama walked in and stopped. Halli looked up proudly as if she had created the greatest masterpiece ever made. Mama tried very hard not to laugh."}, {"art": "\ud83e\uddfc\ud83e\udee7", "text": "It was cleanup time. Warm water, a soft washcloth, and lots of bubbles helped the colors disappear. Halli splashed and giggled while Mama cleaned tiny fingers, arms, and cheeks."}, {"art": "\ud83d\udc57\u2728", "text": "Afterward, Halli got clean clothes. She looked fresh and cozy again. Mama put the art supplies where they belonged and saved Halli\u2019s paper masterpiece."}, {"art": "\ud83d\udd8d\ufe0f\ud83d\udcc4", "text": "Next time, Mama showed Halli where the colors belonged: on the paper. Halli tapped the page and made another bright mark. That was a much easier masterpiece to clean."}, {"art": "\ud83c\udf19\ud83d\udc95", "text": "At bedtime, Mama remembered her colorful little artist and smiled. Halli had learned something important: art can be messy, cleanup can be fun, and tomorrow there is always more paper. The end."}]}, {"title": "Dino's Sleepy Bedtime", "icon": "\ud83c\udf19", "pages": [{"art": "\ud83c\udf0c\ud83e\udd96", "text": "The sky above the dinosaur valley turned purple and gold. Little Dino had played all day, but he was not quite ready to sleep. He wanted one more stomp, one more roar, and one more adventure."}, {"art": "\ud83e\udd95\ud83c\udf3f", "text": "Mama Dino smiled and led him toward their cozy nest. Together they listened to the leaves rustle softly. The busy jungle was becoming quiet."}, {"art": "\u2b50\u2728", "text": "Little Dino looked up. One star appeared, then another, then another. He counted slowly as the sky filled with tiny lights. His eyes started to feel heavy."}, {"art": "\ud83c\udf2c\ufe0f\ud83c\udf33", "text": "A gentle breeze moved through the ferns. Little Dino took a slow breath in and a slow breath out. His feet stopped stomping. His tail became still."}, {"art": "\ud83e\udd17\ud83e\udd96", "text": "Mama Dino tucked close beside him. She reminded him that the jungle would still be there in the morning. There would be plenty of time for running, exploring, and roaring tomorrow."}, {"art": "\ud83d\ude34\ud83c\udf19", "text": "Little Dino closed his eyes. He imagined floating past stars on a soft cloud. Every breath made him sleepier and cozier."}, {"art": "\ud83d\udca4\u2b50", "text": "Soon the littlest dinosaur in the valley was fast asleep. The moon shone over the nest, the stars twinkled quietly, and everything was safe and calm. Good night. The end."}]}];let story=null,page=0,token=0,paused=false;const books=document.querySelector('#books'),reader=document.querySelector('#reader');
function speakPage(){if(!story)return;token++;let mine=token;if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(story.pages[page].text);u.rate=.78;u.pitch=1.05;u.onend=()=>{if(mine!==token||paused)return;setTimeout(()=>{if(page<story.pages.length-1){page++;render();speakPage()}else{document.querySelector('#progress').textContent='⭐ The End ⭐'}},900)};speechSynthesis.speak(u)}
function render(){let p=story.pages[page];document.querySelector('#title').textContent=story.icon+' '+story.title;document.querySelector('#progress').textContent='Page '+(page+1)+' of '+story.pages.length;document.querySelector('#art').textContent=p.art;document.querySelector('#text').textContent=p.text}
function openBook(s){story=s;page=0;paused=false;document.querySelector('#library').style.display='none';reader.style.display='block';render();speakPage()}
stories.forEach(s=>{let b=document.createElement('button');b.className='book';b.innerHTML='<span>'+s.icon+'</span>'+s.title+'<br><small>🔊 About 5-minute read-aloud</small>';b.onclick=()=>openBook(s);books.appendChild(b)});
document.querySelector('#prev').onclick=()=>{if(page>0){page--;render();speakPage()}};document.querySelector('#next').onclick=()=>{if(page<story.pages.length-1){page++;render();speakPage()}};document.querySelector('#repeat').onclick=speakPage;
document.querySelector('#pause').onclick=()=>{paused=!paused;if(paused){token++;speechSynthesis.cancel();document.querySelector('#pause').textContent='▶️ Keep Reading'}else{document.querySelector('#pause').textContent='⏸️ Pause';speakPage()}};
document.querySelector('#libraryBtn').onclick=()=>{token++;speechSynthesis.cancel();reader.style.display='none';document.querySelector('#library').style.display='block'};
</script></body></html>
