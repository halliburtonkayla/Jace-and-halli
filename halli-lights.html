<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>LIGHTS & COLORS</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:none;font-family:Arial Rounded MT Bold,Arial,sans-serif;background:#080925}button{font:inherit}.home{position:fixed;z-index:50;left:12px;top:12px;width:62px;height:62px;border-radius:50%;border:4px solid white;background:#ff72aa;color:white;font-size:28px;box-shadow:0 5px 12px #0004}.stage{position:absolute;inset:0;overflow:hidden}.big{position:absolute;border:0;background:transparent;touch-action:none}.pop{animation:pop .3s forwards}@keyframes pop{50%{transform:scale(1.5)}100%{transform:scale(0);opacity:0}}@keyframes bob{50%{transform:translateY(-18px)}}@keyframes wig{50%{transform:rotate(7deg) scale(1.05)}}.label{position:fixed;top:16px;left:85px;right:15px;text-align:center;color:#fff;text-shadow:0 3px 7px #0008;font-size:clamp(20px,5vw,34px);pointer-events:none}</style></head><body><button class="home" onclick="location.href='halli.html'">⌂</button><div class="label">LIGHTS & COLORS</div><div class="stage" id="stage"><canvas id="c" style="width:100%;height:100%;touch-action:none"></canvas></div><script>let x=c.getContext('2d');function fit(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}fit();addEventListener('resize',fit);let dots=[];for(let i=0;i<18;i++)dots.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:35+Math.random()*55,h:Math.random()*360});function draw(){x.fillStyle='#080925';x.fillRect(0,0,innerWidth,innerHeight);dots.forEach(d=>{let g=x.createRadialGradient(d.x,d.y,2,d.x,d.y,d.r);g.addColorStop(0,'white');g.addColorStop(.2,'hsl('+d.h+',90%,70%)');g.addColorStop(1,'transparent');x.fillStyle=g;x.beginPath();x.arc(d.x,d.y,d.r,0,7);x.fill()});requestAnimationFrame(draw)}draw();c.onpointerdown=e=>{dots.push({x:e.clientX,y:e.clientY,r:90,h:Math.random()*360});if(dots.length>28)dots.shift()};</script></body></html>
