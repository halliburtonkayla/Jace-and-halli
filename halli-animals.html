<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Animal Touch</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;touch-action:none;background:linear-gradient(#7ad9ff 0 45%,#7bcf63 45%);font-family:Arial}.home{position:fixed;z-index:5;left:10px;top:10px;width:60px;height:60px;border-radius:50%;border:4px solid white;background:#ff6fa8;color:#fff;font-size:28px}.zoo{position:absolute;inset:75px 8px 8px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.a{border:0;background:transparent;position:relative}.body{position:absolute;left:18%;top:28%;width:64%;height:48%;border-radius:50%;background:var(--c);box-shadow:inset -12px -10px #0001,0 8px 8px #0002}.head{position:absolute;left:28%;top:8%;width:45%;height:45%;border-radius:50%;background:var(--c);border:5px solid #fff5}.eye{position:absolute;top:35%;width:10%;height:10%;background:#111;border-radius:50%}.e1{left:25%}.e2{right:25%}.mouth{position:absolute;left:35%;top:62%;width:30%;height:12%;background:#fff;border-radius:0 0 20px 20px}</style></head><body><button class="home" onclick="location.href='halli.html'">⌂</button><div class="zoo" id="z"></div><script>let names=['Dog','Cat','Cow','Horse','Pig','Duck','Chicken','Sheep','Lion','Elephant','Monkey','Frog','Bird'];let sounds=['Woof woof!','Meow!','Moo!','Neigh!','Oink oink!','Quack quack!','Cluck cluck!','Baa baa!','Roar!','Pawoo!','Ooh ooh!','Ribbit!','Tweet tweet!'];names.forEach((n,i)=>{let b=document.createElement('button');b.className='a';b.style.setProperty('--c','hsl('+(i*31)+',55%,60%)');b.innerHTML='<div class="body"></div><div class="head"><i class="eye e1"></i><i class="eye e2"></i><i class="mouth"></i></div>';b.onclick=()=>{b.animate([{transform:'scale(1)'},{transform:'scale(1.18) rotate(-5deg)'},{transform:'scale(1)'}],{duration:550});let u=new SpeechSynthesisUtterance(sounds[i]+' '+n+'!');u.rate=.75;speechSynthesis.cancel();speechSynthesis.speak(u)};z.append(b)});</script></body></html>
