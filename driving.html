<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Jace's Driving Adventure</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Arial Rounded MT Bold,Arial,sans-serif;background:linear-gradient(#8fe2ff,#e8f8ff);color:#16355f;text-align:center;touch-action:manipulation;overflow-x:hidden}
header{padding:14px;font-size:30px;font-weight:900;background:linear-gradient(100deg,#67daf2,#ffe36d,#ff9eb9)}
.bar,.hud{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;padding:10px}
a,button{border:0;border-radius:20px;background:#ffe36d;color:#16355f;padding:12px 16px;font-size:18px;font-weight:900;box-shadow:0 5px #b8b8b8;text-decoration:none}
.game{max-width:920px;margin:auto;padding:0 10px 20px}
.stage{position:relative;border:7px solid #fff;border-radius:28px;overflow:hidden;background:#9edfff;box-shadow:0 10px 30px #0002}
canvas{display:block;width:100%;height:auto;aspect-ratio:4/3;touch-action:none}
.controls{display:grid;grid-template-columns:1fr 1.2fr 1.2fr 1fr;gap:10px;margin:12px 0}
.controls button{min-height:78px;font-size:23px;touch-action:none}
#gas{background:#8eea8e}#brake{background:#ff9797}
.tip{font-weight:900;background:#fff9;border-radius:20px;padding:10px}
@media(max-width:600px){header{font-size:24px}.controls{grid-template-columns:1fr 1fr}.controls button{min-height:70px}}
</style>
</head>
<body>
<header>Jace's Driving Adventure</header>
<div class="bar"><a href="jace.html">Back to Jace's Games</a><button id="restart">New Drive</button></div>
<div class="hud"><span>Stars <b id="stars">0</b></span><span>Distance <b id="distance">0</b> m</span><span id="msg">Buckle up and drive safely!</span></div>
<div class="game">
  <div class="stage"><canvas id="game" width="900" height="675"></canvas></div>
  <div class="controls">
    <button id="left">STEER LEFT</button>
    <button id="gas">GAS</button>
    <button id="brake">BRAKE</button>
    <button id="right">STEER RIGHT</button>
  </div>
  <div class="tip">You are behind the wheel. Hold GAS to move, BRAKE to slow down, and steer around traffic cones and cars.</div>
</div>
<script>
const c=document.getElementById('game'),g=c.getContext('2d');
const starsEl=document.getElementById('stars'),distEl=document.getElementById('distance'),msg=document.getElementById('msg');
let keys,roadOffset,speed,distance,stars,obstacles,last,spawn,starSpawn,wheelAngle;

function reset(){
 keys={l:0,r:0,g:0,b:0};roadOffset=0;speed=0;distance=0;stars=[];obstacles=[];
 last=performance.now();spawn=0;starSpawn=0;wheelAngle=0;starsEl.textContent='0';distEl.textContent='0';msg.textContent='Buckle up and drive safely!';
}
function rnd(a,b){return a+Math.random()*(b-a)}
function addObstacle(){
 const kind=Math.random()<.55?'car':'cone';
 obstacles.push({x:rnd(355,545),y:-80,kind,scale:rnd(.72,1.05)});
}
function addStar(){stars.push({x:rnd(355,545),y:-45})}
function roundRect(ctx,x,y,w,h,r,fill,stroke){
 ctx.beginPath();ctx.roundRect(x,y,w,h,r); if(fill)ctx.fill(); if(stroke)ctx.stroke();
}
function drawRoad(){
 const horizon=205;
 g.fillStyle='#8edcff';g.fillRect(0,0,900,horizon);
 g.fillStyle='#8ac96d';g.fillRect(0,horizon,900,260);
 g.fillStyle='#777';g.beginPath();g.moveTo(350,horizon);g.lineTo(550,horizon);g.lineTo(760,540);g.lineTo(140,540);g.closePath();g.fill();
 g.strokeStyle='#fff';g.lineWidth=8;g.setLineDash([30,28]);
 const off=(roadOffset*5)%58;
 for(let lane of [-1,1]){
   g.beginPath();
   for(let i=0;i<11;i++){
     const t=i/10,y=horizon+t*335+off;
     const center=450,half=100+t*205,x=center+lane*(half/3);
     if(i===0)g.moveTo(x,y);else g.lineTo(x,y);
   }
   g.stroke();
 }
 g.setLineDash([]);
 for(let i=0;i<9;i++){
   const y=horizon+((i*70+roadOffset*7)%350);
   const s=.25+(y-horizon)/500;
   g.fillStyle='#3f8f48';g.beginPath();g.arc(88,y,24+35*s,0,Math.PI*2);g.fill();
   g.beginPath();g.arc(812,y+20,22+32*s,0,Math.PI*2);g.fill();
 }
}
function projectX(worldX,y){
 const t=Math.max(0,Math.min(1,(y-205)/335)), half=100+t*205;
 return 450+(worldX-450)*(half/205);
}
function drawCar(o){
 const y=o.y,s=o.scale*(.45+Math.max(0,(y-170))/450);
 const x=projectX(o.x,y),w=70*s,h=110*s;
 g.save();g.translate(x,y);
 g.fillStyle='#2a67d8';roundRect(g,-w/2,-h/2,w,h,12*s,true,false);
 g.fillStyle='#bde8ff';roundRect(g,-w*.32,-h*.31,w*.64,h*.25,6*s,true,false);
 g.fillStyle='#222';g.fillRect(-w*.52,-h*.27,w*.12,h*.25);g.fillRect(w*.4,-h*.27,w*.12,h*.25);
 g.fillRect(-w*.52,h*.08,w*.12,h*.25);g.fillRect(w*.4,h*.08,w*.12,h*.25);
 g.restore();
}
function drawCone(o){
 const y=o.y,s=o.scale*(.45+Math.max(0,(y-170))/450),x=projectX(o.x,y);
 g.save();g.translate(x,y);g.fillStyle='#ff7a24';g.beginPath();g.moveTo(0,-38*s);g.lineTo(-22*s,30*s);g.lineTo(22*s,30*s);g.closePath();g.fill();
 g.fillStyle='#fff';g.fillRect(-14*s,-2*s,28*s,8*s);g.fillStyle='#444';g.fillRect(-30*s,30*s,60*s,8*s);g.restore();
}
function drawStar(s){
 const y=s.y,x=projectX(s.x,y),r=17;
 g.save();g.translate(x,y);g.fillStyle='#ffd62e';g.strokeStyle='#be8d00';g.lineWidth=3;g.beginPath();
 for(let i=0;i<10;i++){let a=-Math.PI/2+i*Math.PI/5,rr=i%2?7:r;g.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}g.closePath();g.fill();g.stroke();g.restore();
}
function drawInterior(){
 // windshield frame
 g.fillStyle='#292f3b';g.fillRect(0,0,34,520);g.fillRect(866,0,34,520);g.fillRect(0,0,900,34);
 // dashboard
 g.fillStyle='#253044';g.beginPath();g.moveTo(0,515);g.quadraticCurveTo(450,455,900,515);g.lineTo(900,675);g.lineTo(0,675);g.closePath();g.fill();
 g.fillStyle='#111925';roundRect(g,330,493,240,95,28,true,false);
 g.fillStyle='#8de7ff';g.font='bold 24px Arial';g.textAlign='center';g.fillText(Math.round(speed*12)+' mph',450,548);
 // steering wheel
 g.save();g.translate(450,610);g.rotate(wheelAngle);g.strokeStyle='#121820';g.lineWidth=23;g.beginPath();g.arc(0,0,92,0,Math.PI*2);g.stroke();
 g.lineWidth=15;for(const a of [0,2.1,4.2]){g.beginPath();g.moveTo(0,0);g.lineTo(Math.cos(a)*74,Math.sin(a)*74);g.stroke()}g.restore();
 // hands
 g.fillStyle='#a86d45';g.beginPath();g.ellipse(365,600,26,18,-.35,0,Math.PI*2);g.fill();g.beginPath();g.ellipse(535,600,26,18,.35,0,Math.PI*2);g.fill();
 // rear-view mirror and Jace-style avatar face
 g.fillStyle='#1c2532';roundRect(g,365,46,170,76,18,true,false);
 g.fillStyle='#d59a68';g.beginPath();g.arc(450,84,27,0,Math.PI*2);g.fill();
 g.fillStyle='#4a2c19';g.beginPath();g.arc(450,74,28,Math.PI,Math.PI*2);g.fill();
 g.fillStyle='#111';g.beginPath();g.arc(440,84,3,0,7);g.arc(460,84,3,0,7);g.fill();
 g.strokeStyle='#8c4f38';g.lineWidth=3;g.beginPath();g.arc(450,90,10,.15,Math.PI-.15);g.stroke();
}
function update(now){
 const dt=Math.min(35,now-last)/16.67;last=now;
 if(keys.g)speed=Math.min(8,speed+.09*dt); else speed=Math.max(0,speed-.025*dt);
 if(keys.b)speed=Math.max(0,speed-.22*dt);
 const target=(keys.l?-0.42:keys.r?.42:0);wheelAngle+=(target-wheelAngle)*.14;
 const steer=(keys.r?1:0)-(keys.l?1:0);
 obstacles.forEach(o=>o.x-=steer*2.7*dt*(.4+Math.max(0,o.y)/500));
 stars.forEach(o=>o.x-=steer*2.7*dt*(.4+Math.max(0,o.y)/500));
 roadOffset+=speed*dt;distance+=speed*.16*dt;spawn+=speed*dt;starSpawn+=speed*dt;
 if(speed>1&&spawn>85){addObstacle();spawn=0} if(speed>1&&starSpawn>64){addStar();starSpawn=0}
 obstacles.forEach(o=>o.y+=speed*2.1*dt);stars.forEach(o=>o.y+=speed*2.1*dt);
 obstacles=obstacles.filter(o=>{
   if(o.y>450&&o.y<535&&Math.abs(o.x-450)<62){speed=Math.max(.5,speed*.28);msg.textContent='Good brake! Watch the road.';return false}
   return o.y<560;
 });
 stars=stars.filter(s=>{
   if(s.y>440&&s.y<530&&Math.abs(s.x-450)<60){starsEl.textContent=String(+starsEl.textContent+1);msg.textContent='Great driving! You found a star.';return false}
   return s.y<560;
 });
 distEl.textContent=Math.floor(distance);
 draw();requestAnimationFrame(update);
}
function draw(){
 g.clearRect(0,0,900,675);drawRoad();
 obstacles.forEach(o=>o.kind==='car'?drawCar(o):drawCone(o));stars.forEach(drawStar);drawInterior();
}
function bind(id,key){
 const b=document.getElementById(id);
 const down=e=>{e.preventDefault();keys[key]=1};
 const up=e=>{e.preventDefault();keys[key]=0};
 ['pointerdown','touchstart'].forEach(n=>b.addEventListener(n,down,{passive:false}));
 ['pointerup','pointercancel','pointerleave','touchend'].forEach(n=>b.addEventListener(n,up,{passive:false}));
}
bind('left','l');bind('right','r');bind('gas','g');bind('brake','b');
document.getElementById('restart').onclick=reset;
reset();requestAnimationFrame(update);
</script>
</body>
</html>
