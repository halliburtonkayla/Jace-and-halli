<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Driving Adventures</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:Arial,sans-serif;background:#dff5ff;color:#17335c;text-align:center;touch-action:manipulation}header{padding:14px;font-size:28px;font-weight:900;background:linear-gradient(100deg,#69dcf1,#ffe76e,#ff9eb8)}.bar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:10px}a,button{border:0;border-radius:18px;background:#ffe36d;color:#17335c;padding:12px 16px;font-size:18px;font-weight:900;box-shadow:0 5px #bbb;text-decoration:none}.hud{display:flex;justify-content:space-around;font-weight:900;font-size:18px;padding:8px}.game{max-width:820px;margin:auto;padding:0 10px}canvas{width:100%;height:auto;aspect-ratio:4/3;background:#7bc96f;border:6px solid white;border-radius:24px;display:block}.controls{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;margin:12px 0}.controls button{font-size:25px;min-height:68px;touch-action:none}.tip{font-weight:800;padding:8px}</style></head><body>
<header>🚗 Jace's Driving Adventure</header><div class="bar"><a href="jace.html">⬅️ Jace's Games</a><button id="restart">🔄 New Drive</button></div><div class="hud"><span>⭐ <b id="stars">0</b></span><span>🚩 <b id="distance">0</b> m</span><span id="msg">Drive safely!</span></div><div class="game"><canvas id="game" width="800" height="600"></canvas><div class="controls"><button id="left">⬅️</button><button id="gas">⛽ GO</button><button id="brake">🛑</button><button id="right">➡️</button></div><div class="tip">Steer around cars, people, cones and puddles. Collect ⭐ stars and reach the checkpoints!</div></div>
<script>
const c=document.getElementById('game'),x=c.getContext('2d'),starsEl=document.getElementById('stars'),distEl=document.getElementById('distance'),msg=document.getElementById('msg');let car,obs,stars,road,keys,last,spawn,starSpawn,checkpoint;
function reset(){car={x:400,y:470,w:72,h:105,speed:2};obs=[];stars=[];road=0;keys={l:0,r:0,g:0,b:0};last=performance.now();spawn=0;starSpawn=0;checkpoint=500;starsEl.textContent=0;distEl.textContent=0;msg.textContent='Drive safely!'}
function addObstacle(){let types=['🚙','🚗','🚧','🧍','💧','🦌'];let t=types[Math.floor(Math.random()*types.length)];obs.push({x:235+Math.random()*330,y:-70,t,w:t==='🧍'?42:60,h:65})}function addStar(){stars.push({x:240+Math.random()*320,y:-40})}
function hit(a,b){return a.x-a.w/2<b.x+b.w/2&&a.x+a.w/2>b.x-b.w/2&&a.y-a.h/2<b.y+b.h/2&&a.y+a.h/2>b.y-b.h/2}
function loop(now){let dt=Math.min(32,now-last)/16.67;last=now;if(keys.g)car.speed=Math.min(8,car.speed+.08*dt);else car.speed=Math.max(2,car.speed-.025*dt);if(keys.b)car.speed=Math.max(.5,car.speed-.18*dt);if(keys.l)car.x-=6*dt;if(keys.r)car.x+=6*dt;car.x=Math.max(225,Math.min(575,car.x));road+=car.speed*dt;spawn+=car.speed*dt;starSpawn+=car.speed*dt;if(spawn>110){addObstacle();spawn=0}if(starSpawn>75){addStar();starSpawn=0}obs.forEach(o=>o.y+=car.speed*1.65*dt);stars.forEach(s=>s.y+=car.speed*1.65*dt);obs=obs.filter(o=>{if(hit(car,{x:o.x,y:o.y,w:o.w,h:o.h})){msg.textContent=o.t==='🧍'?'Great stop! Watch for people!':'Oops! Watch out!';car.speed=.7;o.y=700;return false}return o.y<680});stars=stars.filter(s=>{if(Math.abs(car.x-s.x)<55&&Math.abs(car.y-s.y)<65){starsEl.textContent=+starsEl.textContent+1;msg.textContent='⭐ Nice driving!';return false}return s.y<650});let meters=Math.floor(road/10);distEl.textContent=meters;if(meters>=checkpoint){msg.textContent='🚩 Checkpoint! Great job!';checkpoint+=500}draw();requestAnimationFrame(loop)}
function draw(){x.clearRect(0,0,800,600);x.fillStyle='#69b85b';x.fillRect(0,0,800,600);x.fillStyle='#555';x.fillRect(190,0,420,600);x.strokeStyle='#fff';x.lineWidth=8;x.setLineDash([45,35]);for(let lane of [330,470]){x.beginPath();x.moveTo(lane,-80+(road*5)%80);x.lineTo(lane,650);x.stroke()}x.setLineDash([]);for(let y=-40+(road*2)%90;y<650;y+=90){x.font='30px Arial';x.fillText('🌳',90,y);x.fillText('🌼',660,y+35)}obs.forEach(o=>{x.font=o.t==='🧍'?'48px Arial':'55px Arial';x.fillText(o.t,o.x-28,o.y+22)});stars.forEach(s=>{x.font='42px Arial';x.fillText('⭐',s.x-21,s.y+15)});x.font='82px Arial';x.fillText('🚙',car.x-42,car.y+34)}
function bind(id,k){let b=document.getElementById(id);['pointerdown','touchstart'].forEach(e=>b.addEventListener(e,a=>{a.preventDefault();keys[k]=1}));['pointerup','pointercancel','pointerleave','touchend'].forEach(e=>b.addEventListener(e,a=>{a.preventDefault();keys[k]=0}))}bind('left','l');bind('right','r');bind('gas','g');bind('brake','b');document.getElementById('restart').onclick=reset;reset();requestAnimationFrame(loop);
</script></body></html>
