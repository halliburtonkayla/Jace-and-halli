<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>🚗 Driving Adventures</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial Rounded MT Bold,Arial,sans-serif;background:#fff7df;color:#25324a;touch-action:manipulation}header{padding:18px;text-align:center;background:linear-gradient(135deg,#73d7ff,#ffe274,#ff9fc9);border-bottom:6px solid #fff}h1{margin:0;font-size:clamp(28px,6vw,52px)}main{max-width:1000px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:14px}.card,.btn{display:block;text-decoration:none;color:inherit;text-align:center;border:0;border-radius:26px;padding:20px 12px;font-size:20px;font-weight:800;background:white;box-shadow:0 5px 0 #d5d5d5}.card{min-height:145px}.emo{display:block;font-size:58px;margin-bottom:8px}.btn{display:inline-block;min-height:auto;padding:13px 18px;background:#ffe36f}.back{margin-bottom:15px}.panel{background:white;border-radius:25px;padding:16px;margin:12px 0}.status{text-align:center;font-size:24px;font-weight:900;min-height:40px}button:active,.card:active{transform:translateY(3px)}.road{height:560px;position:relative;overflow:hidden;border-radius:28px;background:#68b95d;touch-action:none}.asphalt{position:absolute;left:20%;width:60%;height:100%;background:#555}.stripe{position:absolute;left:49%;width:2%;height:200%;background:repeating-linear-gradient(#fff 0 35px,transparent 35px 75px);top:-100%}.car{position:absolute;bottom:150px;left:50%;transform:translateX(-50%);font-size:72px}.controls{position:absolute;left:10px;right:10px;bottom:12px;display:flex;justify-content:space-between;align-items:end}.wheel{width:130px;height:130px;border-radius:50%;border:16px solid #222;background:#eee;font-size:40px;touch-action:none}.pedal{width:92px;height:105px;border:0;border-radius:20px;font-size:18px;font-weight:900}.gas{background:#76df78}.brake{background:#ff7b7b}.scenes{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}</style></head><body><header><h1>🚗 Driving Adventures</h1></header><main><a class="btn back" href="jace.html">⬅️ Jace's Games</a><div class="scenes"><button class="btn" data-scene data-bg="#68b95d">🌲 Camping Road</button><button class="btn" data-scene data-bg="#d7a65a">🚧 Construction</button><button class="btn" data-scene data-bg="#79c76a">🦖 Dino Land</button></div><div class="road"><div class="asphalt"></div><div class="stripe"></div><div class="car">🚙</div><div class="controls"><button class="wheel">↔</button><div><button class="pedal brake">BRAKE</button> <button class="pedal gas">GAS</button></div></div></div><div class="status">Hold GAS and steer!</div></main><script>let x=50,speed=0,gas=false,brake=false,steer=0,offset=0;const car=document.querySelector('.car'),stripe=document.querySelector('.stripe'),status=document.querySelector('.status');function loop(){speed+=gas?.045:-.012;if(brake)speed-=.09;speed=Math.max(0,Math.min(2.2,speed));x+=steer*speed*.15;x=Math.max(25,Math.min(75,x));offset=(offset+speed*4)%75;car.style.left=x+'%';stripe.style.transform='translateY('+offset+'px)';status.textContent=speed>.15?'Driving! '+Math.round(speed*12)+' mph':'Hold GAS and steer!';requestAnimationFrame(loop)}loop();function hold(el,set){el.onpointerdown=e=>{e.preventDefault();set(true)};['onpointerup','onpointercancel','onpointerleave'].forEach(k=>el[k]=()=>set(false))}hold(document.querySelector('.gas'),v=>gas=v);hold(document.querySelector('.brake'),v=>brake=v);const w=document.querySelector('.wheel');w.onpointerdown=e=>{w.setPointerCapture(e.pointerId)};w.onpointermove=e=>{if(!w.hasPointerCapture(e.pointerId))return;let r=w.getBoundingClientRect();steer=Math.max(-1,Math.min(1,(e.clientX-(r.left+r.width/2))/(r.width/2)));w.style.transform='rotate('+steer*80+'deg)'};w.onpointerup=e=>{steer=0;w.style.transform='rotate(0)'};document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>{document.querySelector('.road').style.background=b.dataset.bg;status.textContent=b.textContent+'!'});</script></body></html>
