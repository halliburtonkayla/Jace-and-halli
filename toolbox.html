<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Jace's Toolbox Workshop</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:Arial Rounded MT Bold,Arial,sans-serif;background:linear-gradient(#d7edf5,#f4d9aa);color:#17335c}header{text-align:center;padding:18px;font-size:clamp(30px,7vw,46px);font-weight:900;background:linear-gradient(100deg,#4b6b7c,#f8c85b,#ef8658)}.wrap{max-width:980px;margin:auto;padding:14px}.bar,.tools,.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:10px 0}a,button{border:0;border-radius:18px;padding:12px 16px;font-size:18px;font-weight:900;background:#ffe36d;color:#17335c;text-decoration:none;box-shadow:0 5px #0002}.teacher{background:#fff;border-radius:24px;padding:14px;text-align:center;font-size:21px;font-weight:900;margin:12px 0}.shop{display:grid;grid-template-columns:1fr .9fr;gap:14px}.bench{position:relative;min-height:500px;background:linear-gradient(#cfe8f6 0 52%,#a77850 52%);border:6px solid #fff;border-radius:28px;overflow:hidden}.project{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);width:340px;max-width:78%;height:220px;background:#f6c66c;border:8px solid #81572f;border-radius:30px;box-shadow:0 12px #0002}.wheel{position:absolute;width:78px;height:78px;border-radius:50%;background:#2f3440;border:8px solid #111;bottom:-34px}.wheel.l{left:35px}.wheel.r{right:35px}.bolt{position:absolute;width:28px;height:28px;border-radius:50%;background:#ccc;border:5px solid #666;left:50%;top:50%;transform:translate(-50%,-50%)}.broken{position:absolute;right:18px;top:18px;background:#fff;border-radius:18px;padding:8px 10px;font-size:16px;font-weight:900}.hand{position:absolute;font-size:72px;left:42%;top:25%;opacity:0;transition:.35s}.hand.show{opacity:1;transform:translateY(40px)}.panel{background:#fff;border-radius:26px;padding:14px}.tools{display:grid;grid-template-columns:repeat(2,1fr)}.tools button{min-height:95px;background:#f8fbff;font-size:38px}.tools small{display:block;font-size:14px}.toolsel{outline:5px solid #66c86f}.actions button{min-height:66px;min-width:140px}.green{background:#94e68b}.red{background:#ff9d9d}.progress{text-align:center;font-weight:900;padding:8px}@media(max-width:700px){.shop{grid-template-columns:1fr}.bench{min-height:420px}.tools{grid-template-columns:repeat(3,1fr)}.tools button{font-size:31px;min-height:82px}}</style></head><body>
<header>Jace's Toolbox Workshop</header><div class="wrap"><div class="bar"><a href="jace.html">Back to Jace's World</a></div><div class="teacher" id="teacher">Jace, can you help me fix the wagon?</div><div class="progress" id="progress"></div><div class="shop"><div class="bench"><div class="broken" id="broken">Loose wheel!</div><div class="project"><div class="wheel l"></div><div class="wheel r"><div class="bolt"></div></div></div><div class="hand" id="hand">🖐️</div></div><div class="panel"><h2>Pick the tool</h2><div class="tools" id="tools"></div><h2>Then use it</h2><div class="actions"><button id="use" class="green">USE TOOL</button><button id="undo" class="red">UNSCREW</button></div></div></div></div>
<script>
const jobs=[
{name:'wagon',ask:'Jace, the wagon wheel is loose. Can you find the screwdriver?',tool:'Screwdriver',icon:'🪛',action:'SCREW',done:'Great job, Jace! You tightened the wagon wheel.'},
{name:'toy shelf',ask:'Jace, this shelf bolt is loose. Can you find the wrench?',tool:'Wrench',icon:'🔧',action:'TIGHTEN',done:'Nice fixing! The shelf is strong again.'},
{name:'wooden box',ask:'Jace, this board needs a nail. Can you find the hammer?',tool:'Hammer',icon:'🔨',action:'HAMMER',done:'Tap tap tap! You fixed the wooden box.'},
{name:'garden sign',ask:'Jace, this sign is too long. Can you find the saw?',tool:'Saw',icon:'🪚',action:'CUT',done:'Good job! You cut the board safely.'},
{name:'painted chair',ask:'Jace, this chair needs paint. Can you find the paintbrush?',tool:'Paintbrush',icon:'🖌️',action:'PAINT',done:'Beautiful work! The chair looks brand new.'}
];
const tools=[['🪛','Screwdriver'],['🔧','Wrench'],['🔨','Hammer'],['🪚','Saw'],['🖌️','Paintbrush'],['📏','Tape Measure']];
let ji=0,selected='';
const toolBox=document.getElementById('tools');
function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.rate=.82;u.pitch=1.08;speechSynthesis.speak(u)}
function renderTools(){toolBox.innerHTML='';tools.forEach(([ic,n])=>{let b=document.createElement('button');b.innerHTML=ic+'<small>'+n+'</small>';b.onclick=()=>{selected=n;document.querySelectorAll('#tools button').forEach(x=>x.classList.remove('toolsel'));b.classList.add('toolsel');document.getElementById('teacher').textContent='You picked the '+n+'. Now press USE TOOL.'};toolBox.appendChild(b)})}
function load(){selected='';document.querySelectorAll('#tools button').forEach(x=>x.classList.remove('toolsel'));let j=jobs[ji];document.getElementById('teacher').textContent=j.ask;document.getElementById('broken').textContent=j.name+' needs fixing';document.getElementById('use').textContent=j.action;document.getElementById('progress').textContent='Project '+(ji+1)+' of '+jobs.length;setTimeout(()=>speak(j.ask),250)}
document.getElementById('use').onclick=()=>{let j=jobs[ji];if(selected!==j.tool){document.getElementById('teacher').textContent='Good try, Jace. Find the '+j.tool+'.';speak('Good try, Jace. Find the '+j.tool+'.');return}let h=document.getElementById('hand');h.classList.add('show');setTimeout(()=>h.classList.remove('show'),700);document.getElementById('teacher').textContent=j.done;speak(j.done);setTimeout(()=>{ji=(ji+1)%jobs.length;load()},1500)};
document.getElementById('undo').onclick=()=>{document.getElementById('teacher').textContent='You turned it the other way. Try the main tool button to finish the job.';speak('You turned it the other way. Try the main tool button to finish the job.')};
renderTools();load();
</script></body></html>
