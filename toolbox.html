<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Jace's Fix-It Workshop</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:Arial Rounded MT Bold,Arial,sans-serif;background:linear-gradient(#d5e6eb,#efe2cb);color:#263845}header{text-align:center;background:linear-gradient(90deg,#a85f31,#d98b4a);color:#fff;padding:18px;font-size:clamp(30px,6vw,44px);font-weight:900}.wrap{max-width:1050px;margin:auto;padding:12px}.top{display:flex;justify-content:center;margin:8px}a,button{border:0;border-radius:16px;padding:12px 15px;font-size:16px;font-weight:900;background:#fff;color:#263845;text-decoration:none;box-shadow:0 4px #0002}.teacher{background:#fff;border-radius:20px;padding:13px;text-align:center;font-size:19px;font-weight:900;margin:10px 0}.game{display:grid;grid-template-columns:1.5fr .8fr;gap:14px}.shop{position:relative;height:570px;border:12px solid #704629;border-radius:28px;overflow:hidden;background:linear-gradient(#bfd1d6 0 48%,#7f5738 48%);box-shadow:inset 0 0 35px #0003}.pegboard{position:absolute;left:24px;right:24px;top:24px;height:185px;border:8px solid #8a6848;background:#c8aa7d;background-image:radial-gradient(#755f43 2px,transparent 2px);background-size:20px 20px}.benchTop{position:absolute;left:0;right:0;bottom:182px;height:35px;background:linear-gradient(#c18c55,#8c5a31)}.cabinet{position:absolute;left:70px;right:70px;bottom:0;height:182px;background:linear-gradient(#8c572e,#654020);border-top:10px solid #4b2b18}.wagon{position:absolute;left:50%;bottom:135px;transform:translateX(-50%);width:340px;height:135px;background:linear-gradient(#e25c4f,#a7302b);border:8px solid #7a2723;border-radius:18px;box-shadow:0 14px 12px #0004}.wagon:before{content:"";position:absolute;left:30px;right:30px;top:24px;height:12px;background:#f58c82;border-radius:8px}.wheel{position:absolute;bottom:-62px;width:112px;height:112px;border-radius:50%;background:radial-gradient(circle,#b8b8b8 0 12%,#292929 13% 56%,#111 57%);box-shadow:0 7px 9px #0005;transition:.6s}.wheel.l{left:24px}.wheel.r{right:24px}.wheel.loose{transform:rotate(15deg) translate(16px,10px)}.bolt{position:absolute;right:70px;bottom:42px;width:30px;height:30px;border-radius:50%;background:repeating-conic-gradient(#ccc 0 10deg,#7b7b7b 10deg 20deg);transition:.7s}.arm{position:absolute;left:58%;bottom:235px;width:120px;height:26px;background:#d99a6c;border-radius:18px;transform-origin:left center;opacity:0;transition:.45s}.arm:after{content:"";position:absolute;right:-24px;top:-10px;width:40px;height:45px;background:#d99a6c;border-radius:50%}.arm.go{opacity:1;transform:rotate(22deg) translate(18px,18px)}.panel{background:linear-gradient(#b94a3e,#7c2d28);border:9px solid #6b2521;border-radius:24px;padding:12px;box-shadow:inset 0 0 22px #0004}.panel h3{margin:0 0 10px;text-align:center;color:#fff}.toolbox{display:grid;grid-template-columns:1fr 1fr;gap:9px}.tool{min-height:102px;background:linear-gradient(#fafafa,#ddd);display:grid;place-items:center}.tool svg{width:58px;height:58px}.tool small{display:block;font-size:12px;margin-top:4px}.tool.sel{outline:5px solid #ffe36d}.use{width:100%;min-height:70px;margin-top:12px;background:#86dd86}.job{color:#fff;text-align:center;font-weight:900;margin-top:10px}@media(max-width:720px){.game{grid-template-columns:1fr}.shop{height:460px}.wagon{width:280px}.toolbox{grid-template-columns:repeat(3,1fr)}}</style></head><body>
<header>Jace's Fix-It Workshop</header><div class="wrap"><div class="top"><a href="jace.html">Back to Jace's World</a></div><div class="teacher" id="teacher">Jace, the wagon wheel is loose. Find the screwdriver.</div><div class="game"><div class="shop"><div class="pegboard"></div><div class="benchTop"></div><div class="cabinet"></div><div class="wagon" id="wagon"><div class="wheel l"></div><div class="wheel r loose" id="wheel"></div><div class="bolt" id="bolt"></div></div><div class="arm" id="arm"></div></div><aside class="panel"><h3>JACE'S TOOLBOX</h3><div class="toolbox" id="toolbox"></div><button class="use" id="useTool">USE TOOL</button><div class="job" id="jobLabel">Fix the wagon wheel</div></aside></div></div>
<script>
const icons={
Screwdriver:'<svg viewBox="0 0 100 100"><rect x="44" y="8" width="12" height="52" rx="5" fill="#b7bec7"/><path d="M42 8h16l-3 12H45z" fill="#666"/><rect x="34" y="55" width="32" height="38" rx="14" fill="#d44b3f"/><rect x="41" y="61" width="18" height="25" rx="7" fill="#f28a75"/></svg>',
Wrench:'<svg viewBox="0 0 100 100"><path d="M62 8c-11 2-20 12-19 24L16 68c-5 7 6 18 13 12l35-28c12 2 24-7 27-19l-18 7-12-12z" fill="#9ca7b3"/><circle cx="24" cy="72" r="6" fill="#5f6870"/></svg>',
Hammer:'<svg viewBox="0 0 100 100"><rect x="45" y="34" width="12" height="56" rx="5" fill="#9b653a"/><path d="M20 22h52v22H20z" fill="#616971"/><path d="M72 22l16 8-16 14z" fill="#42484f"/></svg>',
Paintbrush:'<svg viewBox="0 0 100 100"><rect x="45" y="42" width="12" height="50" rx="5" fill="#a96d36"/><path d="M28 10h46l-6 36H34z" fill="#e6c59a"/><path d="M28 10h46v13H28z" fill="#5a89d1"/></svg>',
Tape:'<svg viewBox="0 0 100 100"><rect x="18" y="24" width="64" height="52" rx="16" fill="#e5bb2f"/><circle cx="50" cy="50" r="17" fill="#fff"/><rect x="72" y="42" width="20" height="16" fill="#d8d8d8"/></svg>',
Pliers:'<svg viewBox="0 0 100 100"><path d="M34 18l16 28 16-28 9 6-16 31 18 34H63L50 65 37 89H23l18-34-16-31z" fill="#6f7a84"/><path d="M34 67l-11 22h14l13-24zm32 0l11 22H63L50 65z" fill="#d54a42"/></svg>'};
const jobs=[{tool:'Screwdriver',prompt:'Jace, the wagon wheel is loose. Find the screwdriver.',label:'Fix the wagon wheel',done:'Great job! You tightened the wagon wheel.'},{tool:'Wrench',prompt:'Jace, the workbench bolt is loose. Find the wrench.',label:'Tighten a bolt',done:'Nice work! The bolt is tight.'},{tool:'Hammer',prompt:'Jace, a board needs a nail. Find the hammer.',label:'Hammer the nail',done:'Tap tap tap! You fixed the board.'},{tool:'Paintbrush',prompt:'Jace, the wagon needs fresh paint. Find the paintbrush.',label:'Paint the wagon',done:'Look at that! The wagon has fresh paint.'}];
const tools=['Screwdriver','Wrench','Hammer','Paintbrush','Tape','Pliers'];let job=0,picked='';
function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.rate=.82;speechSynthesis.speak(u)}
tools.forEach(name=>{let b=document.createElement('button');b.className='tool';b.innerHTML=icons[name]+'<small>'+name+'</small>';b.onclick=()=>{picked=name;document.querySelectorAll('.tool').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');teacher.textContent='You picked the '+name+'. Press USE TOOL.'};toolbox.appendChild(b)});
function loadJob(){picked='';document.querySelectorAll('.tool').forEach(x=>x.classList.remove('sel'));teacher.textContent=jobs[job].prompt;jobLabel.textContent=jobs[job].label;setTimeout(()=>speak(jobs[job].prompt),250)}
useTool.onclick=()=>{const j=jobs[job];if(picked!==j.tool){teacher.textContent='Good try. Find the '+j.tool+'.';speak(teacher.textContent);return}arm.classList.add('go');if(job===0){wheel.classList.remove('loose');bolt.style.transform='rotate(360deg)'}if(job===3)wagon.style.background='linear-gradient(#5aa2e6,#2f70b3)';teacher.textContent=j.done;speak(j.done);setTimeout(()=>{arm.classList.remove('go');job=(job+1)%jobs.length;loadJob()},1800)};loadJob();
</script></body></html>
