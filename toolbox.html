<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Jace's Fix-It Shop</title><style>
*{box-sizing:border-box}body{margin:0;background:#d9e6e8;font-family:Arial Rounded MT Bold,Arial,sans-serif;color:#263845}header{text-align:center;background:#d89046;padding:17px;font-size:38px;font-weight:900}.wrap{max-width:980px;margin:auto;padding:12px}a,button{border:0;border-radius:16px;padding:12px 15px;font-size:17px;font-weight:900;background:#fff;color:#263845;text-decoration:none}.teacher{background:#fff;border-radius:20px;padding:13px;text-align:center;font-size:20px;font-weight:900;margin:10px}.shop{display:grid;grid-template-columns:1.4fr .8fr;gap:12px}.scene{position:relative;height:540px;background:linear-gradient(#afc9cf 0 58%,#7c5a3d 58%);border:10px solid #765038;border-radius:25px;overflow:hidden}.peg{position:absolute;inset:20px 20px auto;height:180px;background:#c9aa7a;background-image:radial-gradient(#745f43 2px,transparent 2px);background-size:20px 20px}.bench{position:absolute;left:0;right:0;bottom:0;height:215px;background:linear-gradient(#ad7442,#744725)}.wagon{position:absolute;left:50%;bottom:95px;transform:translateX(-50%);width:310px;height:130px;background:#c44738;border:8px solid #7a2b23;border-radius:15px}.wheel{position:absolute;bottom:-55px;width:105px;height:105px;border-radius:50%;background:radial-gradient(circle,#bbb 0 12%,#222 13% 55%,#111 56%);transition:.5s}.wheel.l{left:25px}.wheel.r{right:25px}.wheel.loose{transform:rotate(20deg) translate(12px,8px)}.screw{position:absolute;right:60px;bottom:34px;width:30px;height:30px;border-radius:50%;background:repeating-conic-gradient(#bbb 0 10deg,#777 10deg 20deg);transition:.7s}.hand{position:absolute;font-size:70px;left:57%;bottom:185px;opacity:0;transition:.4s}.hand.go{opacity:1;transform:translate(20px,35px) rotate(20deg)}.panel{background:#8b5d38;border-radius:22px;padding:12px}.toolbox{background:#d84a3f;border:8px solid #8d2824;border-radius:14px;padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.toolbox button{min-height:90px;font-size:34px}.toolbox small{display:block;font-size:12px}.sel{outline:5px solid #ffe36d}.use{display:block;width:100%;margin-top:12px;background:#82dc83;min-height:70px}@media(max-width:700px){.shop{grid-template-columns:1fr}.scene{height:430px}}</style></head><body><header>Jace's Fix-It Shop</header><div class="wrap"><a href="jace.html">Back</a><div class="teacher" id="say">Jace, the red wagon has a loose wheel. Find the screwdriver.</div><div class="shop"><div class="scene"><div class="peg"></div><div class="bench"></div><div class="wagon"><div class="wheel l"></div><div class="wheel r loose" id="wheel"></div><div class="screw" id="screw"></div></div><div class="hand" id="hand">🖐️</div></div><div class="panel"><div class="toolbox" id="box"></div><button class="use" id="use">USE TOOL</button></div></div></div><script>
const jobs=[['Screwdriver','🪛','The red wagon has a loose wheel. Find the screwdriver.','You tightened the wheel! Look, it is straight now.'],['Wrench','🔧','The workbench bolt is loose. Find the wrench.','You tightened the bolt!'],['Hammer','🔨','A board needs a nail. Find the hammer.','Tap, tap, tap! The nail is in.'],['Paintbrush','🖌️','The wagon needs fresh paint. Find the paintbrush.','You painted it! Great work.']];const tools=[['🪛','Screwdriver'],['🔧','Wrench'],['🔨','Hammer'],['🖌️','Paintbrush'],['📏','Tape'],['🗜️','Pliers']];let j=0,pick='';function speak(t){if(speechSynthesis){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.rate=.82;speechSynthesis.speak(u)}}function load(){pick='';document.querySelectorAll('#box button').forEach(b=>b.classList.remove('sel'));say.textContent='Jace, '+jobs[j][2];setTimeout(()=>speak(say.textContent),200)}tools.forEach(t=>{let b=document.createElement('button');b.innerHTML=t[0]+'<small>'+t[1]+'</small>';b.onclick=()=>{pick=t[1];document.querySelectorAll('#box button').forEach(q=>q.classList.remove('sel'));b.classList.add('sel')};box.appendChild(b)});use.onclick=()=>{if(pick!==jobs[j][0]){say.textContent='Try again. Find the '+jobs[j][0]+'.';speak(say.textContent);return}hand.classList.add('go');if(j===0){wheel.classList.remove('loose');screw.style.transform='rotate(360deg)'}if(j===3)document.querySelector('.wagon').style.background='#4c8ed1';say.textContent=jobs[j][3];speak(say.textContent);setTimeout(()=>{hand.classList.remove('go');j=(j+1)%jobs.length;load()},1800)};load();
</script></body></html>
