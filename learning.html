<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Jace Learn & Trace</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:Arial Rounded MT Bold,Arial;background:linear-gradient(#74d9ff,#b7ed7e,#ffe263);color:#123b66}header{text-align:center;padding:20px;background:linear-gradient(90deg,#188be5,#35c85b,#ffd62f,#ef4c43);font-size:36px;font-weight:900}.wrap{max-width:900px;margin:auto;padding:14px}.back{display:inline-block;background:#fff;padding:12px 16px;border-radius:18px;text-decoration:none;color:#123b66;font-weight:900}.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}.modes button,.pick button,.letters button,.controls button{border:0;border-radius:20px;background:#fff;padding:14px;font-size:19px;font-weight:900;color:#123b66;box-shadow:0 5px 0 #0002}.panel{background:#fff;border-radius:30px;padding:15px;text-align:center}.prompt{font-size:25px;font-weight:900;min-height:45px}.pick{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.pick button{font-size:55px;min-width:105px}.letters{display:flex;gap:7px;overflow-x:auto;padding:12px 0}.letters button{min-width:55px;height:55px;padding:0;font-size:25px;background:#ffe05a}.trace{position:relative;max-width:550px;height:350px;margin:10px auto;background:#fff;border:6px dashed #9ac4dc;border-radius:28px;overflow:hidden;touch-action:none}.guide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:270px;font-weight:900;color:#e1e1e1;pointer-events:none}.trace canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.controls button{background:#ffe05a}.number{font-size:150px;font-weight:900}.dots{font-size:45px;line-height:1.35;max-width:600px;margin:auto}.numBtns{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0}.numBtns button{border:0;border-radius:16px;background:#fff;padding:12px 5px;font-size:23px;font-weight:900;color:#123b66}.hidden{display:none}@media(max-width:500px){.guide{font-size:230px}.numBtns{grid-template-columns:repeat(4,1fr)}}</style></head><body><header>🔤 Jace's Learning Adventure 🔢</header><div class="wrap"><a class="back" href="jace.html">⬅️ Jace's World</a><div class="modes"><button data-mode="alphabet">🔤 Alphabet & Tracing</button><button data-mode="count">🔢 Counting</button><button data-mode="animals">🐶 Animals</button><button data-mode="trucks">🛻 Trucks & Colors</button></div>
<section class="panel" id="alphabet"><div class="prompt">Pick a letter. Hear it, see a word, then trace it with your finger!</div><div class="letters" id="letters"></div><div id="letterWord" style="font-size:28px;font-weight:900">A is for Apple 🍎</div><div class="trace"><div class="guide" id="guide">A</div><canvas id="canvas"></canvas></div><div class="controls"><button id="sayLetter">🔊 Hear Letter</button><button id="clear">🧽 Clear</button></div></section>
<section class="panel hidden" id="count"><div class="prompt">Count with Jace! Practice 1–13, then keep going to 20. ⭐</div><div class="numBtns" id="nums"></div><div class="number" id="bigNum">1</div><div class="dots" id="dots">⭐</div><div class="controls"><button id="hearNum">🔊 Count It</button><button id="nextNum">➡️ Next Number</button></div></section>
<section class="panel hidden" id="animals"><div class="prompt">Tap an animal to hear its name!</div><div class="pick" id="animalPick"></div></section>
<section class="panel hidden" id="trucks"><div class="prompt">Tap a vehicle or color!</div><div class="pick" id="truckPick"></div></section></div><script>
function say(t,rate=.9){if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.rate=rate;speechSynthesis.speak(u)}}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('section.panel').forEach(x=>x.classList.add('hidden'));document.querySelector('#'+b.dataset.mode).classList.remove('hidden')});
const words={A:['Apple','🍎'],B:['Ball','⚾'],C:['Car','🚗'],D:['Dinosaur','🦖'],E:['Elephant','🐘'],F:['Fire truck','🚒'],G:['Grapes','🍇'],H:['Hat','🧢'],I:['Ice cream','🍦'],J:['Jace','⭐'],K:['Kite','🪁'],L:['Lion','🦁'],M:['Monster truck','🛻'],N:['Nest','🪺'],O:['Orange','🍊'],P:['Pizza','🍕'],Q:['Queen','👑'],R:['Race car','🏎️'],S:['Star','⭐'],T:['Truck','🚚'],U:['Umbrella','☂️'],V:['Van','🚐'],W:['Watermelon','🍉'],X:['Xylophone','🎼'],Y:['Yo-yo','🪀'],Z:['Zebra','🦓']};let letter='A';
const letters=document.querySelector('#letters'),guide=document.querySelector('#guide'),lw=document.querySelector('#letterWord');
Object.keys(words).forEach(L=>{let b=document.createElement('button');b.textContent=L;b.onclick=()=>{letter=L;guide.textContent=L;lw.textContent=L+' is for '+words[L][0]+' '+words[L][1];clear();say(L+'. '+L+' is for '+words[L][0])};letters.appendChild(b)});
let c=document.querySelector('#canvas'),ctx=c.getContext('2d'),down=false,last=null;function fit(){let r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);c.width=r.width*d;c.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);ctx.strokeStyle='#1678e5';ctx.lineWidth=20;ctx.lineCap='round'}setTimeout(fit,100);function pos(e){let r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}c.onpointerdown=e=>{down=true;last=pos(e);c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!down)return;let p=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p};c.onpointerup=()=>down=false;function clear(){ctx.clearRect(0,0,c.width,c.height)}document.querySelector('#clear').onclick=clear;document.querySelector('#sayLetter').onclick=()=>say(letter+'. '+letter+' is for '+words[letter][0]);
let n=1;const nums=document.querySelector('#nums'),big=document.querySelector('#bigNum'),dots=document.querySelector('#dots');for(let i=1;i<=20;i++){let b=document.createElement('button');b.textContent=i;if(i<=13)b.style.background='#ffe05a';b.onclick=()=>showN(i);nums.appendChild(b)}function showN(v){n=v;big.textContent=v;dots.textContent='⭐'.repeat(Math.min(v,20));say(v+'. Count '+v+' stars.')}document.querySelector('#hearNum').onclick=()=>say('Let us count to '+n+'. '+Array.from({length:n},(_,i)=>i+1).join(', '),.82);document.querySelector('#nextNum').onclick=()=>showN(n===20?1:n+1);
[['🐶','Dog'],['🐱','Cat'],['🐮','Cow'],['🦁','Lion'],['🐘','Elephant'],['🐵','Monkey'],['🐸','Frog'],['🦆','Duck']].forEach(x=>{let b=document.createElement('button');b.textContent=x[0];b.onclick=()=>say(x[1]);document.querySelector('#animalPick').appendChild(b)});
[['🚒','Fire truck'],['🛻','Monster truck'],['🚜','Green tractor'],['🚓','Blue police car'],['🔴','Red'],['🔵','Blue'],['🟢','Green'],['🟡','Yellow']].forEach(x=>{let b=document.createElement('button');b.textContent=x[0];b.onclick=()=>say(x[1]);document.querySelector('#truckPick').appendChild(b)});
</script></body></html>
