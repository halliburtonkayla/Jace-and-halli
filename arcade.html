<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Jace & Halli Arcade</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#17213c;color:#fff;font-family:Arial Rounded MT Bold,Arial,sans-serif}.wrap{max-width:1000px;margin:auto;padding:12px}header{text-align:center;font-size:40px;font-weight:900;padding:18px;background:linear-gradient(90deg,#52347c,#ca4f77)}a,button{border:0;border-radius:16px;padding:12px 16px;font-size:17px;font-weight:900;text-decoration:none;background:#fff;color:#17213c}.bar,.tabs,.controls{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin:10px}.tab.on{background:#ffe36d}.panel{display:none}.panel.on{display:block}.machine{background:linear-gradient(#432765,#1d1830);border:8px solid #705a9c;border-radius:30px;padding:12px;box-shadow:inset 0 0 40px #0008,0 10px 30px #0008}.hud{text-align:center;font-size:20px;font-weight:900;padding:8px}canvas{display:block;width:100%;height:auto;border-radius:20px;touch-action:none;background:#111}.controls button{min-width:125px;min-height:62px}.gas{background:#80df86}.brake{background:#f08c8c}.tip{text-align:center;padding:7px}.circle{position:relative;max-width:500px;aspect-ratio:1;margin:auto;border-radius:50%;background:#15151f;border:12px solid #555}.light{position:absolute;width:12%;height:12%;border-radius:50%;background:#403d49;transform:translate(-50%,-50%);border:3px solid #777}.light.hot{background:#fff06b;box-shadow:0 0 30px #fff06b}.light.win{background:#56e878}.stop{display:block;margin:18px auto;background:#ef5265;color:#fff;font-size:26px;min-width:220px;min-height:75px}</style></head><body><header>Jace & Halli's Arcade</header><div class="wrap"><div class="bar"><a href="index.html">Family Home</a><a href="together.html">Play Together</a></div><div class="tabs"><button class="tab on" data-p="skee">Skee Ball</button><button class="tab" data-p="moto">Motorcycle</button><button class="tab" data-p="light">Stop the Light</button></div>
<section id="skee" class="panel on"><div class="machine"><div class="hud">SCORE <b id="ss">0</b> · BALLS <b id="balls">9</b></div><div class="tip">Touch the ball, aim toward a hole, and swipe UP to roll it.</div><canvas id="sc" width="900" height="650"></canvas><div class="controls"><button id="newSkee">New Game</button></div></div></section>
<section id="moto" class="panel"><div class="machine"><div class="hud">SPEED <b id="speed">0</b> · SCORE <b id="ms">0</b></div><div class="tip">Hold GAS. Lean left or right when the road curves.</div><canvas id="mc" width="900" height="600"></canvas><div class="controls"><button id="ll">LEAN LEFT</button><button id="gas" class="gas">GAS</button><button id="rr">LEAN RIGHT</button><button id="brake" class="brake">BRAKE</button></div></div></section>
<section id="light" class="panel"><div class="machine"><div class="hud">TICKETS <b id="tickets">0</b></div><div class="circle" id="circle"></div><button class="stop" id="stop">STOP!</button><div class="hud" id="lm">Stop on the green jackpot light!</div></div></section></div><script>
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.getElementById(b.dataset.p).classList.add('on')});
// SKEE BALL realistic perspective lane
const sc=document.getElementById('sc'),x=sc.getContext('2d');let sb={x:450,y:575,vx:0,vy:0,roll:false},start=null,score=0,balls=9;
const holes=[{x:450,y:105,r:43,p:100},{x:315,y:150,r:40,p:50},{x:585,y:150,r:40,p:50},{x:450,y:195,r:45,p:40},{x:450,y:275,r:49,p:30},{x:450,y:355,r:53,p:20},{x:450,y:435,r:57,p:10}];
function lane(){x.clearRect(0,0,900,650);let bg=x.createLinearGradient(0,0,0,650);bg.addColorStop(0,'#17111d');bg.addColorStop(1,'#5b2438');x.fillStyle=bg;x.fillRect(0,0,900,650);x.fillStyle='#c99356';x.beginPath();x.moveTo(310,470);x.lineTo(355,65);x.lineTo(545,65);x.lineTo(590,470);x.lineTo(720,650);x.lineTo(180,650);x.closePath();x.fill();x.strokeStyle='#6c4025';x.lineWidth=12;x.stroke();x.fillStyle='#9a6537';x.beginPath();x.moveTo(310,470);x.quadraticCurveTo(450,385,590,470);x.lineTo(720,650);x.lineTo(180,650);x.closePath();x.globalAlpha=.45;x.fill();x.globalAlpha=1;holes.forEach(h=>{x.fillStyle='#201a1e';x.beginPath();x.ellipse(h.x,h.y,h.r,h.r*.55,0,0,7);x.fill();x.strokeStyle='#e8c765';x.lineWidth=7;x.stroke();x.fillStyle='#fff';x.font='bold 21px Arial';x.textAlign='center';x.fillText(h.p,h.x,h.y+7)});let grad=x.createRadialGradient(sb.x-9,sb.y-12,4,sb.x,sb.y,28);grad.addColorStop(0,'#fff');grad.addColorStop(.3,'#e54d4d');grad.addColorStop(1,'#7d1717');x.fillStyle=grad;x.beginPath();x.arc(sb.x,sb.y,27,0,7);x.fill()}
function resetBall(){sb={x:450,y:575,vx:0,vy:0,roll:false};lane()}
function fire(dx,dy){if(sb.roll||balls<=0)return;let mag=Math.hypot(dx,dy);if(dy>-25||mag<35)return;balls--;document.getElementById('balls').textContent=balls;sb.roll=true;sb.vx=dx*.055;sb.vy=Math.max(-17,dy*.055)}
sc.onpointerdown=e=>{let r=sc.getBoundingClientRect();start={x:(e.clientX-r.left)*900/r.width,y:(e.clientY-r.top)*650/r.height}};
sc.onpointerup=e=>{if(!start)return;let r=sc.getBoundingClientRect(),p={x:(e.clientX-r.left)*900/r.width,y:(e.clientY-r.top)*650/r.height};fire(p.x-start.x,p.y-start.y);start=null};
function skee(){if(sb.roll){sb.x+=sb.vx;sb.y+=sb.vy;sb.vx*=.992;sb.vy*=.994;for(let h of holes)if(Math.hypot(sb.x-h.x,(sb.y-h.y)*1.5)<h.r*.8){score+=h.p;document.getElementById('ss').textContent=score;resetBall();break}if(sb.y<45||sb.x<250||sb.x>650||Math.abs(sb.vy)<.18)resetBall()}lane();requestAnimationFrame(skee)}document.getElementById('newSkee').onclick=()=>{score=0;balls=9;document.getElementById('ss').textContent=0;document.getElementById('balls').textContent=9;resetBall()};resetBall();requestAnimationFrame(skee);
// MOTORCYCLE first-person chase camera
const mc=document.getElementById('mc'),m=mc.getContext('2d');let road=0,bike={lean:0,speed:0},mk={l:0,r:0,g:0,b:0},mScore=0;
function hold(id,k){let el=document.getElementById(id);['pointerdown','touchstart'].forEach(n=>el.addEventListener(n,e=>{e.preventDefault();mk[k]=1},{passive:false}));['pointerup','pointercancel','pointerleave','touchend'].forEach(n=>el.addEventListener(n,e=>{e.preventDefault();mk[k]=0},{passive:false}))}hold('ll','l');hold('rr','r');hold('gas','g');hold('brake','b');
function motoDraw(){m.clearRect(0,0,900,600);m.fillStyle='#8ed8f5';m.fillRect(0,0,900,220);m.fillStyle='#5e9d50';m.fillRect(0,220,900,380);let curve=Math.sin(road/115)*180,far=450+curve*.15,near=450+curve;m.fillStyle='#494949';m.beginPath();m.moveTo(far-75,220);m.lineTo(far+75,220);m.lineTo(near+360,600);m.lineTo(near-360,600);m.closePath();m.fill();m.strokeStyle='#f7f0cf';m.lineWidth=9;m.setLineDash([28,28]);m.beginPath();m.moveTo(far,220);m.lineTo(near,600);m.stroke();m.setLineDash([]);m.fillStyle='#fff';m.font='bold 20px Arial';m.fillText('LEAN INTO THE TURN',20,45);m.save();m.translate(450,500);m.rotate(bike.lean*.55);m.fillStyle='#171717';m.beginPath();m.ellipse(0,60,25,48,0,0,7);m.fill();m.fillStyle='#d72e2e';m.beginPath();m.moveTo(-42,45);m.lineTo(-24,-55);m.lineTo(24,-55);m.lineTo(42,45);m.closePath();m.fill();m.fillStyle='#222';m.fillRect(-62,-18,124,13);m.fillStyle='#365a91';m.fillRect(-28,-100,56,72);m.fillStyle='#f1ad7b';m.beginPath();m.arc(0,-116,27,0,7);m.fill();m.fillStyle='#222';m.beginPath();m.arc(0,-123,29,Math.PI,0);m.fill();m.restore()}
function moto(){if(mk.g)bike.speed=Math.min(10,bike.speed+.09);else bike.speed=Math.max(0,bike.speed-.035);if(mk.b)bike.speed=Math.max(0,bike.speed-.18);let wanted=(mk.r?1:0)-(mk.l?1:0);bike.lean+=(wanted-bike.lean)*.12;road+=bike.speed;let need=Math.sin(road/115);if(bike.speed>4&&Math.abs(need)> .35&&Math.sign(need)!==Math.sign(bike.lean)&&Math.abs(bike.lean)<.25)bike.speed*=.985;else mScore+=bike.speed*.025;document.getElementById('speed').textContent=Math.floor(bike.speed*10);document.getElementById('ms').textContent=Math.floor(mScore);motoDraw();requestAnimationFrame(moto)}requestAnimationFrame(moto);
// light
const circle=document.getElementById('circle');let ls=[],hot=0,tickets=0,running=true,lastT=0,jp=4;for(let i=0;i<16;i++){let e=document.createElement('div');e.className='light';let a=i/16*Math.PI*2-Math.PI/2;e.style.left=(50+41*Math.cos(a))+'%';e.style.top=(50+41*Math.sin(a))+'%';circle.appendChild(e);ls.push(e)}ls[jp].classList.add('win');function lt(t){if(running&&t-lastT>85){ls[hot].classList.remove('hot');hot=(hot+1)%16;ls[hot].classList.add('hot');lastT=t}requestAnimationFrame(lt)}requestAnimationFrame(lt);document.getElementById('stop').onclick=()=>{if(!running){running=true;stop.textContent='STOP!';lm.textContent='Stop on the green jackpot light!';return}running=false;let w=hot===jp;tickets+=w?100:10;document.getElementById('tickets').textContent=tickets;lm.textContent=w?'JACKPOT! 100 tickets!':'10 tickets! Tap PLAY AGAIN.';stop.textContent='PLAY AGAIN'};
</script></body></html>
