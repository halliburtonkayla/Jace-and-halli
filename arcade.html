<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Jace & Halli Arcade</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:Arial Rounded MT Bold,Arial,sans-serif;background:linear-gradient(#20164b,#51287d,#ff8fb8);color:#fff}.wrap{max-width:980px;margin:auto;padding:14px}header{text-align:center;font-size:clamp(30px,7vw,48px);font-weight:900;padding:18px;background:#0004}.bar,.tabs,.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:10px 0}a,button{border:0;border-radius:18px;background:#fff;color:#37205e;padding:12px 16px;font-size:18px;font-weight:900;text-decoration:none;box-shadow:0 5px #0004}.tab.on{background:#ffe56a}.panel{display:none;background:#fff1;border:4px solid #fff5;border-radius:28px;padding:12px}.panel.on{display:block}canvas{display:block;width:100%;height:auto;border-radius:22px;background:#111;touch-action:none}.hud{text-align:center;font-size:20px;font-weight:900;padding:8px}.big{min-height:66px;min-width:130px}.green{background:#95e88f}.red{background:#ff9b9b}.circleGame{position:relative;max-width:520px;aspect-ratio:1;margin:auto;background:#171126;border-radius:50%;border:8px solid #fff3}.light{position:absolute;width:13%;height:13%;border-radius:50%;background:#504867;border:4px solid #fff2;transform:translate(-50%,-50%)}.light.hot{background:#fff16a;box-shadow:0 0 28px #fff16a}.light.win{background:#70ff8f}.stop{display:block;margin:16px auto;background:#ff687c;color:#fff;font-size:25px;min-width:210px;min-height:76px}.scoreline{text-align:center;font-weight:900;font-size:22px}
</style></head><body><header>Jace & Halli Arcade</header><div class="wrap"><div class="bar"><a href="index.html">Family Home</a><a href="together.html">Play Together</a></div><div class="tabs"><button class="tab on" data-tab="skee">Skee Ball</button><button class="tab" data-tab="moto">Moto Lean</button><button class="tab" data-tab="light">Stop the Light</button></div>
<section id="skee" class="panel on"><div class="hud">Score: <b id="skeeScore">0</b> — Swipe the ball up toward a ring!</div><canvas id="skeeCanvas" width="900" height="600"></canvas><div class="controls"><button id="skeeReset">New Game</button></div></section>
<section id="moto" class="panel"><div class="hud">Stay on the road and lean into the turns! Score: <b id="motoScore">0</b></div><canvas id="motoCanvas" width="900" height="520"></canvas><div class="controls"><button id="leanL" class="big">LEAN LEFT</button><button id="gasMoto" class="big green">GAS</button><button id="leanR" class="big">LEAN RIGHT</button><button id="brakeMoto" class="big red">BRAKE</button></div></section>
<section id="light" class="panel"><div class="scoreline">Tickets: <b id="tickets">0</b></div><div class="circleGame" id="circle"></div><button class="stop" id="stopLight">STOP!</button><div class="hud" id="lightMsg">Stop the moving light on the green jackpot spot.</div></section>
</div><script>
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.getElementById(b.dataset.tab).classList.add('on')});

// SKEE BALL
const sc=document.getElementById('skeeCanvas'),sx=sc.getContext('2d');let ball={x:450,y:535,vx:0,vy:0,moving:false},skeeScore=0,start=null;
const rings=[{x:450,y:145,r:58,p:50},{x:300,y:220,r:52,p:30},{x:600,y:220,r:52,p:30},{x:390,y:305,r:47,p:20},{x:510,y:305,r:47,p:20},{x:450,y:390,r:43,p:10}];
function drawSkee(){sx.clearRect(0,0,900,600);let bg=sx.createLinearGradient(0,0,0,600);bg.addColorStop(0,'#421c67');bg.addColorStop(1,'#1b1232');sx.fillStyle=bg;sx.fillRect(0,0,900,600);sx.fillStyle='#6f4a3a';sx.beginPath();sx.moveTo(260,600);sx.lineTo(350,110);sx.lineTo(550,110);sx.lineTo(640,600);sx.closePath();sx.fill();rings.forEach(r=>{sx.fillStyle='#1b1232';sx.strokeStyle='#ffe56a';sx.lineWidth=9;sx.beginPath();sx.arc(r.x,r.y,r.r,0,7);sx.fill();sx.stroke();sx.fillStyle='#fff';sx.font='bold 24px Arial';sx.textAlign='center';sx.fillText(r.p,r.x,r.y+8)});sx.fillStyle='#ff655f';sx.beginPath();sx.arc(ball.x,ball.y,24,0,7);sx.fill()}
function resetBall(){ball={x:450,y:535,vx:0,vy:0,moving:false};drawSkee()}
function launch(dx,dy){if(ball.moving)return;ball.moving=true;ball.vx=dx*.045;ball.vy=dy*.045}
sc.addEventListener('pointerdown',e=>{let r=sc.getBoundingClientRect();start={x:(e.clientX-r.left)*900/r.width,y:(e.clientY-r.top)*600/r.height}});
sc.addEventListener('pointerup',e=>{if(!start)return;let r=sc.getBoundingClientRect(),p={x:(e.clientX-r.left)*900/r.width,y:(e.clientY-r.top)*600/r.height};launch(p.x-start.x,p.y-start.y);start=null});
function skeeLoop(){if(ball.moving){ball.x+=ball.vx;ball.y+=ball.vy;ball.vx*=.992;ball.vy*=.992;for(const r of rings){if(Math.hypot(ball.x-r.x,ball.y-r.y)<r.r-10){skeeScore+=r.p;document.getElementById('skeeScore').textContent=skeeScore;resetBall();break}}if(ball.y<50||ball.x<190||ball.x>710||Math.abs(ball.vx)+Math.abs(ball.vy)<.3)resetBall()}drawSkee();requestAnimationFrame(skeeLoop)}document.getElementById('skeeReset').onclick=()=>{skeeScore=0;document.getElementById('skeeScore').textContent=0;resetBall()};resetBall();requestAnimationFrame(skeeLoop);

// MOTO LEAN
const mc=document.getElementById('motoCanvas'),mx=mc.getContext('2d');let moto={x:450,lean:0,speed:0},road=0,motoScore=0,mkeys={l:0,r:0,g:0,b:0};
function hold(id,key){let el=document.getElementById(id);['pointerdown','touchstart'].forEach(n=>el.addEventListener(n,e=>{e.preventDefault();mkeys[key]=1},{passive:false}));['pointerup','pointerleave','pointercancel','touchend'].forEach(n=>el.addEventListener(n,e=>{e.preventDefault();mkeys[key]=0},{passive:false}))}hold('leanL','l');hold('leanR','r');hold('gasMoto','g');hold('brakeMoto','b');
function motoDraw(){mx.clearRect(0,0,900,520);mx.fillStyle='#78d7ff';mx.fillRect(0,0,900,190);mx.fillStyle='#5ea34c';mx.fillRect(0,190,900,330);let curve=Math.sin(road/85)*125;mx.fillStyle='#555';mx.beginPath();mx.moveTo(360+curve*.15,190);mx.lineTo(540+curve*.15,190);mx.lineTo(750+curve,520);mx.lineTo(150+curve,520);mx.closePath();mx.fill();mx.strokeStyle='#fff';mx.lineWidth=7;mx.setLineDash([25,25]);mx.beginPath();mx.moveTo(450+curve*.15,190);mx.lineTo(450+curve,520);mx.stroke();mx.setLineDash([]);mx.save();mx.translate(moto.x,430);mx.rotate(moto.lean*.45);mx.fillStyle='#e43737';mx.fillRect(-20,-55,40,80);mx.fillStyle='#111';mx.beginPath();mx.arc(0,35,21,0,7);mx.fill();mx.fillStyle='#f2b17e';mx.beginPath();mx.arc(0,-64,20,0,7);mx.fill();mx.restore()}
function motoLoop(){if(mkeys.g)moto.speed=Math.min(8,moto.speed+.08);else moto.speed=Math.max(0,moto.speed-.025);if(mkeys.b)moto.speed=Math.max(0,moto.speed-.15);moto.lean+=( ((mkeys.r?1:0)-(mkeys.l?1:0))-moto.lean)*.12;road+=moto.speed;let curve=Math.sin(road/85)*125;moto.x+=moto.lean*3.5;let target=450+curve*.75;if(Math.abs(moto.x-target)>245){moto.speed*=.94;document.querySelector('#motoScore').textContent=Math.max(0,Math.floor(motoScore-10))}else motoScore+=moto.speed*.025;document.getElementById('motoScore').textContent=Math.floor(motoScore);moto.x=Math.max(120,Math.min(780,moto.x));motoDraw();requestAnimationFrame(motoLoop)}requestAnimationFrame(motoLoop);

// STOP THE LIGHT
const circle=document.getElementById('circle');let lights=[],hot=0,tickets=0,lastTick=0,speed=95,running=true,jackpot=3;
for(let i=0;i<16;i++){let b=document.createElement('div');b.className='light';let a=i/16*Math.PI*2-Math.PI/2;b.style.left=(50+41*Math.cos(a))+'%';b.style.top=(50+41*Math.sin(a))+'%';circle.appendChild(b);lights.push(b)}
lights[jackpot].classList.add('win');
function tick(t){if(running&&t-lastTick>speed){lights[hot].classList.remove('hot');hot=(hot+1)%lights.length;lights[hot].classList.add('hot');lastTick=t}requestAnimationFrame(tick)}requestAnimationFrame(tick);
document.getElementById('stopLight').onclick=()=>{if(!running){running=true;document.getElementById('stopLight').textContent='STOP!';document.getElementById('lightMsg').textContent='Stop the moving light on the green jackpot spot.';return}running=false;let won=hot===jackpot;tickets+=won?100:10;document.getElementById('tickets').textContent=tickets;document.getElementById('lightMsg').textContent=won?'JACKPOT! 100 tickets!':'Nice try! 10 tickets. Tap again to play.';document.getElementById('stopLight').textContent='PLAY AGAIN'};
</script></body></html>
