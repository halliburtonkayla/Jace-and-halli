<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Clicky Computer</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(#7bdcff,#d8f5ff);font-family:Arial Rounded MT Bold,Arial,sans-serif;text-align:center;color:#17335c}.home{position:absolute;left:12px;top:12px;background:#fff;padding:12px;border-radius:16px;text-decoration:none;font-size:26px}.monitor{margin:25px auto 12px;width:min(92vw,850px);height:38vh;background:#222;border:18px solid #333;border-radius:25px;display:flex;align-items:center;justify-content:center}.screen{width:100%;height:100%;background:#f9fcff;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:clamp(55px,12vw,130px);font-weight:900;overflow:hidden}.keyboard{width:min(96vw,900px);margin:auto;background:#555;padding:14px;border-radius:24px;display:grid;grid-template-columns:repeat(10,1fr);gap:7px}.key{min-height:54px;border:0;border-radius:10px;background:#fff;font-size:22px;font-weight:900;box-shadow:0 5px 0 #aaa}.key:active{transform:translateY(4px);box-shadow:0 1px 0 #aaa;background:#ffe66d}.mouse{margin:14px auto;background:#eee;width:90px;height:110px;border-radius:48px;border:4px solid #777;display:flex;align-items:center;justify-content:center;font-size:36px}</style></head><body><a class="home" href="jace.html">🏠</a><h1>MY CLICKY COMPUTER</h1><div class="monitor"><div class="screen" id="s">⌨️</div></div><div class="keyboard" id="k"></div><button class="mouse" id="m">🖱️</button><script>const letters='1234567890QWERTYUIOPASDFGHJKLZXCVBNM';function click(){let a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.frequency.value=150;g.gain.setValueAtTime(.12,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.05);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+.05)}for(let ch of letters){let b=document.createElement('button');b.className='key';b.textContent=ch;b.onclick=()=>{click();s.textContent=ch;s.animate([{transform:'scale(.7)'},{transform:'scale(1.15)'},{transform:'scale(1)'}],{duration:220});speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(ch))};k.appendChild(b)}m.onclick=()=>{click();s.textContent=['⭐','🦖','🎈','🚗','🐶','🍎'][Math.floor(Math.random()*6)]};</script></body></html>
