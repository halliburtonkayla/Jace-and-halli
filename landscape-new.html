<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Jace's Real Yard Crew</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;font-family:Arial Rounded MT Bold,Arial,sans-serif;background:#111;overflow:hidden}.game{position:fixed;inset:0;background-image:linear-gradient(#0000,#0001),url('https://risewellhomes.com/_next/image?q=75&url=https%3A%2F%2F48078207.fs1.hubspotusercontent-na1.net%2Fhub%2F48078207%2Fhubfs%2FApproved%2520Division%2520Assets%2FDallas-Fort%2520Worth%2FLS%2520El%2520Dorado%2F06%2520-%2520Model%2520Photography%2FConcept%25202492%2FEl%2520Dorado-Model-Concept%25202492-Backyard3%2520W%2520Edits-Risewell%2520Homes.jpg&w=3840');background-size:cover;background-position:center;touch-action:none}.top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;padding:10px;z-index:20}.round{width:62px;height:62px;border-radius:50%;border:5px solid white;background:#168be8;color:white;font-size:30px;box-shadow:0 5px 12px #0006}.progress{width:min(420px,52vw);height:52px;border:6px solid #fff;border-radius:28px;background:#333;overflow:hidden;box-shadow:0 4px 12px #0005}.fill{height:100%;width:0;background:linear-gradient(#8dff37,#37c71d);transition:width .2s}.tools{position:absolute;left:10px;top:82px;display:grid;gap:9px;z-index:20}.tool{width:104px;height:92px;border:6px solid #fff;border-radius:22px;background:#fff;color:#111;font-weight:900;font-size:13px;box-shadow:0 5px 12px #0006;overflow:hidden;padding:5px}.tool.on{outline:6px solid #ffd526}.tool img{width:100%;height:70px;object-fit:contain;display:block}.tool .pic{font-size:48px;line-height:65px}.start{position:absolute;right:20px;bottom:25px;width:125px;height:125px;border-radius:50%;border:9px solid #fff;background:#23d719;color:#fff;font-size:23px;font-weight:900;box-shadow:0 7px 16px #0008;z-index:25}.start.on{background:#ef3e32}.machine{position:absolute;left:50%;top:68%;width:210px;transform:translate(-50%,-50%);z-index:12;filter:drop-shadow(0 12px 8px #0008);touch-action:none;user-select:none}.machine{height:190px}.machine .mowerBody{position:relative;width:190px;height:170px}.deck{position:absolute;left:20px;bottom:20px;width:150px;height:72px;border-radius:42% 42% 25% 25%;background:linear-gradient(#f84b38,#a8120d);border:4px solid #78100c}.engine{position:absolute;left:62px;bottom:70px;width:72px;height:55px;border-radius:18px;background:radial-gradient(circle at 50% 35%,#555 0 9px,#171717 10px 24px,#090909 25px);z-index:3}.wheel{position:absolute;bottom:10px;width:38px;height:38px;border-radius:50%;background:radial-gradient(circle,#555 0 7px,#111 8px 18px,#000 19px);z-index:4}.w1{left:12px}.w2{right:12px}.handle{position:absolute;left:82px;bottom:92px;width:8px;height:90px;background:#222;transform:rotate(-18deg);transform-origin:bottom;border-radius:6px}.handle:before{content:"";position:absolute;left:-37px;top:0;width:80px;height:8px;border-radius:6px;background:#222}.machine.rake .mowerBody{display:none}.machine.rake:after{content:"🧹";font-size:150px}.machine.simple{display:none}.simpleTool{position:absolute;left:50%;top:68%;transform:translate(-50%,-50%);font-size:150px;z-index:12;filter:drop-shadow(0 12px 8px #0007);touch-action:none}.cut{position:absolute;width:125px;height:105px;border-radius:46%;background:repeating-linear-gradient(90deg,rgba(45,117,38,.34) 0 18px,rgba(111,177,73,.32) 18px 36px);filter:blur(2px);transform:translate(-50%,-50%);z-index:3;pointer-events:none;mix-blend-mode:multiply}.leaf{position:absolute;font-size:18px;filter:drop-shadow(0 2px 2px #0005);z-index:8;pointer-events:none}.weed{position:absolute;font-size:19px;filter:drop-shadow(0 2px 2px #0004);z-index:8;pointer-events:none}.speech{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:#fffdeeee;padding:10px 18px;border-radius:22px;font-weight:900;font-size:18px;z-index:20;box-shadow:0 4px 10px #0004}.hand{position:absolute;left:58%;top:58%;font-size:54px;z-index:18;animation:demo 1.4s infinite alternate;pointer-events:none}@keyframes demo{to{transform:translate(-90px,65px)}}@media(max-width:700px){.tools{top:80px}.tool{width:88px;height:82px;font-size:10px}.tool img{height:50px}.tool .pic{font-size:36px;line-height:48px}.machine{width:160px}.simpleTool{font-size:110px}.start{width:95px;height:95px;font-size:17px}.speech{font-size:13px;bottom:8px}.round{width:52px;height:52px}.progress{height:44px}}.kid{position:absolute;left:55px;top:-112px;width:75px;text-align:center;z-index:8;filter:drop-shadow(0 6px 5px #0005)}.kid .head{font-size:40px}.kid .body{font-size:42px;margin-top:-12px}.kid .legs{font-size:38px;margin-top:-15px}.held{position:absolute;left:15px;top:0;font-size:115px;transform-origin:60% 70%}.machine.rake .held{animation:rakeMotion .65s ease-in-out infinite alternate}.machine.weed .held{animation:trimMotion .22s linear infinite alternate}.machine.blower .held{animation:blowerMotion .35s ease-in-out infinite alternate}@keyframes rakeMotion{from{transform:rotate(-20deg) translateX(-18px)}to{transform:rotate(18deg) translateX(20px)}}@keyframes trimMotion{from{transform:rotate(-5deg)}to{transform:rotate(6deg)}}@keyframes blowerMotion{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}</style></head><body><div class="game" id="game">
<div class="top"><button class="round" onclick="location.href='jace.html'">⌂</button><div style="background:#fff;border-radius:24px;padding:9px 18px;color:#173a2b;font-weight:900">YARD CREW</div><button class="round" id="sound">🔊</button></div>
<div class="tools"><button class="tool on" data-tool="mower"><div class="pic">🏡</div>MOWER</button><button class="tool" data-tool="weed"><div class="pic">✂️</div>WEED EATER</button><button class="tool" data-tool="blower"><div class="pic">💨</div>BLOWER</button><button class="tool" data-tool="rake"><div class="pic">🍂</div>RAKE</button></div>
<div id="machine" class="machine mower" aria-label="yard tool"><div class="mowerBody"><div class="engine"></div><div class="deck"></div><div class="wheel w1"></div><div class="wheel w2"></div><div class="handle"></div></div></div><div id="simpleTool" class="simpleTool" style="display:none">✂️</div><button id="start" class="start">START</button><div class="speech" id="speech">Tap START, then drag the mower with your finger!</div><div class="hand" id="hand">☝️</div></div>
<script>
const game=document.getElementById('game'),machine=document.getElementById('machine'),simple=document.getElementById('simpleTool'),start=document.getElementById('start'),speech=document.getElementById('speech'),hand=document.getElementById('hand');let tool='mower',running=false,drag=false,soundOn=true,lastMark=0,audioCtx=null,osc=null,gain=null;
function say(t){speech.textContent=t;if(soundOn&&'speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=.88;speechSynthesis.speak(u)}}
function activeEl(){return machine}
function startSound(){stopSound();if(!soundOn)return;audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();osc=audioCtx.createOscillator();gain=audioCtx.createGain();osc.type=tool==='mower'?'sawtooth':tool==='blower'?'square':'triangle';osc.frequency.value=tool==='mower'?72:tool==='blower'?125:tool==='weed'?105:48;gain.gain.value=tool==='rake'?.035:.065;osc.connect(gain);gain.connect(audioCtx.destination);osc.start()}
function stopSound(){if(osc){try{osc.stop()}catch(e){}osc=null}}
function setCharacter(){machine.innerHTML='<div class="kid"><div class="head">🧢</div><div class="body">👕</div><div class="legs">👖</div></div><div class="held">'+(tool==='mower'?'<div class="mowerBody"><div class="engine"></div><div class="deck"></div><div class="wheel w1"></div><div class="wheel w2"></div><div class="handle"></div></div>':tool==='rake'?'🧹':tool==='blower'?'📣':'✂️')+'</div>';machine.className='machine '+tool}
function setPos(x,y){const r=game.getBoundingClientRect(),el=activeEl();x=Math.max(90,Math.min(r.width-90,x));y=Math.max(150,Math.min(r.height-80,y));el.style.left=x+'px';el.style.top=y+'px';if(running)work(x,y)}
function work(x,y){const now=performance.now();if(now-lastMark<70)return;lastMark=now;if(tool==='mower'){const d=document.createElement('div');d.className='cut';d.style.left=x+'px';d.style.top=(y+45)+'px';game.insertBefore(d,machine);setTimeout(()=>d.remove(),25000);}else if(tool==='weed'){document.querySelectorAll('.weed').forEach(w=>{const a=w.getBoundingClientRect();if(Math.hypot(a.left-x,a.top-y)<100){w.remove();}})}else if(tool==='blower'){document.querySelectorAll('.leaf').forEach(v=>{const a=v.getBoundingClientRect();if(Math.hypot(a.left-x,a.top-y)<130){v.style.left=(parseFloat(v.style.left)+70)+'px';v.style.top=(parseFloat(v.style.top)+25)+'px';}})}else{document.querySelectorAll('.leaf').forEach(v=>{const a=v.getBoundingClientRect();if(Math.hypot(a.left-x,a.top-y)<130){v.style.left='88%';v.style.top='78%';}})}}
for(let i=0;i<18;i++){let w=document.createElement('div');w.className='weed';w.textContent='🌼';w.style.left=(24+Math.random()*65)+'%';w.style.top=(48+Math.random()*38)+'%';game.appendChild(w)}for(let i=0;i<20;i++){let v=document.createElement('div');v.className='leaf';v.textContent='🍂';v.style.left=(22+Math.random()*68)+'%';v.style.top=(45+Math.random()*40)+'%';game.appendChild(v)}
function begin(e){if(!running)return;e.preventDefault();drag=true;hand.style.display='none';move(e);activeEl().setPointerCapture?.(e.pointerId)}function move(e){if(!drag)return;const r=game.getBoundingClientRect();setPos(e.clientX-r.left,e.clientY-r.top)}function end(){drag=false}
[machine,simple].forEach(el=>{el.addEventListener('pointerdown',begin,{passive:false});el.addEventListener('pointermove',move,{passive:false});el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end)});
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.remove('on'));b.classList.add('on');machine.style.display='block';simple.style.display='none';setCharacter();if(running)startSound();hand.style.display='block';say('Tap START. Then put your finger on the '+(tool==='weed'?'weed eater':tool)+' and drag it around the yard!')});
start.onclick=()=>{running=!running;start.classList.toggle('on',running);start.textContent=running?'STOP':'START';if(running)startSound();else stopSound();say(running?'It is running! Drag it around with your finger.':'Stopped!')};document.getElementById('sound').onclick=()=>{soundOn=!soundOn;document.getElementById('sound').textContent=soundOn?'🔊':'🔇'};setCharacter();setTimeout(()=>say('Jace, tap START. Then drag the mower around the real yard with your finger!'),600);
</script></body></html>
