<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Jace's Yard</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:Arial Rounded MT Bold,Arial,sans-serif;background:#18351e;color:#fff;overflow-x:hidden}.bar{display:flex;gap:8px;align-items:center;padding:9px;background:#17351f;position:sticky;top:0;z-index:5}.bar a,.bar button{border:0;border-radius:15px;padding:12px;font-weight:900;font-size:16px;background:#fff;color:#17351f;text-decoration:none}.bar .start{background:#54db68}.bar .stop{background:#ff5959}.meter{flex:1;background:#081b0d;border:4px solid #fff;border-radius:18px;height:31px;overflow:hidden}.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#55dc58,#ffe43c);transition:width .2s}.yard{position:relative;height:78vh;min-height:620px;overflow:hidden;touch-action:none;background:url('https://risewellhomes.com/_next/image?q=75&url=https%3A%2F%2F48078207.fs1.hubspotusercontent-na1.net%2Fhub%2F48078207%2Fhubfs%2FApproved%2520Division%2520Assets%2FDallas-Fort%2520Worth%2FLS%2520El%2520Dorado%2F06%2520-%2520Model%2520Photography%2FConcept%25202492%2FEl%2520Dorado-Model-Concept%25202492-Backyard3%2520W%2520Edits-Risewell%2520Homes.jpg&w=3840') center/cover no-repeat}.grass{position:absolute;left:0;right:0;top:37%;bottom:0;background:rgba(31,103,34,.22)}#cut{position:absolute;inset:0;pointer-events:none}.mower{position:absolute;width:112px;height:135px;left:45%;top:65%;transform:translate(-50%,-50%);filter:drop-shadow(0 8px 5px #0006);z-index:3}.boy{position:absolute;left:38px;top:-54px;width:45px;height:90px}.head{position:absolute;width:31px;height:31px;border-radius:50%;background:#c98255;left:7px}.cap{position:absolute;width:37px;height:14px;border-radius:14px 14px 3px 3px;background:#1765ba;top:-3px}.shirt{position:absolute;width:38px;height:38px;background:#f3eee1;top:28px;left:3px;border-radius:12px}.legs{position:absolute;width:34px;height:37px;background:#2670b7;top:62px;left:5px;border-radius:4px}.machine{position:absolute;left:4px;top:60px;width:75px;height:46px;background:#d92e25;border-radius:12px 18px 8px 8px;border:3px solid #711}.engine{position:absolute;width:35px;height:25px;background:#171717;left:20px;top:-12px;border-radius:8px}.wheel{position:absolute;width:22px;height:22px;border-radius:50%;background:#111;border:5px solid #555;bottom:-11px}.w1{left:-4px}.w2{right:-4px}.handle{position:absolute;width:7px;height:75px;background:#222;left:60px;top:-64px;transform:rotate(-25deg);transform-origin:bottom}.warning{position:absolute;border:4px solid #f5d33d;background:#0009;color:#fff;border-radius:18px;padding:8px 12px;font-weight:900;display:none;z-index:4}.msg{text-align:center;background:#fff;color:#17351f;padding:10px;font-size:18px}.tools{display:flex;gap:8px;justify-content:center;padding:9px;background:#17351f}.tools button{border:4px solid transparent;border-radius:16px;padding:11px;font-weight:900}.tools button.on{border-color:#ffe34e;background:#fff3a3}
</style></head><body><div class="bar"><a href="jace.html">HOME</a><button id="start" class="start">START MOWER</button><button id="stop" class="stop">STOP</button><div class="meter"><i id="meter"></i></div><b id="pct">0%</b></div><div class="msg" id="msg">Start the mower, then drag Jace around the grass with your finger.</div><div class="yard" id="yard"><canvas id="cut"></canvas><div class="grass"></div><div class="warning" id="warning">UH-OH! FLOWER BED!</div><div class="mower" id="mower"><div class="boy"><div class="head"></div><div class="cap"></div><div class="shirt"></div><div class="legs"></div></div><div class="machine"><div class="engine"></div><div class="wheel w1"></div><div class="wheel w2"></div><div class="handle"></div></div></div></div><div class="tools"><button class="on">MOWING GAME</button><button id="reset">NEW YARD</button></div><script>
const yard=document.getElementById('yard'),cv=document.getElementById('cut'),ctx=cv.getContext('2d'),mower=document.getElementById('mower'),meter=document.getElementById('meter'),pct=document.getElementById('pct'),warning=document.getElementById('warning'),msg=document.getElementById('msg');let running=false,drag=false,last=null,covered=0,audio=null,osc=null,gain=null;
function size(){let r=yard.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;cv.style.width=r.width+'px';cv.style.height=r.height+'px';ctx.setTransform(d,0,0,d,0,0);ctx.lineCap='round'}size();addEventListener('resize',size);
function sound(on){if(!on){if(osc){osc.stop();osc=null}return}audio=audio||new(window.AudioContext||window.webkitAudioContext)();osc=audio.createOscillator();gain=audio.createGain();osc.type='sawtooth';osc.frequency.value=74;gain.gain.value=.055;osc.connect(gain);gain.connect(audio.destination);osc.start()}
function point(e){let r=yard.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function mark(a,b){ctx.strokeStyle='rgba(50,125,42,.62)';ctx.lineWidth=88;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.strokeStyle='rgba(190,235,120,.20)';ctx.lineWidth=7;for(let k=-32;k<=32;k+=16){ctx.beginPath();ctx.moveTo(a.x+k,a.y);ctx.lineTo(b.x+k,b.y);ctx.stroke()}let dist=Math.hypot(b.x-a.x,b.y-a.y);covered=Math.min(100,covered+dist/170);meter.style.width=covered+'%';pct.textContent=Math.floor(covered)+'%'}
function wreck(p){let r=yard.getBoundingClientRect();let bad=p.y<r.height*.43||p.x<55||p.x>r.width-55;if(bad){warning.style.display='block';warning.style.left=Math.max(8,p.x-80)+'px';warning.style.top=Math.max(8,p.y-80)+'px';msg.textContent='Oops! Jace drove off the grass. Move back onto the lawn!';setTimeout(()=>warning.style.display='none',800);return true}return false}
yard.addEventListener('pointerdown',e=>{if(!running)return;drag=true;yard.setPointerCapture(e.pointerId);last=point(e)});
yard.addEventListener('pointermove',e=>{if(!drag||!running)return;e.preventDefault();let p=point(e),r=yard.getBoundingClientRect();p.x=Math.max(55,Math.min(r.width-55,p.x));p.y=Math.max(80,Math.min(r.height-65,p.y));mower.style.left=p.x+'px';mower.style.top=p.y+'px';let dx=p.x-last.x;mower.style.transform='translate(-50%,-50%) rotate('+Math.max(-12,Math.min(12,dx*.35))+'deg)';if(!wreck(p))mark(last,p);last=p},{passive:false});['pointerup','pointercancel'].forEach(n=>yard.addEventListener(n,()=>{drag=false;last=null}));
document.getElementById('start').onclick=()=>{if(!running){running=true;sound(true);msg.textContent='Mower running! Drag Jace anywhere on the grass. There is NO time limit.'}};
document.getElementById('stop').onclick=()=>{running=false;drag=false;sound(false);msg.textContent='Mower stopped. Press START whenever you want to keep mowing.'};
document.getElementById('reset').onclick=()=>{ctx.clearRect(0,0,cv.width,cv.height);covered=0;meter.style.width='0';pct.textContent='0%';msg.textContent='New yard! Start the mower when you are ready.'};
</script></body></html>
