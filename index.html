<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Jace & Halli</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Arial Rounded MT Bold,Arial,sans-serif;color:#17335c;min-height:100vh}
header{text-align:center;padding:24px 12px;font-size:clamp(31px,7vw,48px);font-weight:900;text-shadow:0 3px 0 #fff8}
.wrap{max-width:980px;margin:auto;padding:18px}

.subtitle{text-align:center;font-size:20px;font-weight:900;margin:0 0 20px}
@media(max-width:480px){.grid{gap:13px}.card{min-height:155px;font-size:18px;border-radius:27px}.card span{font-size:57px}}

body{background:linear-gradient(145deg,#8fe6ff,#fff2a1,#ffb3d0)}.worlds{display:grid;grid-template-columns:1fr 1fr;gap:25px;margin-top:30px}.world{min-height:390px;border-radius:45px;text-decoration:none;color:#17335c;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:36px;font-weight:900;border:6px solid white;box-shadow:0 14px 0 #0002,0 20px 35px #0002}.world span{font-size:120px;filter:drop-shadow(0 9px 5px #0003)}.world small{font-size:18px;margin-top:10px}.jw{background:linear-gradient(145deg,#4cc9ff,#8ee875,#ffdf4f)}.hw{background:linear-gradient(145deg,#ff82b4,#ff6674,#ffe46b)}@media(max-width:600px){.worlds{grid-template-columns:1fr}.world{min-height:280px}}
