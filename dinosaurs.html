<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>🦖 Dinosaur World</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial Rounded MT Bold,Arial,sans-serif;background:#fff7df;color:#25324a;touch-action:manipulation}header{padding:18px;text-align:center;background:linear-gradient(135deg,#73d7ff,#ffe274,#ff9fc9);border-bottom:6px solid #fff}h1{margin:0;font-size:clamp(28px,6vw,52px)}main{max-width:1000px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:14px}.card,.btn{display:block;text-decoration:none;color:inherit;text-align:center;border:0;border-radius:26px;padding:20px 12px;font-size:20px;font-weight:800;background:white;box-shadow:0 5px 0 #d5d5d5}.card{min-height:145px}.emo{display:block;font-size:58px;margin-bottom:8px}.btn{display:inline-block;min-height:auto;padding:13px 18px;background:#ffe36f}.back{margin-bottom:15px}.panel{background:white;border-radius:25px;padding:16px;margin:12px 0}.status{text-align:center;font-size:24px;font-weight:900;min-height:40px}button:active,.card:active{transform:translateY(3px)}</style></head><body><header><h1>🦖 Dinosaur World</h1></header><main><a class="btn back" href="jace.html">⬅️ Jace's Games</a><div class="panel" style="text-align:center"><div id="d" style="font-size:170px">🦖</div><button class="btn" id="find">Find a Dinosaur!</button><div class="status" id="s">T-Rex says ROAR!</div></div></main><script>const a=[['🦖','T-Rex says ROAR!'],['🦕','A giant long-neck!'],['🥚','You found a dinosaur egg!'],['🦴','You found a dinosaur bone!'],['🌋','Watch out for the volcano!']];find.onclick=()=>{let z=a[Math.floor(Math.random()*a.length)];d.textContent=z[0];s.textContent=z[1]};</script></body></html>
