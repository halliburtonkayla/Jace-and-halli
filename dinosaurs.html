<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Jace's Dinosaur Adventure</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:Arial Rounded MT Bold,Arial,sans-serif;background:linear-gradient(#70d97a,#eaf39b);color:#123c2c}header{text-align:center;padding:18px;background:linear-gradient(100deg,#1e9d54,#55cbed,#ffd84f);font-size:clamp(30px,7vw,46px);font-weight:900}.wrap{max-width:1000px;margin:auto;padding:14px}.back,button{border:0;border-radius:18px;font-weight:900}.back{display:inline-block;padding:12px 16px;background:#fff;color:#123c2c;text-decoration:none;box-shadow:0 5px #0002}.tabs,.controls{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin:12px 0}.tabs button,.controls button{padding:13px 16px;background:#fff;font-size:17px;box-shadow:0 5px #0002}.tabs button.on{background:#ffe36d}.page{display:none}.page.on{display:block}.card{background:#fff;border-radius:28px;padding:14px;box-shadow:0 8px #0002}.hud{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;font-size:18px;font-weight:900;padding:8px}canvas{display:block;width:100%;height:auto;border:6px solid #fff;border-radius:26px;background:#9ee6ff;touch-action:none}.big{min-width:120px;min-height:64px}.green{background:#8fe38f!important}.red{background:#ff9a9a!important}.blue{background:#90d5ff!important}.dgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.dinoBtn{min-height:112px;background:#f4ffe9;border:0;border-radius:20px;font-size:15px;font-weight:900}.dinoBtn strong{display:block;font-size:24px}.facts{font-size:18px;line-height:1.5;background:#efffe9;border-radius:18px;padding:12px;margin-top:10px}@media(max-width:600px){.dgrid{grid-template-columns:repeat(2,1fr)}.controls{display:grid;grid-template-columns:1fr 1fr}.controls button{width:100%}}</style></head><body>
<header>Jace's Dinosaur Adventure</header><div class="wrap"><a class="back" href="jace.html">Back to Jace's World</a><div class="tabs"><button class="on" data-tab="game">Dino Adventure</button><button data-tab="learn">Dino Lab</button></div>
<section id="game" class="page on"><div class="hud"><span>Eggs <b id="eggs">0</b></span><span>Food <b id="food">0</b></span><span>Score <b id="score">0</b></span><span id="message">Explore the valley!</span></div><canvas id="gameCanvas" width="900" height="560"></canvas><div class="controls"><button id="left" class="big">WALK LEFT</button><button id="right" class="big">WALK RIGHT</button><button id="run" class="big green">RUN</button><button id="jump" class="big blue">JUMP</button><button id="roar" class="big">ROAR</button><button id="reset" class="big red">NEW ADVENTURE</button></div></section>
<section id="learn" class="page"><div class="card"><h2>Jace's Dino Lab</h2><div class="dgrid" id="grid"></div><div class="facts" id="facts">Tap a dinosaur to learn about it.</div><button id="readFact" style="margin-top:10px;padding:12px 16px;background:#ffe36d">READ TO ME</button></div></section></div>
<script>
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab],.page').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.getElementById(b.dataset.tab).classList.add('on')});
function say(t,r=.9){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.rate=r;speechSynthesis.speak(u)}
const c=document.getElementById('gameCanvas'),g=c.getContext('2d');let p,things,rocks,keys,last,score,eggs,food,world,spawn;
function resetGame(){p={x:170,y:430,vy:0,dir:1,jump:false};things=[];rocks=[];keys={l:0,r:0,run:0};last=performance.now();score=eggs=food=world=spawn=0;hud();document.getElementById('message').textContent='Explore the valley!'}
function hud(){scoreEl.textContent=Math.floor(score);eggsEl.textContent=eggs;foodEl.textContent=food}
const scoreEl=document.getElementById('score'),eggsEl=document.getElementById('eggs'),foodEl=document.getElementById('food');
function spawnThing(){let r=Math.random();if(r<.4)things.push({type:'egg',x:940,y:430});else if(r<.78)things.push({type:'food',x:940,y:435});else rocks.push({x:940,y:445})}
function hit(a,b,rad=45){return Math.abs(a.x-b.x)<rad&&Math.abs(a.y-b.y)<55}
function drawDino(){g.save();g.translate(p.x,p.y);g.scale(p.dir,1);g.fillStyle='#2d9f55';g.beginPath();g.ellipse(0,0,62,38,0,0,7);g.fill();g.beginPath();g.moveTo(-48,-5);g.lineTo(-105,-30);g.lineTo(-62,18);g.fill();g.beginPath();g.arc(48,-35,34,0,7);g.fill();g.fillStyle='#fff';g.beginPath();g.arc(58,-42,7,0,7);g.fill();g.fillStyle='#111';g.beginPath();g.arc(60,-42,3,0,7);g.fill();g.strokeStyle='#246f41';g.lineWidth=13;g.beginPath();g.moveTo(-20,25);g.lineTo(-32,63);g.moveTo(25,25);g.lineTo(30,63);g.stroke();g.restore()}
function draw(){g.clearRect(0,0,900,560);g.fillStyle='#8ddcff';g.fillRect(0,0,900,310);g.fillStyle='#5eaf4f';g.fillRect(0,310,900,250);for(let i=0;i<7;i++){let x=(i*170-(world*.35)%170);g.fillStyle='#3e8d41';g.beginPath();g.arc(x,300,70,Math.PI,0);g.fill()}g.fillStyle='#7a5633';g.fillRect(0,500,900,60);things.forEach(t=>{g.font='48px Arial';g.fillText(t.type==='egg'?'🥚':'🥩',t.x,t.y)});rocks.forEach(r=>{g.fillStyle='#666';g.beginPath();g.arc(r.x,r.y,35,Math.PI,0);g.fill()});drawDino()}
function loop(now){let dt=Math.min(32,now-last)/16.67;last=now;let speed=(keys.run?7:4);if(keys.l){p.x-=speed*dt;p.dir=-1}if(keys.r){p.x+=speed*dt;p.dir=1}p.x=Math.max(80,Math.min(820,p.x));if(p.jump){p.vy+=.75*dt;p.y+=p.vy*dt;if(p.y>=430){p.y=430;p.vy=0;p.jump=false}}world+=(keys.l||keys.r)?speed*dt:1.1*dt;spawn+=(keys.l||keys.r)?speed*dt:1.1*dt;if(spawn>110){spawnThing();spawn=0}things.forEach(t=>t.x-=2.8*dt*(keys.run?1.6:1));rocks.forEach(r=>r.x-=2.8*dt*(keys.run?1.6:1));things=things.filter(t=>{if(hit(p,t)){if(t.type==='egg'){eggs++;score+=25;document.getElementById('message').textContent='You found a dinosaur egg!'}else{food++;score+=15;document.getElementById('message').textContent='Chomp! Dinosaur snack!'}hud();return false}return t.x>-60});rocks=rocks.filter(r=>{if(hit(p,r,48)&&p.y>390){score=Math.max(0,score-10);document.getElementById('message').textContent='Watch out for rocks! Jump!';hud();return false}return r.x>-60});score+=.02*dt;hud();draw();requestAnimationFrame(loop)}
function bind(id,key){let b=document.getElementById(id);['pointerdown','touchstart'].forEach(n=>b.addEventListener(n,e=>{e.preventDefault();keys[key]=1},{passive:false}));['pointerup','pointerleave','pointercancel','touchend'].forEach(n=>b.addEventListener(n,e=>{e.preventDefault();keys[key]=0},{passive:false}))}
bind('left','l');bind('right','r');bind('run','run');document.getElementById('jump').onclick=()=>{if(!p.jump){p.jump=true;p.vy=-13}};document.getElementById('roar').onclick=()=>{say('ROAR! Great dinosaur, Jace!',.8);document.getElementById('message').textContent='ROAR!'};document.getElementById('reset').onclick=resetGame;
const dinos=[['T. rex','meat','A huge predator with a powerful bite.'],['Triceratops','plants','It had three horns and a giant frill.'],['Stegosaurus','plants','It had tall plates and a spiked tail.'],['Velociraptor','meat','Real Velociraptors were smaller and feathered.'],['Brachiosaurus','plants','Its long neck helped it reach high leaves.'],['Spinosaurus','fish and meat','It had a sail on its back and lived near water.'],['Ankylosaurus','plants','It had armor and a heavy tail club.'],['Parasaurolophus','plants','Its hollow crest may have helped make sounds.'],['Allosaurus','meat','It lived millions of years before T. rex.']];
let selected=dinos[0];const grid=document.getElementById('grid'),facts=document.getElementById('facts');function show(d){selected=d;facts.innerHTML='<b>'+d[0]+'</b><br>Eats: '+d[1]+'<br>'+d[2]}
dinos.forEach(d=>{let b=document.createElement('button');b.className='dinoBtn';b.innerHTML='<strong>'+d[0]+'</strong>'+d[1];b.onclick=()=>show(d);grid.appendChild(b)});show(selected);document.getElementById('readFact').onclick=()=>say(selected[0]+'. It ate '+selected[1]+'. '+selected[2]);resetGame();requestAnimationFrame(loop);
</script></body></html>
