<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Jace's Dinosaur World</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:Arial Rounded MT Bold,Arial,sans-serif;background:linear-gradient(#7edc72,#e8f59a);color:#123c2c}header{text-align:center;padding:22px 10px;background:linear-gradient(100deg,#1e9d54,#55cbed,#ffd84f);font-size:clamp(30px,7vw,48px);font-weight:900}.wrap{max-width:1000px;margin:auto;padding:15px}.back,.tab,button{border:0;border-radius:20px;font-weight:900}.back{display:inline-block;padding:12px 16px;background:#fff;text-decoration:none;color:#123c2c}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.tab{padding:14px 6px;font-size:17px;background:#fff;box-shadow:0 5px 0 #0002}.page{display:none}.page.on{display:block}.card{background:#fff;border:5px solid #fff;border-radius:30px;padding:18px;box-shadow:0 9px 0 #0002;text-align:center}.dgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.dino{min-height:130px;background:#fff;border:0;border-radius:24px;font-size:15px;font-weight:900;box-shadow:0 6px 0 #0002}.dino span{display:block;font-size:55px}.hero{font-size:125px;filter:drop-shadow(0 8px 3px #0003)}h2{font-size:30px}.facts{text-align:left;font-size:18px;line-height:1.55;background:#f0ffe8;border-radius:20px;padding:14px}.big{padding:15px 18px;font-size:20px;background:#ffd84f;margin:6px}.talker{font-size:160px}.bubble{background:#fff;border-radius:30px;padding:18px;font-size:22px;line-height:1.45;min-height:130px}.choices{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}.choices button{padding:14px;background:#ffd84f;font-size:17px}.hunt{position:relative;height:430px;overflow:hidden;border-radius:28px;background:linear-gradient(#70d7ff 0 45%,#67c958 45% 76%,#7b4e2f 76%);touch-action:none}.cloud{position:absolute;font-size:45px;animation:cloud 9s linear infinite}@keyframes cloud{from{left:-70px}to{left:105%}}#player{position:absolute;left:25px;bottom:52px;font-size:82px;transform:scaleX(-1);transition:bottom .18s}#prey{position:absolute;right:15px;bottom:58px;font-size:45px}#rock{position:absolute;right:43%;bottom:55px;font-size:45px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.controls button{padding:18px;font-size:22px;background:#ffd84f}.score{font-size:21px;font-weight:900;text-align:center;padding:8px}
@media(max-width:600px){.dgrid{grid-template-columns:repeat(2,1fr)}.tabs{grid-template-columns:1fr}.hero{font-size:100px}.talker{font-size:125px}}
</style></head><body><header>🦖 Jace's Dinosaur World 🌴</header><div class="wrap"><a class="back" href="jace.html">⬅️ Jace's World</a><div class="tabs"><button class="tab" data-p="meet">🦕 Meet Dinosaurs</button><button class="tab" data-p="talk">🗣️ Talk to Dino</button><button class="tab" data-p="hunt">🎮 Dino Hunt</button></div>
<section id="meet" class="page on"><div class="dgrid" id="grid"></div><div class="card" id="detail" style="margin-top:14px"><div class="hero" id="icon">🦖</div><h2 id="name">Pick a dinosaur!</h2><div class="facts" id="facts">Tap any dinosaur above to learn about it.</div><button class="big" id="read">🔊 READ TO ME</button><button class="big" id="roar">🦖 FUN ROAR</button></div></section>
<section id="talk" class="page"><div class="card"><div class="talker">🦖</div><div class="bubble" id="bubble">Hi Jace! I'm Dino! What should we do?</div><div class="choices"><button data-talk="story">📖 Dinosaur Story</button><button data-talk="fact">🦕 Tell Me a Fact</button><button data-talk="silly">😂 Silly Dino Story</button><button data-talk="bed">🌙 Bedtime Story</button><button id="mic">🎤 Talk to Dino</button></div></div></section>
<section id="hunt" class="page"><div class="score">⭐ Stars: <span id="score">0</span> &nbsp; 🦕 Chomps: <span id="chomps">0</span></div><div class="hunt" id="game"><div class="cloud">☁️</div><div id="rock">🪨</div><div id="prey">🦎</div><div id="player">🦖</div></div><div class="controls"><button id="jump">⬆️ JUMP</button><button id="chomp">😋 CHOMP!</button></div></section></div>
<script>
const dinos=[{"name": "T. rex", "icon": "\ud83e\udd96", "diet": "Meat", "size": "about 40 feet long", "when": "Late Cretaceous, 68\u201366 million years ago", "where": "western North America", "fact": "Its name means \u201ctyrant lizard king,\u201d and it had a powerful bone-crushing bite."}, {"name": "Triceratops", "icon": "\ud83e\udd95", "diet": "Plants", "size": "about 30 feet long", "when": "Late Cretaceous, 68\u201366 million years ago", "where": "North America", "fact": "Its name means \u201cthree-horned face.\u201d It had a huge frill and three horns."}, {"name": "Stegosaurus", "icon": "\ud83e\udd95", "diet": "Plants", "size": "about 30 feet long", "when": "Late Jurassic, about 152\u2013145 million years ago", "where": "North America", "fact": "It had tall plates on its back and four dangerous spikes on its tail."}, {"name": "Brachiosaurus", "icon": "\ud83e\udd95", "diet": "Plants", "size": "about 70\u201385 feet long", "when": "Late Jurassic, about 154\u2013150 million years ago", "where": "North America", "fact": "Its front legs were longer than its back legs, helping give it a high shoulder."}, {"name": "Velociraptor", "icon": "\ud83e\udd96", "diet": "Meat", "size": "about 6\u20137 feet long", "when": "Late Cretaceous, about 75\u201371 million years ago", "where": "Asia", "fact": "Real Velociraptors were much smaller than movie versions and had feathers."}, {"name": "Spinosaurus", "icon": "\ud83e\udd96", "diet": "Meat and fish", "size": "about 45\u201350 feet long", "when": "Cretaceous, about 100\u201394 million years ago", "where": "North Africa", "fact": "It had a huge sail on its back and adaptations for spending time around water."}, {"name": "Ankylosaurus", "icon": "\ud83e\udd95", "diet": "Plants", "size": "about 20\u201326 feet long", "when": "Late Cretaceous, about 68\u201366 million years ago", "where": "North America", "fact": "It was covered in bony armor and carried a heavy club on its tail."}, {"name": "Parasaurolophus", "icon": "\ud83e\udd95", "diet": "Plants", "size": "about 30 feet long", "when": "Late Cretaceous, about 76\u201373 million years ago", "where": "North America", "fact": "Its long hollow head crest may have helped it make sounds."}, {"name": "Allosaurus", "icon": "\ud83e\udd96", "diet": "Meat", "size": "about 28\u201332 feet long", "when": "Late Jurassic, about 155\u2013145 million years ago", "where": "North America and Europe", "fact": "It was a large predator that lived millions of years before T. rex."}, {"name": "Diplodocus", "icon": "\ud83e\udd95", "diet": "Plants", "size": "about 80\u201390 feet long", "when": "Late Jurassic, about 154\u2013152 million years ago", "where": "North America", "fact": "It had an extremely long neck and whip-like tail."}, {"name": "Iguanodon", "icon": "\ud83e\udd95", "diet": "Plants", "size": "about 30 feet long", "when": "Early Cretaceous", "where": "Europe", "fact": "It had a large thumb spike that may have helped with defense."}, {"name": "Carnotaurus", "icon": "\ud83e\udd96", "diet": "Meat", "size": "about 25 feet long", "when": "Late Cretaceous", "where": "South America", "fact": "It had two horn-like bumps above its eyes and very tiny arms."}, {"name": "Pachycephalosaurus", "icon": "\ud83e\udd95", "diet": "Plants and possibly other foods", "size": "about 15 feet long", "when": "Late Cretaceous", "where": "North America", "fact": "Its skull had a very thick rounded dome."}, {"name": "Apatosaurus", "icon": "\ud83e\udd95", "diet": "Plants", "size": "about 70\u201375 feet long", "when": "Late Jurassic", "where": "North America", "fact": "This giant long-necked dinosaur had a massive tail and walked on four legs."}, {"name": "Gallimimus", "icon": "\ud83e\udd96", "diet": "Mixed diet", "size": "about 20 feet long", "when": "Late Cretaceous", "where": "Asia", "fact": "Its name means \u201cchicken mimic,\u201d and it had long legs built for running."}, {"name": "Deinonychus", "icon": "\ud83e\udd96", "diet": "Meat", "size": "about 10\u201311 feet long", "when": "Early Cretaceous", "where": "North America", "fact": "It had a large curved claw on each foot and helped change scientists\u2019 ideas about active dinosaurs."}, {"name": "Compsognathus", "icon": "\ud83e\udd96", "diet": "Small animals", "size": "about 3 feet long", "when": "Late Jurassic", "where": "Europe", "fact": "It was a small, lightweight predator about the size of a turkey."}, {"name": "Giganotosaurus", "icon": "\ud83e\udd96", "diet": "Meat", "size": "about 40 feet long", "when": "Late Cretaceous, about 99\u201395 million years ago", "where": "South America", "fact": "It was one of the largest meat-eating dinosaurs known."}, {"name": "Albertosaurus", "icon": "\ud83e\udd96", "diet": "Meat", "size": "about 30 feet long", "when": "Late Cretaceous", "where": "North America", "fact": "It was a close relative of T. rex but more lightly built."}, {"name": "Ceratosaurus", "icon": "\ud83e\udd96", "diet": "Meat", "size": "about 20 feet long", "when": "Late Jurassic", "where": "North America, Europe, and Africa", "fact": "It had a distinctive horn on its snout."}, {"name": "Dilophosaurus", "icon": "\ud83e\udd96", "diet": "Meat", "size": "about 20 feet long", "when": "Early Jurassic", "where": "North America", "fact": "It had two thin crests on its head; there is no fossil evidence it spat venom."}, {"name": "Argentinosaurus", "icon": "\ud83e\udd95", "diet": "Plants", "size": "possibly 100 feet or more", "when": "Late Cretaceous", "where": "South America", "fact": "It was among the largest land animals known from fossils."}, {"name": "Oviraptor", "icon": "\ud83e\udd96", "diet": "Mixed diet", "size": "about 5\u20136 feet long", "when": "Late Cretaceous", "where": "Asia", "fact": "Its name means \u201cegg thief,\u201d but fossils later showed relatives sitting on nests like birds."}, {"name": "Therizinosaurus", "icon": "\ud83e\udd95", "diet": "Mostly plants", "size": "about 30 feet long", "when": "Late Cretaceous", "where": "Asia", "fact": "It had enormous hand claws, some of the longest known for any land animal."}, {"name": "Maiasaura", "icon": "\ud83e\udd95", "diet": "Plants", "size": "about 30 feet long", "when": "Late Cretaceous", "where": "North America", "fact": "Its name means \u201cgood mother lizard\u201d because fossils were found with nests and young."}];
let selected=dinos[0];const grid=document.querySelector('#grid'),facts=document.querySelector('#facts');
function say(t,rate=.9){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.rate=rate;speechSynthesis.speak(u)}
function show(d){selected=d;document.querySelector('#icon').textContent=d.icon;document.querySelector('#name').textContent=d.name;facts.innerHTML='<b>🍽️ Eats:</b> '+d.diet+'<br><b>📏 Size:</b> '+d.size+'<br><b>⏰ When:</b> '+d.when+'<br><b>🌎 Where:</b> '+d.where+'<br><b>⭐ Fun fact:</b> '+d.fact}
dinos.forEach(d=>{let b=document.createElement('button');b.className='dino';b.innerHTML='<span>'+d.icon+'</span>'+d.name;b.onclick=()=>{show(d);document.querySelector('#detail').scrollIntoView({behavior:'smooth',block:'start'})};grid.appendChild(b)});show(selected);
document.querySelector('#read').onclick=()=>say(selected.name+'. '+selected.name+' ate '+selected.diet+'. It was '+selected.size+'. It lived during the '+selected.when+', in '+selected.where+'. Fun fact! '+selected.fact);
document.querySelector('#roar').onclick=()=>{say('Rrrrrr... ROAR! That is just a fun pretend dinosaur roar!',.75)};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));document.querySelector('#'+b.dataset.p).classList.add('on')});
const bubble=document.querySelector('#bubble');
const talks={story:"Once upon a time, a little dinosaur named Stompy found a shiny egg beside a giant fern. Instead of stomping it, Stompy carefully rolled it home. Soon, crack crack crack! A tiny baby dinosaur popped out. Stompy had made a new friend, and together they explored the green valley.",fact:"Did you know? Birds are living dinosaurs! They are the surviving branch of the dinosaur family tree.",silly:"A T. rex tried to make pancakes, but his tiny arms could not reach the syrup! So a Triceratops nudged it over with his horn. They ate a giant stack together and called it a dino breakfast.",bed:"The jungle grew quiet as the stars came out. A little dinosaur curled beside Mama under a giant fern. The breeze whispered through the leaves. Safe and warm, the little dinosaur closed his eyes and dreamed of tomorrow's adventures. Good night, Jace."};
document.querySelectorAll('[data-talk]').forEach(b=>b.onclick=()=>{bubble.textContent=talks[b.dataset.talk];say(bubble.textContent,.82)});
document.querySelector('#mic').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){bubble.textContent="Talking with the microphone isn't supported here yet. Tap one of my story buttons!";say(bubble.textContent);return}let r=new SR();r.lang='en-US';r.interimResults=false;bubble.textContent='🎤 I’m listening, Jace...';r.onresult=e=>{let t=e.results[0][0].transcript.toLowerCase();let reply=t.includes('bed')?talks.bed:t.includes('silly')?talks.silly:t.includes('fact')||t.includes('about')?talks.fact:talks.story;bubble.textContent=reply;say(reply,.85)};r.onerror=()=>{bubble.textContent="I couldn't hear that. Try again or tap a story button."};r.start()};
let jumping=false,score=0,chomps=0,prey=document.querySelector('#prey'),player=document.querySelector('#player');
function jump(){if(jumping)return;jumping=true;player.style.bottom='185px';setTimeout(()=>player.style.bottom='52px',420);setTimeout(()=>jumping=false,760)}
document.querySelector('#jump').onclick=jump;
document.querySelector('#chomp').onclick=()=>{chomps++;score++;document.querySelector('#chomps').textContent=chomps;document.querySelector('#score').textContent=score;prey.textContent=['🦎','🐣','🥩','🥚'][Math.floor(Math.random()*4)];prey.style.right=(10+Math.random()*55)+'%';say('Chomp! Great job, Jace!',1.05)};
</script></body></html>
