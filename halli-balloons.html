<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>BALLOON POP</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:none;font-family:Arial Rounded MT Bold,Arial,sans-serif;background:linear-gradient(#7fdcff,#fff1b0)}button{font:inherit}.home{position:fixed;z-index:50;left:12px;top:12px;width:62px;height:62px;border-radius:50%;border:4px solid white;background:#ff72aa;color:white;font-size:28px;box-shadow:0 5px 12px #0004}.stage{position:absolute;inset:0;overflow:hidden}.big{position:absolute;border:0;background:transparent;touch-action:none}.pop{animation:pop .3s forwards}@keyframes pop{50%{transform:scale(1.5)}100%{transform:scale(0);opacity:0}}@keyframes bob{50%{transform:translateY(-18px)}}@keyframes wig{50%{transform:rotate(7deg) scale(1.05)}}.label{position:fixed;top:16px;left:85px;right:15px;text-align:center;color:#fff;text-shadow:0 3px 7px #0008;font-size:clamp(20px,5vw,34px);pointer-events:none}</style></head><body><button class="home" onclick="location.href='halli.html'">⌂</button><div class="label">BALLOON POP</div><div class="stage" id="stage"></div><script>const s=stage,AC=window.AudioContext||window.webkitAudioContext;function tone(f=300,d=.08){let a=new AC,o=a.createOscillator(),g=a.createGain();o.frequency.value=f;g.gain.value=.08;o.connect(g).connect(a.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.stop(a.currentTime+d)}function add(){let b=document.createElement('button'),z=70+Math.random()*90;b.className='big';b.style.cssText='width:'+z+'px;height:'+z+'px;border-radius:52% 52% 48% 48%;left:'+Math.random()*(innerWidth-z)+'px;top:'+(innerHeight+z)+'px;background:linear-gradient(135deg,hsl('+Math.random()*360+',85%,70%),hsl('+Math.random()*360+',80%,50%));border:3px solid #fff9;box-shadow:inset 0 0 18px #fff,0 0 14px #fff8;transition:top '+(6+Math.random()*6)+'s linear';b.onpointerdown=e=>{e.preventDefault();tone(180+Math.random()*100);b.classList.add('pop');for(let i=0;i<5;i++){let q=document.createElement('i');q.style.cssText='position:absolute;width:9px;height:9px;border-radius:50%;background:white;left:'+e.clientX+'px;top:'+e.clientY+'px;transition:.5s';s.append(q);setTimeout(()=>{q.style.transform='translate('+(Math.random()*100-50)+'px,'+(Math.random()*100-50)+'px) scale(0)'},10);setTimeout(()=>q.remove(),550)}setTimeout(()=>b.remove(),300);add();add()};s.append(b);requestAnimationFrame(()=>b.style.top='-180px');setTimeout(()=>{if(b.isConnected){b.remove();add()}},12000)}for(let i=0;i<12;i++)setTimeout(add,i*250);</script></body></html>
