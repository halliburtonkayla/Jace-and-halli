<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Jace's Block Building Table</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:Arial Rounded MT Bold,Arial,sans-serif;background:linear-gradient(#d9f0ff,#fff2a6);color:#17335c}header{text-align:center;padding:16px;font-size:clamp(30px,7vw,44px);font-weight:900;background:linear-gradient(100deg,#65d9ef,#ffe36d,#ff9db4)}.wrap{max-width:1000px;margin:auto;padding:12px}.bar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}a,button{border:0;border-radius:18px;padding:12px 15px;font-size:17px;font-weight:900;background:#ffe36d;color:#17335c;text-decoration:none;box-shadow:0 5px #0002}.teacher{background:#fff;border-radius:22px;padding:12px;text-align:center;font-weight:900;font-size:19px}.layout{display:grid;grid-template-columns:160px 1fr;gap:12px;margin-top:12px}.tray{background:#fff;border-radius:24px;padding:10px;display:flex;flex-direction:column;gap:9px}.tray button{background:#eef7ff;min-height:72px}.table{position:relative;min-height:620px;border:7px solid #fff;border-radius:28px;background:linear-gradient(#dff3ff 0 18%,#c99a63 18% 92%,#7e5737 92%);overflow:hidden;touch-action:none}.challenge{position:absolute;top:10px;right:10px;background:#fff;border-radius:18px;padding:10px;max-width:240px;font-size:14px;font-weight:900;z-index:200}.piece{position:absolute;touch-action:none;user-select:none;box-shadow:0 8px 0 #0003;border:4px solid #ffffffaa}.piece.selected{outline:5px dashed #17335c;outline-offset:4px}.cube{width:82px;height:82px;border-radius:14px}.brick{width:150px;height:68px;border-radius:12px}.smallbrick{width:110px;height:60px;border-radius:12px}.plank{width:188px;height:42px;border-radius:9px}.cylinder{width:76px;height:100px;border-radius:38px}.arch{width:145px;height:105px;border-radius:70px 70px 12px 12px;clip-path:polygon(0 0,100% 0,100% 100%,72% 100%,72% 54%,28% 54%,28% 100%,0 100%)}.triangle{width:120px;height:100px;clip-path:polygon(50% 0,100% 100%,0 100%);box-shadow:none}.tools{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}.tools button{background:#fff}@media(max-width:700px){.layout{grid-template-columns:1fr}.tray{flex-direction:row;overflow-x:auto;justify-content:flex-start}.tray button{min-width:110px}.table{min-height:540px}}</style></head><body>
<header>Jace's Block Building Table</header><div class="wrap"><div class="bar"><a href="jace.html">Back to Jace's World</a></div><div class="teacher" id="teacher">Pick a block shape on the left. It will pop onto the building table for you.</div><div class="layout"><aside class="tray"><button data-shape="cube">Cube</button><button data-shape="brick">Long Brick</button><button data-shape="smallbrick">Short Brick</button><button data-shape="triangle">Roof</button><button data-shape="arch">Arch</button><button data-shape="cylinder">Cylinder</button><button data-shape="plank">Flat Plank</button></aside><section class="table" id="table"><div class="challenge" id="challenge">Build Challenge: Make a house. Try 2 cubes, 1 long brick, and a roof.</div></section></div><div class="tools"><button id="rotate">Rotate</button><button id="copy">Duplicate</button><button id="delete">Delete</button><button id="newChallenge">New Challenge</button><button id="clean">Clear Table</button></div></div>
<script>
const table=document.getElementById('table'),colors=['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#9b5de5','#ff8fab','#f9844a','#43bccd'];let selected=null,z=1,drag=null,ox=0,oy=0;
const challenges=['Build a house. Try 2 cubes, 1 long brick, and a roof.','Build a tall tower with 5 pieces.','Build a bridge with 2 cubes and a long brick.','Build a dinosaur pen using long bricks and an arch.','Make anything you want using at least 6 blocks.'];let ci=0;
function make(shape,x,y){let b=document.createElement('div');b.className='piece '+shape;b.dataset.shape=shape;b.dataset.rot='0';b.style.background=colors[Math.floor(Math.random()*colors.length)];b.style.left=(x??210)+'px';b.style.top=(y??240)+'px';b.style.zIndex=++z;b.addEventListener('pointerdown',start);b.addEventListener('click',()=>select(b));table.appendChild(b);select(b);return b}
function select(b){document.querySelectorAll('.piece').forEach(x=>x.classList.remove('selected'));selected=b;if(b)b.classList.add('selected')}
function start(e){drag=e.currentTarget;select(drag);drag.setPointerCapture(e.pointerId);let br=drag.getBoundingClientRect();ox=e.clientX-br.left;oy=e.clientY-br.top;drag.style.zIndex=++z;drag.addEventListener('pointermove',move);drag.addEventListener('pointerup',end,{once:true})}
function move(e){if(!drag)return;let r=table.getBoundingClientRect(),x=Math.max(0,Math.min(r.width-drag.offsetWidth,e.clientX-r.left-ox)),y=Math.max(90,Math.min(r.height-drag.offsetHeight-35,e.clientY-r.top-oy));drag.style.left=x+'px';drag.style.top=y+'px'}
function end(){if(!drag)return;drag.removeEventListener('pointermove',move);drag=null}
document.querySelectorAll('[data-shape]').forEach(b=>b.onclick=()=>{let r=table.getBoundingClientRect();make(b.dataset.shape,Math.max(20,r.width*.42),Math.max(130,r.height*.45));document.getElementById('teacher').textContent='Great choice. Drag it where you want it.'});
document.getElementById('rotate').onclick=()=>{if(!selected)return;let r=(+selected.dataset.rot+90)%360;selected.dataset.rot=r;selected.style.transform='rotate('+r+'deg)'};
document.getElementById('copy').onclick=()=>{if(!selected)return;let b=make(selected.dataset.shape,parseFloat(selected.style.left)+24,parseFloat(selected.style.top)+24);b.style.background=selected.style.background};
document.getElementById('delete').onclick=()=>{if(selected){selected.remove();selected=null}};
document.getElementById('clean').onclick=()=>{[...table.querySelectorAll('.piece')].forEach(x=>x.remove());selected=null};
document.getElementById('newChallenge').onclick=()=>{ci=(ci+1)%challenges.length;document.getElementById('challenge').textContent='Build Challenge: '+challenges[ci];document.getElementById('teacher').textContent='New challenge! '+challenges[ci]};
</script></body></html>
