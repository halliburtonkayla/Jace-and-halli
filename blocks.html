<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Jace's Block Builder</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:Arial Rounded MT Bold,Arial,sans-serif;background:#fff8df;color:#17335c;text-align:center}header{padding:16px;font-size:30px;font-weight:900;background:linear-gradient(100deg,#65d9ef,#ffe36d,#ff9db4)}a,button{border:0;border-radius:18px;background:#ffe36d;color:#17335c;padding:12px 15px;font-size:17px;font-weight:900;box-shadow:0 5px #bbb;text-decoration:none}.bar,.tray,.edit{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;padding:10px}.tray button{background:#fff;min-width:110px}.yard{position:relative;height:620px;max-width:900px;margin:8px auto;background:linear-gradient(#bde9ff 0 66%,#d9c28e 66%);border:6px solid white;border-radius:28px;overflow:hidden;touch-action:none}.piece{position:absolute;touch-action:none;user-select:none;box-shadow:0 7px 0 #0003;border:4px solid #ffffffaa;display:grid;place-items:center;font-weight:900;color:#17335c}.piece.selected{outline:5px dashed #17335c;outline-offset:4px}.cube{width:86px;height:86px;border-radius:14px}.brick{width:150px;height:70px;border-radius:12px}.smallbrick{width:110px;height:62px;border-radius:12px}.plank{width:190px;height:42px;border-radius:9px}.cylinder{width:76px;height:100px;border-radius:38px}.arch{width:145px;height:105px;border-radius:70px 70px 12px 12px;clip-path:polygon(0 0,100% 0,100% 100%,72% 100%,72% 54%,28% 54%,28% 100%,0 100%)}.triangle{width:120px;height:100px;clip-path:polygon(50% 0,100% 100%,0 100%);box-shadow:none}.tip{font-weight:800;padding:8px}.edit button{background:#fff}</style></head><body>
<header>Jace's Real Block Builder</header><div class="bar"><a href="jace.html">Back to Jace's Games</a><button id="clean">Clean Up</button><button id="knock">Knock It Down!</button></div><div class="tip">Pick a block shape, then drag it anywhere. Tap a block to select it and use the tools below.</div><div class="tray"><button data-shape="cube">Cube</button><button data-shape="brick">Long Brick</button><button data-shape="smallbrick">Short Brick</button><button data-shape="triangle">Roof</button><button data-shape="arch">Arch</button><button data-shape="cylinder">Cylinder</button><button data-shape="plank">Flat Plank</button></div><div class="edit"><button id="rotate">Rotate</button><button id="copy">Duplicate</button><button id="delete">Delete</button><button id="front">Bring Front</button></div><div class="yard" id="yard"></div>
<script>
const yard=document.getElementById('yard'),colors=['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#9b5de5','#ff8fab','#f9844a','#43bccd'];let selected=null,z=1,drag=null,ox=0,oy=0,moved=false;
function make(shape,x,y){let b=document.createElement('div');b.className='piece '+shape;b.dataset.shape=shape;b.dataset.rot='0';b.style.background=colors[Math.floor(Math.random()*colors.length)];b.style.left=(x??20+Math.random()*500)+'px';b.style.top=(y??60+Math.random()*300)+'px';b.style.zIndex=++z;b.addEventListener('pointerdown',start);b.addEventListener('click',()=>select(b));yard.appendChild(b);select(b);return b}
function select(b){document.querySelectorAll('.piece').forEach(x=>x.classList.remove('selected'));selected=b;if(b)b.classList.add('selected')}
function start(e){drag=e.currentTarget;select(drag);drag.setPointerCapture(e.pointerId);let br=drag.getBoundingClientRect();ox=e.clientX-br.left;oy=e.clientY-br.top;moved=false;drag.style.zIndex=++z;drag.addEventListener('pointermove',move);drag.addEventListener('pointerup',end,{once:true})}
function move(e){if(!drag)return;moved=true;let r=yard.getBoundingClientRect(),x=Math.max(0,Math.min(r.width-drag.offsetWidth,e.clientX-r.left-ox)),y=Math.max(0,Math.min(r.height-drag.offsetHeight,e.clientY-r.top-oy));drag.style.left=x+'px';drag.style.top=y+'px'}
function end(){if(!drag)return;drag.removeEventListener('pointermove',move);drag=null}
document.querySelectorAll('[data-shape]').forEach(b=>b.onclick=()=>make(b.dataset.shape,30+Math.random()*Math.max(20,yard.clientWidth-220),70));
document.getElementById('rotate').onclick=()=>{if(!selected)return;let r=(+selected.dataset.rot+90)%360;selected.dataset.rot=r;selected.style.transform='rotate('+r+'deg)'};
document.getElementById('copy').onclick=()=>{if(!selected)return;let b=make(selected.dataset.shape,parseFloat(selected.style.left)+24,parseFloat(selected.style.top)+24);b.style.background=selected.style.background};
document.getElementById('delete').onclick=()=>{if(!selected)return;selected.remove();selected=null};
document.getElementById('front').onclick=()=>{if(selected)selected.style.zIndex=++z};
document.getElementById('clean').onclick=()=>{yard.innerHTML='';selected=null;starter()};
document.getElementById('knock').onclick=()=>{[...yard.children].forEach((b,i)=>{b.style.transition='transform .55s,left .55s,top .55s';b.style.transform='rotate('+(Math.random()*220-110)+'deg)';b.style.left=Math.random()*Math.max(1,yard.clientWidth-160)+'px';b.style.top=(yard.clientHeight-120-Math.random()*80)+'px';setTimeout(()=>b.style.transition='',650)})};
function starter(){['cube','brick','cube','triangle','plank','cylinder','arch'].forEach((s,i)=>make(s,45+i*95,430-Math.random()*60));select(null)}starter();
</script></body></html>
