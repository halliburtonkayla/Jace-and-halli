<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Jace's Block Table</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:Arial Rounded MT Bold,Arial,sans-serif;background:#dceff6;color:#20354b}header{text-align:center;padding:17px;font-size:38px;font-weight:900;background:#77c9dd}.wrap{max-width:1000px;margin:auto;padding:12px}a,button{border:0;border-radius:16px;padding:11px 14px;font-weight:900;font-size:16px;background:#fff;color:#20354b;text-decoration:none;box-shadow:0 4px #0002}.teacher{background:#fff;padding:12px;border-radius:20px;text-align:center;margin:10px 0;font-size:19px;font-weight:900}.game{display:grid;grid-template-columns:175px 1fr;gap:12px}.shelf{background:linear-gradient(90deg,#a86f3f,#d5a16a);padding:12px;border:8px solid #704727;border-radius:20px;display:flex;flex-direction:column;gap:12px}.shelf button{min-height:75px;background:#f3e4c9}.table{position:relative;min-height:620px;border-radius:26px;background:linear-gradient(#e9f6fb 0 15%,#bd8756 15% 92%,#704728 92%);border:10px solid #8b5c35;overflow:hidden;touch-action:none;box-shadow:inset 0 0 25px #0003}.challenge{position:absolute;right:10px;top:10px;background:#fff;padding:10px;border-radius:15px;z-index:500;font-weight:900;max-width:240px}.piece{position:absolute;touch-action:none;filter:drop-shadow(7px 9px 4px #0005);border:2px solid #fff8}.piece:after{content:"";position:absolute;left:8%;top:8%;width:65%;height:15%;background:#fff5;border-radius:50%}.selected{outline:5px dashed #20354b;outline-offset:5px}.cube{width:88px;height:88px;border-radius:8px}.brick{width:165px;height:72px;border-radius:8px}.smallbrick{width:118px;height:65px;border-radius:8px}.plank{width:205px;height:42px;border-radius:7px}.cylinder{width:78px;height:105px;border-radius:40px/16px}.arch{width:150px;height:110px;border-radius:70px 70px 10px 10px;clip-path:polygon(0 0,100% 0,100% 100%,72% 100%,72% 53%,28% 53%,28% 100%,0 100%)}.triangle{width:130px;height:105px;clip-path:polygon(50% 0,100% 100%,0 100%)}.tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:12px}@media(max-width:700px){.game{grid-template-columns:1fr}.shelf{flex-direction:row;overflow:auto}.shelf button{min-width:110px}.table{min-height:540px}}</style></head><body><header>Jace's Block Building Table</header><div class="wrap"><a href="jace.html">Back</a><div class="teacher">Choose a real block shape from the wooden shelf. It will appear on Jace's building table.</div><div class="game"><div class="shelf"><button data-s="cube">Cube</button><button data-s="brick">Long Block</button><button data-s="smallbrick">Short Block</button><button data-s="triangle">Roof Block</button><button data-s="arch">Arch Block</button><button data-s="cylinder">Round Block</button><button data-s="plank">Wood Plank</button></div><div class="table" id="table"><div class="challenge" id="ch">BUILD IT: Make a house with 2 cubes, a long block and a roof.</div></div></div><div class="tools"><button id="rot">Rotate</button><button id="dup">Another One</button><button id="del">Put Away</button><button id="challenge">New Build</button><button id="clear">Clean Table</button></div></div><script>
const table=document.getElementById('table'),cols=[['#d64541','#ff7770'],['#e6b52e','#ffe06a'],['#368f55','#65cf83'],['#3478bd','#6bb0ef'],['#8d55b5','#c18be4'],['#d96c36','#f59b64']];let sel=null,drag=null,ox=0,oy=0,z=1,ci=0;const challenges=['Make a house with 2 cubes, a long block and a roof.','Build a bridge with 2 cubes and a long block.','Build a tall tower with 6 blocks.','Build a dinosaur pen with long blocks and an arch.','Free build! Make anything you can imagine.'];
function mk(s,x=220,y=260){let p=document.createElement('div'),co=cols[Math.floor(Math.random()*cols.length)];p.className='piece '+s;p.dataset.s=s;p.dataset.r=0;p.style.left=x+'px';p.style.top=y+'px';p.style.zIndex=++z;p.style.background='linear-gradient(135deg,'+co[1]+','+co[0]+' 55%,#0003)';p.onpointerdown=start;p.onclick=()=>select(p);table.appendChild(p);select(p)}
function select(p){document.querySelectorAll('.piece').forEach(q=>q.classList.remove('selected'));sel=p;if(p)p.classList.add('selected')}
function start(e){drag=e.currentTarget;select(drag);drag.setPointerCapture(e.pointerId);let b=drag.getBoundingClientRect();ox=e.clientX-b.left;oy=e.clientY-b.top;drag.style.zIndex=++z;drag.onpointermove=move;drag.onpointerup=end}
function move(e){let r=table.getBoundingClientRect();drag.style.left=Math.max(0,Math.min(r.width-drag.offsetWidth,e.clientX-r.left-ox))+'px';drag.style.top=Math.max(90,Math.min(r.height-drag.offsetHeight-40,e.clientY-r.top-oy))+'px'}function end(){if(drag)drag.onpointermove=null;drag=null}
document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>mk(b.dataset.s,200+Math.random()*180,230+Math.random()*120));rot.onclick=()=>{if(sel){let r=(+sel.dataset.r+90)%360;sel.dataset.r=r;sel.style.transform='rotate('+r+'deg)'}};dup.onclick=()=>{if(sel)mk(sel.dataset.s,parseFloat(sel.style.left)+25,parseFloat(sel.style.top)+25)};del.onclick=()=>{if(sel){sel.remove();sel=null}};clear.onclick=()=>document.querySelectorAll('.piece').forEach(p=>p.remove());challenge.onclick=()=>{ci=(ci+1)%challenges.length;ch.textContent='BUILD IT: '+challenges[ci]};
</script></body></html>
