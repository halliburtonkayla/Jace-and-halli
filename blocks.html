<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>🧱 Block Builder</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial Rounded MT Bold,Arial,sans-serif;background:#fff7df;color:#25324a;touch-action:manipulation}header{padding:18px;text-align:center;background:linear-gradient(135deg,#73d7ff,#ffe274,#ff9fc9);border-bottom:6px solid #fff}h1{margin:0;font-size:clamp(28px,6vw,52px)}main{max-width:1000px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:14px}.card,.btn{display:block;text-decoration:none;color:inherit;text-align:center;border:0;border-radius:26px;padding:20px 12px;font-size:20px;font-weight:800;background:white;box-shadow:0 5px 0 #d5d5d5}.card{min-height:145px}.emo{display:block;font-size:58px;margin-bottom:8px}.btn{display:inline-block;min-height:auto;padding:13px 18px;background:#ffe36f}.back{margin-bottom:15px}.panel{background:white;border-radius:25px;padding:16px;margin:12px 0}.status{text-align:center;font-size:24px;font-weight:900;min-height:40px}button:active,.card:active{transform:translateY(3px)}#yard{min-height:500px;background:#d8f3c6;border-radius:25px;padding:15px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:10px}.block{width:80px;height:80px;border:0;border-radius:14px;font-size:36px;font-weight:900;box-shadow:0 5px 0 #999}</style></head><body><header><h1>🧱 Block Builder</h1></header><main><a class="btn back" href="jace.html">⬅️ Jace's Games</a><p><button class="btn" id="more">More Blocks</button> <button class="btn" id="clear">Knock Down!</button></p><div id="yard"></div></main><script>const cols=['#ff8a80','#ffd180','#ffff8d','#b9f6ca','#80d8ff','#b388ff','#ff80ab'],abc='ABCDEFGHIJKLMNOPQRSTUVWXYZ';function add(){for(let i=0;i<12;i++){let b=document.createElement('button');b.className='block';b.style.background=cols[Math.floor(Math.random()*cols.length)];b.textContent=abc[Math.floor(Math.random()*26)];b.onclick=()=>b.textContent=abc[Math.floor(Math.random()*26)];yard.appendChild(b)}}more.onclick=add;clear.onclick=()=>yard.innerHTML='';add();</script></body></html>
