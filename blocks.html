<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Block Builder</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:Arial,sans-serif;background:#fff8df;color:#17335c;text-align:center}header{padding:16px;font-size:30px;font-weight:900;background:linear-gradient(100deg,#65d9ef,#ffe36d,#ff9db4)}a,button{border:0;border-radius:18px;background:#ffe36d;color:#17335c;padding:13px 17px;font-size:19px;font-weight:900;box-shadow:0 5px #bbb;text-decoration:none}.bar{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding:12px}.yard{position:relative;height:650px;max-width:820px;margin:10px auto;background:linear-gradient(#dff8d4,#bfeaa9);border:6px solid white;border-radius:28px;overflow:hidden;touch-action:none}.block{position:absolute;width:92px;height:92px;border-radius:18px;display:grid;place-items:center;font-size:42px;font-weight:900;box-shadow:0 9px #888;user-select:none;touch-action:none}.tip{font-weight:800;padding:8px}</style></head><body><header>🧱 Jace's Block Builder</header><div class="bar"><a href="jace.html">⬅️ Jace's Games</a><button id="more">➕ More Blocks</button><button id="knock">💥 Knock Down!</button><button id="clean">🧹 Clean Up</button></div><div class="tip">Drag the blocks. Stack a tower, build a wall, or make anything you want!</div><div class="yard" id="yard"></div><script>
const yard=document.getElementById('yard'),letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ',colors=['#ffd078','#fff77c','#74c9ed','#f675a3','#a57bf3','#a9efc8'];let n=0,drag=null,offX=0,offY=0;
function add(count=6){let r=yard.getBoundingClientRect();for(let i=0;i<count;i++){let b=document.createElement('div');b.className='block';b.textContent=letters[Math.floor(Math.random()*letters.length)];b.style.background=colors[Math.floor(Math.random()*colors.length)];b.style.left=(20+Math.random()*Math.max(20,r.width-130))+'px';b.style.top=(30+Math.random()*Math.max(30,r.height-150))+'px';b.dataset.id=n++;b.addEventListener('pointerdown',start);b.addEventListener('click',()=>{if('speechSynthesis'in window)speechSynthesis.speak(new SpeechSynthesisUtterance(b.textContent))});yard.appendChild(b)}}
function start(e){drag=e.currentTarget;drag.setPointerCapture(e.pointerId);let br=drag.getBoundingClientRect();offX=e.clientX-br.left;offY=e.clientY-br.top;drag.style.zIndex=999;drag.addEventListener('pointermove',move);drag.addEventListener('pointerup',end,{once:true})}function move(e){if(!drag)return;let r=yard.getBoundingClientRect();let x=Math.max(0,Math.min(r.width-drag.offsetWidth,e.clientX-r.left-offX)),y=Math.max(0,Math.min(r.height-drag.offsetHeight,e.clientY-r.top-offY));drag.style.left=x+'px';drag.style.top=y+'px'}function end(){if(!drag)return;drag.removeEventListener('pointermove',move);drag.style.zIndex='';drag=null}
document.getElementById('more').onclick=()=>add(4);document.getElementById('clean').onclick=()=>{yard.innerHTML='';add(8)};document.getElementById('knock').onclick=()=>{[...yard.children].forEach((b,i)=>{b.style.transition='transform .6s,left .6s,top .6s';b.style.transform='rotate('+(Math.random()*180-90)+'deg)';b.style.left=Math.random()*Math.max(1,yard.clientWidth-100)+'px';b.style.top=(yard.clientHeight-115-Math.random()*80)+'px';setTimeout(()=>{b.style.transition='';b.style.transform=''},700)})};setTimeout(()=>add(10),100);
</script></body></html>
