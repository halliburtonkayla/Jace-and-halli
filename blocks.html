<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Jace's 3D Block Studio</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:Arial Rounded MT Bold,Arial,sans-serif;color:#18324b;background:linear-gradient(#bfe8fb,#f8e9bd)}header{padding:18px;text-align:center;font-size:clamp(30px,6vw,46px);font-weight:900;background:linear-gradient(90deg,#2d8bc5,#55c979,#f1c84d);color:#fff;text-shadow:0 3px 0 #0002}.wrap{max-width:1100px;margin:auto;padding:12px}.top,.toolrow{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin:10px 0}a,button{border:0;border-radius:16px;padding:12px 15px;font:900 16px inherit;color:#18324b;background:#fff;box-shadow:0 5px 0 #0002;text-decoration:none}.teacher{background:#fff;border-radius:20px;padding:12px 16px;text-align:center;font-size:19px;font-weight:900}.studio{display:grid;grid-template-columns:190px 1fr;gap:14px;margin-top:12px}.tray{background:linear-gradient(#a56836,#7a4827);border:8px solid #5a331c;border-radius:24px;padding:12px;box-shadow:inset 0 0 24px #0005}.tray h3{color:#fff;margin:0 0 10px;text-align:center}.shapeBtn{width:100%;min-height:76px;margin:6px 0;background:linear-gradient(#fff7e5,#dfc99f);position:relative;overflow:hidden}.mini{display:inline-block;vertical-align:middle;margin-right:10px;transform:skewY(-3deg);box-shadow:6px 6px 0 #0002}.mCube{width:30px;height:30px;background:linear-gradient(135deg,#ff8a7f,#d9473f)}.mBrick{width:50px;height:24px;background:linear-gradient(135deg,#77b7f4,#3479be)}.mRoof{width:34px;height:30px;background:#f4c943;clip-path:polygon(50% 0,100% 100%,0 100%)}.mArch{width:40px;height:30px;background:#62c07c;border-radius:18px 18px 2px 2px;clip-path:polygon(0 0,100% 0,100% 100%,70% 100%,70% 55%,30% 55%,30% 100%,0 100%)}.mCyl{width:26px;height:34px;background:linear-gradient(90deg,#bb83db,#8557a9);border-radius:50%/14%}.tableWrap{position:relative}.challenge{position:absolute;z-index:50;right:16px;top:16px;background:#fff;border-radius:18px;padding:12px;width:min(250px,42%);box-shadow:0 7px 20px #0002;font-size:14px;font-weight:900}.table{position:relative;min-height:650px;border:12px solid #794d2c;border-radius:30px;overflow:hidden;touch-action:none;background:linear-gradient(#def2fb 0 17%,#c99159 17% 88%,#6c4228 88%);box-shadow:inset 0 0 40px #0003,0 12px 25px #0003;perspective:800px}.table:before{content:"";position:absolute;left:8%;right:8%;top:18%;bottom:12%;background:repeating-linear-gradient(90deg,#c58b55 0 32px,#bd824d 32px 34px);border-radius:18px;box-shadow:inset 0 0 24px #0002}.block{position:absolute;touch-action:none;user-select:none;transform-style:preserve-3d;filter:drop-shadow(9px 12px 6px #0005);cursor:grab}.block.selected{outline:5px dashed #17335c;outline-offset:6px}.block:active{cursor:grabbing}.cube,.brick,.short,.plank{border-radius:8px;border:2px solid #fff7}.cube{width:92px;height:92px}.brick{width:170px;height:76px}.short{width:122px;height:67px}.plank{width:210px;height:46px}.roof{width:138px;height:112px;clip-path:polygon(50% 0,100% 100%,0 100%)}.arch{width:150px;height:112px;border-radius:70px 70px 8px 8px;clip-path:polygon(0 0,100% 0,100% 100%,72% 100%,72% 55%,28% 55%,28% 100%,0 100%)}.cylinder{width:82px;height:112px;border-radius:50%/16%;border:2px solid #fff8}.block:before{content:"";position:absolute;inset:5px 10px auto 8px;height:18%;border-radius:50%;background:#fff5}.studs{position:absolute;left:8px;right:8px;top:-8px;height:15px;display:flex;gap:8px;justify-content:space-around}.stud{width:18px;height:12px;border-radius:50%;background:#ffffff55;border:2px solid #ffffff66}.toolrow button{background:#fff}.good{background:#91e28f!important}.danger{background:#ff9c9c!important}@media(max-width:720px){.studio{grid-template-columns:1fr}.tray{display:flex;overflow-x:auto;gap:8px}.tray h3{display:none}.shapeBtn{min-width:120px}.table{min-height:560px}.challenge{width:48%;font-size:12px}}</style></head><body>
<header>Jace's 3D Block Studio</header><div class="wrap"><div class="top"><a href="jace.html">Back to Jace's World</a></div><div class="teacher" id="teacher">Pick a block from the wooden shelf. It will pop onto the table so you can build with it.</div><div class="studio"><aside class="tray"><h3>BLOCK SHELF</h3>
<button class="shapeBtn" data-shape="cube"><span class="mini mCube"></span>Cube</button>
<button class="shapeBtn" data-shape="brick"><span class="mini mBrick"></span>Long Brick</button>
<button class="shapeBtn" data-shape="short"><span class="mini mBrick" style="width:38px"></span>Short Brick</button>
<button class="shapeBtn" data-shape="roof"><span class="mini mRoof"></span>Roof</button>
<button class="shapeBtn" data-shape="arch"><span class="mini mArch"></span>Arch</button>
<button class="shapeBtn" data-shape="cylinder"><span class="mini mCyl"></span>Cylinder</button>
<button class="shapeBtn" data-shape="plank"><span class="mini mBrick" style="width:58px;height:14px"></span>Flat Plank</button></aside>
<section class="tableWrap"><div class="challenge" id="challenge">BUILD CARD<br><span id="challengeText">Build a house with 2 cubes, 1 long brick, and a roof.</span></div><div class="table" id="table"></div></section></div>
<div class="toolrow"><button id="rotate">Rotate</button><button id="duplicate">Duplicate</button><button id="front">Bring Forward</button><button id="remove" class="danger">Put Away</button><button id="next" class="good">New Build Card</button><button id="clear">Clear Table</button></div></div>
<script>
const table=document.getElementById('table'),teacher=document.getElementById('teacher');
const palettes=[['#ff8d82','#d84e45'],['#76b9f2','#3479bd'],['#77d58f','#3b9855'],['#f4d35d','#d9a92a'],['#c793df','#8454aa'],['#f3a66c','#cf6f36']];
const challenges=['Build a house with 2 cubes, 1 long brick, and a roof.','Build a bridge with 2 cubes and a long brick.','Build the tallest tower you can.','Build a dinosaur pen with long blocks and an arch.','Build a garage with an arch and a roof.','Free build: make anything you can imagine.'];let ci=0,selected=null,drag=null,ox=0,oy=0,z=1;
function addStuds(el,n){if(!['cube','brick','short','plank'].includes(el.dataset.shape))return;let s=document.createElement('div');s.className='studs';for(let i=0;i<n;i++){let q=document.createElement('i');q.className='stud';s.appendChild(q)}el.appendChild(s)}
function createBlock(shape,x,y){const el=document.createElement('div'),p=palettes[Math.floor(Math.random()*palettes.length)];el.className='block '+shape;el.dataset.shape=shape;el.dataset.rot='0';el.style.left=(x??table.clientWidth*.42)+'px';el.style.top=(y??table.clientHeight*.45)+'px';el.style.zIndex=++z;el.style.background='linear-gradient(135deg,'+p[0]+' 0 35%,'+p[1]+' 70%,#0002 100%)';addStuds(el,shape==='brick'?4:shape==='plank'?5:shape==='short'?3:2);el.addEventListener('pointerdown',startDrag);el.addEventListener('click',()=>select(el));table.appendChild(el);select(el);teacher.textContent='Great choice. Drag it, stack it, or rotate it.'}
function select(el){document.querySelectorAll('.block').forEach(b=>b.classList.remove('selected'));selected=el;if(el)el.classList.add('selected')}
function startDrag(e){drag=e.currentTarget;select(drag);drag.setPointerCapture(e.pointerId);const r=drag.getBoundingClientRect();ox=e.clientX-r.left;oy=e.clientY-r.top;drag.style.zIndex=++z;drag.addEventListener('pointermove',moveDrag);drag.addEventListener('pointerup',endDrag,{once:true})}
function moveDrag(e){if(!drag)return;const r=table.getBoundingClientRect();let x=Math.max(0,Math.min(r.width-drag.offsetWidth,e.clientX-r.left-ox));let y=Math.max(105,Math.min(r.height-drag.offsetHeight-50,e.clientY-r.top-oy));drag.style.left=x+'px';drag.style.top=y+'px'}
function endDrag(){if(drag)drag.removeEventListener('pointermove',moveDrag);drag=null}
document.querySelectorAll('[data-shape]').forEach(b=>b.onclick=()=>createBlock(b.dataset.shape));
rotate.onclick=()=>{if(!selected)return;let r=(+selected.dataset.rot+90)%360;selected.dataset.rot=r;selected.style.transform='rotate('+r+'deg)'};
duplicate.onclick=()=>{if(!selected)return;let n=createBlock(selected.dataset.shape,parseFloat(selected.style.left)+28,parseFloat(selected.style.top)+28);n.style.background=selected.style.background};
front.onclick=()=>{if(selected)selected.style.zIndex=++z};
remove.onclick=()=>{if(selected){selected.remove();selected=null}};
clear.onclick=()=>{document.querySelectorAll('.block').forEach(b=>b.remove());selected=null;teacher.textContent='Table cleared. Pick a block to start again.'};
next.onclick=()=>{ci=(ci+1)%challenges.length;challengeText.textContent=challenges[ci];teacher.textContent='New build challenge: '+challenges[ci]};
</script></body></html>
