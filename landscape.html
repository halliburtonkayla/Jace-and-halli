<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Jace's Yard Work</title><style>
*{box-sizing:border-box}body{margin:0;background:#dff2d2;font-family:Arial Rounded MT Bold,Arial,sans-serif;color:#173a2b}header{text-align:center;background:#6fbd68;padding:17px;font-size:38px;font-weight:900}.wrap{max-width:1000px;margin:auto;padding:12px}a,button{border:0;border-radius:16px;padding:12px 15px;font-weight:900;font-size:16px;background:#fff;color:#173a2b;text-decoration:none}.teacher{background:#fff;padding:12px;border-radius:20px;text-align:center;font-size:19px;font-weight:900;margin:10px}.tools,.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:9px}.tools button.on{outline:5px solid #f2d84d}canvas{display:block;width:100%;height:auto;border:8px solid #fff;border-radius:25px;touch-action:none}.controls button{min-width:125px;min-height:60px}.use{background:#85df84}</style></head><body><header>Jace's Landscaping Yard</header><div class="wrap"><a href="jace.html">Back</a><div class="teacher" id="msg">Jace, choose the mower. Drive over the tall grass and watch it get cut.</div><div class="tools"><button data-t="mower">MOWER</button><button data-t="weed">WEED EATER</button><button data-t="blower">LEAF BLOWER</button><button data-t="rake">RAKE</button></div><canvas id="c" width="900" height="600"></canvas><div class="controls"><button id="l">LEFT</button><button id="u">UP</button><button id="r">RIGHT</button><button id="d">DOWN</button><button id="use" class="use">USE TOOL</button></div></div><script>
const c=document.getElementById('c'),g=c.getContext('2d');let p={x:450,y:370},keys={},tool='mower',using=false,last=performance.now(),cut=[];let weeds=Array.from({length:18},()=>({x:50+Math.random()*800,y:445+Math.random()*90}));let leaves=Array.from({length:25},()=>({x:80+Math.random()*740,y:210+Math.random()*330,vx:0,vy:0}));
function draw(){g.fillStyle='#8fd8f0';g.fillRect(0,0,900,170);g.fillStyle='#fff4d8';g.fillRect(55,55,240,170);g.fillStyle='#bd6044';g.beginPath();g.moveTo(35,65);g.lineTo(175,0);g.lineTo(315,65);g.fill();g.fillStyle='#2e853d';g.fillRect(0,170,900,430);for(let y=185;y<600;y+=18)for(let x=5;x<900;x+=15){g.strokeStyle='#55a24c';g.beginPath();g.moveTo(x,y+10);g.lineTo(x+4,y);g.stroke()}cut.forEach(q=>{g.fillStyle='#67ad55';g.beginPath();g.arc(q.x,q.y,45,0,7);g.fill()});weeds.forEach(w=>{g.strokeStyle='#185e29';g.lineWidth=5;g.beginPath();g.moveTo(w.x,w.y+15);g.lineTo(w.x-7,w.y-8);g.moveTo(w.x,w.y+15);g.lineTo(w.x+8,w.y-10);g.stroke()});leaves.forEach(v=>{g.fillStyle='#d77b2c';g.beginPath();g.ellipse(v.x,v.y,10,6,.4,0,7);g.fill()});g.save();g.translate(p.x,p.y);g.fillStyle='#2d62a8';g.fillRect(-22,-42,44,72);g.fillStyle='#efb07e';g.beginPath();g.arc(0,-57,19,0,7);g.fill();if(tool==='mower'){g.fillStyle='#d33';g.fillRect(25,15,65,38);g.fillStyle='#222';g.beginPath();g.arc(38,55,12,0,7);g.arc(80,55,12,0,7);g.fill()}else{g.strokeStyle='#333';g.lineWidth=8;g.beginPath();g.moveTo(22,0);g.lineTo(85,45);g.stroke();g.fillStyle=tool==='weed'?'#d44':tool==='blower'?'#e89b28':'#b6793c';g.fillRect(70,35,40,20)}g.restore()}
function effect(){if(tool==='mower'){cut.push({x:p.x+55,y:p.y+30});if(cut.length>90)cut.shift()}if(tool==='weed')weeds=weeds.filter(w=>Math.hypot(w.x-p.x,w.y-p.y)>85);if(tool==='blower')leaves.forEach(v=>{let dx=v.x-p.x,dy=v.y-p.y,d=Math.hypot(dx,dy);if(d<150){v.vx+=dx/(d||1)*5;v.vy+=dy/(d||1)*5}});if(tool==='rake')leaves.forEach(v=>{if(Math.hypot(v.x-p.x,v.y-p.y)<110){v.x+=(780-v.x)*.09;v.y+=(510-v.y)*.09}})}
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tool=b.dataset.t;document.querySelectorAll('[data-t]').forEach(q=>q.classList.remove('on'));b.classList.add('on');msg.textContent=tool==='mower'?'Drive over the grass and hold USE TOOL to mow it.':tool==='weed'?'Walk near the weeds and hold USE TOOL to trim them.':tool==='blower'?'Get near the leaves and hold USE TOOL to blow them away.':'Get near leaves and hold USE TOOL to rake them into the corner.'});document.querySelector('[data-t=mower]').classList.add('on');
function bind(id,k){let b=document.getElementById(id);b.onpointerdown=e=>{e.preventDefault();keys[k]=1};b.onpointerup=b.onpointerleave=()=>keys[k]=0}bind('l','l');bind('r','r');bind('u','u');bind('d','d');use.onpointerdown=e=>{e.preventDefault();using=true};use.onpointerup=use.onpointerleave=()=>using=false;
function loop(t){let dt=Math.min(32,t-last)/16.67;last=t;if(keys.l)p.x-=5*dt;if(keys.r)p.x+=5*dt;if(keys.u)p.y-=5*dt;if(keys.d)p.y+=5*dt;p.x=Math.max(40,Math.min(820,p.x));p.y=Math.max(210,Math.min(520,p.y));if(using)effect();leaves.forEach(v=>{v.x+=v.vx;v.y+=v.vy;v.vx*=.93;v.vy*=.93});draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
