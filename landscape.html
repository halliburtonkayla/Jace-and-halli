<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Jace's Yard Crew</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:Arial Rounded MT Bold,Arial,sans-serif;background:#bfe8ff;color:#173a2b;overflow-x:hidden}.top{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:#fff8;position:relative;z-index:3}.home,.sound{width:58px;height:58px;border:0;border-radius:50%;background:#168be8;color:white;font-size:28px;box-shadow:0 5px #0868b5}.title{text-align:center;font-size:clamp(25px,5vw,40px);font-weight:900}.teacher{text-align:center;background:#fff;padding:8px;font-size:18px;font-weight:900}.game{position:relative;max-width:1100px;margin:auto}.yard{width:100%;height:auto;display:block;touch-action:none;background:#75b84b}.tools{position:absolute;left:8px;top:10px;display:grid;gap:8px;z-index:4}.tool{width:110px;min-height:82px;border:5px solid #ffd43b;border-radius:20px;background:#fff;font-weight:900;font-size:13px;box-shadow:0 5px #0003}.tool span{display:block;font-size:34px}.tool.on{background:#fff1a6;transform:scale(1.04)}.start{position:absolute;right:14px;bottom:18px;width:120px;height:120px;border-radius:50%;border:8px solid #fff;background:#ef3e2f;color:white;font-size:20px;font-weight:900;box-shadow:0 5px 14px #0006;z-index:5}.start.on{background:#55b84b}.meter{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:min(340px,42%);height:38px;border:5px solid white;background:#333;border-radius:22px;overflow:hidden;z-index:3}.fill{height:100%;width:0;background:#69d83c}.hint{position:absolute;right:20px;top:75px;background:#fffde8dd;border-radius:18px;padding:10px;font-weight:900;z-index:3}.hand{font-size:35px;display:inline-block;animation:swipe 1.4s infinite alternate}@keyframes swipe{to{transform:translate(-55px,35px)}}@media(max-width:650px){.tool{width:78px;min-height:68px;font-size:10px}.tool span{font-size:26px}.start{width:92px;height:92px;font-size:16px}.hint{font-size:12px}.teacher{font-size:15px}}</style></head><body>
<div class="top"><button class="home" onclick="location.href='jace.html'">⌂</button><div class="title">Jace's Yard Crew</div><button class="sound" id="sound">🔊</button></div>
<div class="teacher" id="teacher">Pick the mower. Tap START. Then drag it with your finger!</div>
<div class="game"><canvas class="yard" id="yard" width="1000" height="650"></canvas><div class="tools">
<button class="tool on" data-tool="mower"><span>🏎️</span>MOWER</button><button class="tool" data-tool="weed"><span>✂️</span>WEED EATER</button><button class="tool" data-tool="blower"><span>💨</span>BLOWER</button><button class="tool" data-tool="rake"><span>🍂</span>RAKE</button></div>
<div class="meter"><div class="fill" id="fill"></div></div><div class="hint" id="hint"><span class="hand">☝️</span> Drag me!</div><button class="start" id="start">START</button></div>
<script>
const c=document.getElementById('yard'),g=c.getContext('2d'),teacher=document.getElementById('teacher'),start=document.getElementById('start'),fill=document.getElementById('fill');let tool='mower',running=false,drag=false,p={x:520,y:510},cut=[],done=0,soundOn=true;
let weeds=Array.from({length:28},(_,i)=>({x:180+(i*73)%760,y:330+(i*47)%250,alive:true})),leaves=Array.from({length:34},(_,i)=>({x:170+(i*91)%760,y:320+(i*61)%280}));
function say(t){teacher.textContent=t;if(soundOn&&'speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.rate=.88;speechSynthesis.speak(u)}}
function yardBackground(){let sky=g.createLinearGradient(0,0,0,280);sky.addColorStop(0,'#63c6f2');sky.addColorStop(1,'#e9f8ff');g.fillStyle=sky;g.fillRect(0,0,1000,300);
g.fillStyle='#eee4d2';g.fillRect(65,80,300,185);g.fillStyle='#754c35';g.fillRect(95,0,20,150);g.fillStyle='#f7f3ea';g.fillRect(80,95,270,145);g.fillStyle='#555';g.fillRect(120,120,70,65);g.fillRect(245,120,70,65);g.fillStyle='#b54b32';g.fillRect(205,160,55,80);g.fillStyle='#88472d';g.beginPath();g.moveTo(55,95);g.lineTo(215,20);g.lineTo(375,95);g.fill();
g.fillStyle='#9a714f';g.fillRect(0,250,1000,18);for(let x=0;x<1000;x+=48){g.fillRect(x,210,18,85);g.beginPath();g.moveTo(x,210);g.lineTo(x+9,194);g.lineTo(x+18,210);g.fill()}
g.fillStyle='#3d8d3d';g.fillRect(0,285,1000,365);g.fillStyle='#73513a';g.fillRect(800,80,34,220);g.fillStyle='#287a37';for(let i=0;i<7;i++){g.beginPath();g.arc(815+(i-3)*30,75+(i%2)*22,62,0,Math.PI*2);g.fill()}
for(let y=305;y<650;y+=18)for(let x=0;x<1000;x+=15){g.strokeStyle='#246d2c';g.lineWidth=2;g.beginPath();g.moveTo(x,y+12);g.lineTo(x+5,y);g.stroke()}
cut.forEach(q=>{g.fillStyle='#6db85b';g.beginPath();g.arc(q.x,q.y,55,0,Math.PI*2);g.fill()});
weeds.filter(w=>w.alive).forEach(w=>{g.strokeStyle='#175f28';g.lineWidth=4;g.beginPath();g.moveTo(w.x,w.y+15);g.lineTo(w.x-7,w.y-8);g.moveTo(w.x,w.y+15);g.lineTo(w.x+8,w.y-10);g.stroke();g.fillStyle='#f3d94f';g.beginPath();g.arc(w.x,w.y-10,5,0,7);g.fill()});
leaves.forEach(v=>{g.fillStyle='#d97b2d';g.beginPath();g.ellipse(v.x,v.y,10,6,.4,0,7);g.fill()})}
function drawTool(){g.save();g.translate(p.x,p.y);g.shadowColor='#0007';g.shadowBlur=12;g.shadowOffsetY=8;if(tool==='mower'){g.fillStyle='#1f1f1f';g.fillRect(-48,-35,18,75);g.fillRect(30,-35,18,75);g.fillStyle='#d93228';g.beginPath();g.roundRect(-55,-50,110,75,18);g.fill();g.fillStyle='#333';g.beginPath();g.arc(0,-28,24,0,7);g.fill();g.strokeStyle='#222';g.lineWidth=10;g.beginPath();g.moveTo(-35,-45);g.lineTo(-60,-105);g.lineTo(60,-105);g.lineTo(35,-45);g.stroke()}else{g.strokeStyle='#333';g.lineWidth=12;g.beginPath();g.moveTo(-45,-70);g.lineTo(40,25);g.stroke();g.fillStyle=tool==='weed'?'#ef6c23':tool==='blower'?'#d7372d':'#4d9c45';g.beginPath();g.roundRect(20,5,80,38,15);g.fill()}g.restore()}
function draw(){yardBackground();drawTool()}
function point(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*1000/r.width,y:(e.clientY-r.top)*650/r.height}}
function work(){if(!running)return;if(tool==='mower'){cut.push({x:p.x,y:p.y+25});if(cut.length>180)cut.shift();done=Math.min(100,done+.35)}else if(tool==='weed'){weeds.forEach(w=>{if(w.alive&&Math.hypot(w.x-p.x,w.y-p.y)<85){w.alive=false;done=Math.min(100,done+2)}})}else if(tool==='blower'){leaves.forEach(v=>{if(Math.hypot(v.x-p.x,v.y-p.y)<130){v.x+=Math.sign(v.x-p.x)*20;v.y+=Math.sign(v.y-p.y)*15;done=Math.min(100,done+.3)}})}else{leaves.forEach(v=>{if(Math.hypot(v.x-p.x,v.y-p.y)<120){v.x+=(900-v.x)*.18;v.y+=(570-v.y)*.18;done=Math.min(100,done+.25)}})}fill.style.width=done+'%';if(done>=100){running=false;start.classList.remove('on');start.textContent='START';say('Great job Jace! The yard looks amazing!')}}
c.addEventListener('pointerdown',e=>{e.preventDefault();drag=true;c.setPointerCapture?.(e.pointerId);let q=point(e);p.x=q.x;p.y=q.y;work();document.getElementById('hint').style.display='none'},{passive:false});c.addEventListener('pointermove',e=>{if(!drag)return;e.preventDefault();let q=point(e);p.x=Math.max(120,Math.min(940,q.x));p.y=Math.max(300,Math.min(600,q.y));work()},{passive:false});c.addEventListener('pointerup',()=>drag=false);c.addEventListener('pointercancel',()=>drag=false);
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.remove('on'));b.classList.add('on');let n=tool==='mower'?'mower':tool==='weed'?'weed eater':tool==='blower'?'leaf blower':'rake';say('You picked the '+n+'. Tap START, then drag it around the yard!')});
start.onclick=()=>{running=!running;start.classList.toggle('on',running);start.textContent=running?'STOP':'START';say(running?'It is started! Drag it around the yard with your finger.':'Tool stopped.')};
document.getElementById('sound').onclick=()=>{soundOn=!soundOn;document.getElementById('sound').textContent=soundOn?'🔊':'🔇'};
(function loop(){draw();requestAnimationFrame(loop)})();setTimeout(()=>say('Jace, pick the mower. Tap START. Then drag it around the yard with your finger!'),500);
</script></body></html>
