<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Jace's Yard Crew</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:Arial Rounded MT Bold,Arial,sans-serif;background:linear-gradient(#c8ecff,#def0c3);color:#173a2b}header{text-align:center;padding:18px;background:linear-gradient(90deg,#3b9b55,#63b858,#b8c94c);color:#fff;font-size:clamp(30px,6vw,44px);font-weight:900}.wrap{max-width:1050px;margin:auto;padding:12px}a,button{border:0;border-radius:16px;padding:12px 15px;font-size:16px;font-weight:900;background:#fff;color:#173a2b;text-decoration:none;box-shadow:0 4px #0002}.teacher{background:#fff;border-radius:20px;padding:12px;text-align:center;font-size:19px;font-weight:900;margin:10px}.tools,.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px}.tools button.on{outline:5px solid #f3d94f}.yardFrame{background:#fff;border:8px solid #fff;border-radius:28px;overflow:hidden;box-shadow:0 10px 26px #0003}canvas{display:block;width:100%;height:auto;touch-action:none}.controls button{min-width:125px;min-height:60px}.use{background:#84df87}.hud{text-align:center;font-size:18px;font-weight:900;margin:8px}.toolHint{font-size:14px;text-align:center}</style></head><body>
<header>Jace's Yard Crew</header><div class="wrap"><a href="jace.html">Back to Jace's World</a><div class="teacher" id="teacher">Jace, choose the mower. Drive over the tall grass and hold USE TOOL.</div><div class="tools"><button class="on" data-tool="mower">MOWER</button><button data-tool="weed">WEED EATER</button><button data-tool="blower">LEAF BLOWER</button><button data-tool="rake">RAKE</button></div><div class="hud">YARD STARS: <b id="stars">0</b></div><div class="yardFrame"><canvas id="yard" width="900" height="600"></canvas></div><div class="controls"><button id="left">LEFT</button><button id="up">UP</button><button id="right">RIGHT</button><button id="down">DOWN</button><button id="use" class="use">USE TOOL</button></div><div class="toolHint">The yard changes while you work: grass gets cut, weeds disappear, leaves blow away, and raking pulls leaves into a pile.</div></div>
<script>
const c=document.getElementById('yard'),g=c.getContext('2d');let p={x:450,y:400},keys={},tool='mower',using=false,last=performance.now(),stars=0,cut=[];
let weeds=Array.from({length:22},()=>({x:55+Math.random()*790,y:430+Math.random()*115}));
let leaves=Array.from({length:28},()=>({x:70+Math.random()*760,y:230+Math.random()*300,vx:0,vy:0}));
function drawHouse(){g.fillStyle='#f8e6c5';g.fillRect(60,65,250,150);g.fillStyle='#b75d45';g.beginPath();g.moveTo(35,75);g.lineTo(185,5);g.lineTo(335,75);g.closePath();g.fill();g.fillStyle='#7db6d8';g.fillRect(90,110,55,55);g.fillRect(225,110,55,55);g.fillStyle='#7a4d2e';g.fillRect(160,130,50,85)}
function drawFence(){g.fillStyle='#e1cfaa';for(let x=0;x<900;x+=55){g.fillRect(x,190,18,82);g.beginPath();g.moveTo(x,190);g.lineTo(x+9,175);g.lineTo(x+18,190);g.fill()}g.fillRect(0,215,900,12)}
function drawTree(x,y,s){g.fillStyle='#70472b';g.fillRect(x-10*s,y,20*s,70*s);g.fillStyle='#3b8c49';for(let i=0;i<5;i++){g.beginPath();g.arc(x+(i-2)*18*s,y-10-(i%2)*16*s,34*s,0,Math.PI*2);g.fill()}}
function drawPlayer(){g.save();g.translate(p.x,p.y);g.fillStyle='#2f68aa';g.fillRect(-21,-45,42,68);g.fillStyle='#efb17e';g.beginPath();g.arc(0,-61,19,0,Math.PI*2);g.fill();g.fillStyle='#6b3d22';g.beginPath();g.arc(0,-67,20,Math.PI,Math.PI*2);g.fill();if(tool==='mower'){g.strokeStyle='#333';g.lineWidth=7;g.beginPath();g.moveTo(18,-5);g.lineTo(42,18);g.stroke();g.fillStyle='#cf3d36';g.fillRect(36,15,70,38);g.fillStyle='#242424';g.beginPath();g.arc(50,55,12,0,Math.PI*2);g.arc(92,55,12,0,Math.PI*2);g.fill()}else{g.strokeStyle='#333';g.lineWidth=7;g.beginPath();g.moveTo(18,-2);g.lineTo(86,42);g.stroke();g.fillStyle=tool==='weed'?'#d94a42':tool==='blower'?'#e2a136':'#a56e3c';g.fillRect(72,32,42,19)}g.restore()}
function draw(){g.clearRect(0,0,900,600);let sky=g.createLinearGradient(0,0,0,220);sky.addColorStop(0,'#7ed0f5');sky.addColorStop(1,'#e8f7ff');g.fillStyle=sky;g.fillRect(0,0,900,220);drawHouse();drawTree(710,135,1);drawTree(790,150,.8);drawFence();g.fillStyle='#3e913f';g.fillRect(0,260,900,340);for(let y=278;y<600;y+=17)for(let x=5;x<900;x+=14){g.strokeStyle='#2d782f';g.lineWidth=2;g.beginPath();g.moveTo(x,y+10);g.lineTo(x+3,y);g.stroke()}cut.forEach(q=>{g.fillStyle='#66ad59';g.beginPath();g.arc(q.x,q.y,44,0,Math.PI*2);g.fill()});weeds.forEach(w=>{g.strokeStyle='#155e2a';g.lineWidth=4;g.beginPath();g.moveTo(w.x,w.y+16);g.lineTo(w.x-8,w.y-7);g.moveTo(w.x,w.y+16);g.lineTo(w.x+8,w.y-9);g.stroke()});leaves.forEach(v=>{g.fillStyle='#d77b2d';g.beginPath();g.ellipse(v.x,v.y,10,6,.4,0,Math.PI*2);g.fill()});drawPlayer()}
function work(){if(tool==='mower'){cut.push({x:p.x+70,y:p.y+35});if(cut.length%8===0){stars++;document.getElementById('stars').textContent=stars}if(cut.length>100)cut.shift()}if(tool==='weed'){let before=weeds.length;weeds=weeds.filter(w=>Math.hypot(w.x-p.x,w.y-p.y)>90);if(weeds.length<before){stars++;document.getElementById('stars').textContent=stars}}if(tool==='blower'){leaves.forEach(v=>{let dx=v.x-p.x,dy=v.y-p.y,d=Math.hypot(dx,dy);if(d<165){v.vx+=dx/(d||1)*5.8;v.vy+=dy/(d||1)*5.8}})}if(tool==='rake'){leaves.forEach(v=>{if(Math.hypot(v.x-p.x,v.y-p.y)<120){v.x+=(815-v.x)*.11;v.y+=(520-v.y)*.11}})}}
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.remove('on'));b.classList.add('on');teacher.textContent=tool==='mower'?'Drive over the tall grass and hold USE TOOL.':tool==='weed'?'Walk near weeds and hold USE TOOL to trim them.':tool==='blower'?'Get near the leaves and hold USE TOOL to blow them.':'Get near leaves and hold USE TOOL to rake them into the corner.'});
function hold(id,k){let b=document.getElementById(id);['pointerdown','touchstart'].forEach(n=>b.addEventListener(n,e=>{e.preventDefault();keys[k]=1},{passive:false}));['pointerup','pointerleave','pointercancel','touchend'].forEach(n=>b.addEventListener(n,e=>{e.preventDefault();keys[k]=0},{passive:false}))}hold('left','l');hold('right','r');hold('up','u');hold('down','d');use.onpointerdown=e=>{e.preventDefault();using=true};use.onpointerup=use.onpointerleave=()=>using=false;
function loop(t){let dt=Math.min(32,t-last)/16.67;last=t;if(keys.l)p.x-=5*dt;if(keys.r)p.x+=5*dt;if(keys.u)p.y-=5*dt;if(keys.d)p.y+=5*dt;p.x=Math.max(35,Math.min(835,p.x));p.y=Math.max(310,Math.min(535,p.y));if(using)work();leaves.forEach(v=>{v.x+=v.vx;v.y+=v.vy;v.vx*=.93;v.vy*=.93});draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
