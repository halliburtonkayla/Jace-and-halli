<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Jace's Landscaping Yard</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:Arial Rounded MT Bold,Arial,sans-serif;background:linear-gradient(#94dfff,#dff2a4);color:#17335c}header{text-align:center;padding:18px;font-size:clamp(30px,7vw,46px);font-weight:900;background:linear-gradient(100deg,#4da66d,#64cef0,#f3d85c)}.wrap{max-width:1000px;margin:auto;padding:14px}.bar,.tools,.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:10px 0}a,button{border:0;border-radius:18px;padding:12px 16px;font-size:17px;font-weight:900;background:#ffe36d;color:#17335c;text-decoration:none;box-shadow:0 5px #0002}.teacher{background:#fff;border-radius:24px;padding:14px;text-align:center;font-size:21px;font-weight:900}.tools button{background:#fff}.tools button.on{outline:5px solid #4aa95c}.hud{text-align:center;font-weight:900;padding:8px}canvas{display:block;width:100%;height:auto;border:6px solid #fff;border-radius:28px;background:#8fdaff;touch-action:none}.controls{display:grid;grid-template-columns:repeat(3,1fr)}.controls button{min-height:64px}.green{background:#95e68e}.blue{background:#95d7ff}@media(max-width:600px){.controls{grid-template-columns:1fr 1fr}.tools button{font-size:15px}}</style></head><body>
<header>Jace's Landscaping Yard</header><div class="wrap"><div class="bar"><a href="jace.html">Back to Jace's World</a></div><div class="teacher" id="teacher">Jace, the yard needs mowing. Pick the lawn mower and drive over the tall grass.</div><div class="tools"><button data-tool="mower">Lawn Mower</button><button data-tool="weed">Weed Eater</button><button data-tool="blower">Leaf Blower</button><button data-tool="rake">Rake</button></div><div class="hud">Task: <span id="task">Mow the grass</span> · Stars: <span id="stars">0</span></div><canvas id="yard" width="900" height="560"></canvas><div class="controls"><button id="left">LEFT</button><button id="up">UP</button><button id="right">RIGHT</button><button id="down">DOWN</button><button id="use" class="green">USE TOOL</button><button id="next" class="blue">NEXT TASK</button></div></div>
<script>
const c=document.getElementById('yard'),g=c.getContext('2d');let player={x:450,y:360},keys={l:0,r:0,u:0,d:0},tool='mower',taskIndex=0,stars=0,last=performance.now();
const tasks=[
{tool:'mower',name:'Mow the grass',ask:'Jace, the yard needs mowing. Pick the lawn mower and drive over the tall grass.'},
{tool:'weed',name:'Trim the weeds',ask:'Jace, can you pick the weed eater and trim the weeds by the fence?'},
{tool:'blower',name:'Blow the leaves',ask:'Jace, can you use the leaf blower to clear the leaves?'},
{tool:'rake',name:'Rake the yard',ask:'Jace, can you rake the last pile into a neat spot?'}];
let grass=Array.from({length:42},()=>({x:80+Math.random()*740,y:220+Math.random()*260,done:false}));
let weeds=Array.from({length:12},()=>({x:50+Math.random()*800,y:470+Math.random()*45,done:false}));
let leaves=Array.from({length:18},()=>({x:70+Math.random()*760,y:220+Math.random()*280,done:false}));
let rake=Array.from({length:10},()=>({x:340+Math.random()*220,y:250+Math.random()*220,done:false}));
function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.rate=.84;u.pitch=1.05;speechSynthesis.speak(u)}
function draw(){g.clearRect(0,0,900,560);g.fillStyle='#8fdaff';g.fillRect(0,0,900,160);g.fillStyle='#6dbb57';g.fillRect(0,160,900,400);g.fillStyle='#c8a574';g.fillRect(0,500,900,60);g.fillStyle='#a97c50';g.fillRect(0,185,900,16);for(let x=30;x<900;x+=70){g.fillRect(x,145,14,70)};grass.forEach(o=>{if(!o.done){g.strokeStyle='#2f7d38';g.lineWidth=4;for(let i=0;i<5;i++){g.beginPath();g.moveTo(o.x+i*3,o.y+16);g.lineTo(o.x+i*3-4,o.y);g.stroke()}}});weeds.forEach(o=>{if(!o.done){g.fillStyle='#287d3d';g.beginPath();g.arc(o.x,o.y,10,0,7);g.fill()}});leaves.forEach(o=>{if(!o.done){g.fillStyle='#d9822b';g.beginPath();g.ellipse(o.x,o.y,10,6,.4,0,7);g.fill()}});rake.forEach(o=>{if(!o.done){g.fillStyle='#8b5a2b';g.fillRect(o.x,o.y,12,12)}});g.fillStyle='#3d73d9';g.fillRect(player.x-22,player.y-34,44,68);g.fillStyle='#f2b07a';g.beginPath();g.arc(player.x,player.y-48,18,0,7);g.fill();g.fillStyle='#222';g.font='22px Arial';g.textAlign='center';g.fillText(tool==='mower'?'MOWER':tool==='weed'?'TRIM':tool==='blower'?'BLOW':'RAKE',player.x,player.y+52)}
function currentItems(){return tool==='mower'?grass:tool==='weed'?weeds:tool==='blower'?leaves:rake}
function useTool(){let t=tasks[taskIndex];if(tool!==t.tool){document.getElementById('teacher').textContent='Try the '+(t.tool==='weed'?'weed eater':t.tool)+'.';speak(document.getElementById('teacher').textContent);return}let hit=false;currentItems().forEach(o=>{if(!o.done&&Math.hypot(o.x-player.x,o.y-player.y)<60){o.done=true;hit=true}});if(hit){stars++;document.getElementById('stars').textContent=stars;document.getElementById('teacher').textContent='Great job, Jace! Keep going!'}if(currentItems().every(o=>o.done)){document.getElementById('teacher').textContent='You finished this yard job! Press NEXT TASK.';speak('You finished this yard job! Press next task.')}}
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.remove('on'));b.classList.add('on')});
function bind(id,k){let b=document.getElementById(id);['pointerdown','touchstart'].forEach(n=>b.addEventListener(n,e=>{e.preventDefault();keys[k]=1},{passive:false}));['pointerup','pointercancel','pointerleave','touchend'].forEach(n=>b.addEventListener(n,e=>{e.preventDefault();keys[k]=0},{passive:false}))}bind('left','l');bind('right','r');bind('up','u');bind('down','d');
document.getElementById('use').onclick=useTool;document.getElementById('next').onclick=()=>{taskIndex=(taskIndex+1)%tasks.length;let t=tasks[taskIndex];document.getElementById('task').textContent=t.name;document.getElementById('teacher').textContent=t.ask;speak(t.ask)};
function loop(now){let dt=Math.min(32,now-last)/16.67;last=now;if(keys.l)player.x-=5*dt;if(keys.r)player.x+=5*dt;if(keys.u)player.y-=5*dt;if(keys.d)player.y+=5*dt;player.x=Math.max(35,Math.min(865,player.x));player.y=Math.max(210,Math.min(485,player.y));draw();requestAnimationFrame(loop)}document.querySelector('[data-tool="mower"]').classList.add('on');draw();setTimeout(()=>speak(tasks[0].ask),250);requestAnimationFrame(loop);
</script></body></html>
