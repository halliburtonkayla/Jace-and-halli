<!doctype html><html lang="en"><meta charset="utf-8"><title>Family Play Park viewport checks</title><style>body{font:16px system-ui;background:#d6e2da;color:#23463e;margin:12px}nav{display:flex;gap:8px;margin:10px}iframe{border:0;border-radius:18px;width:390px;height:740px}section{display:flex;gap:16px;flex-wrap:wrap}button,select{font:inherit;padding:9px}p{max-width:850px}</style><h1>Family Play Park · two-player preview</h1><p>This test page runs the actual game with two independent views and one simulation. It does not test internet connectivity between separate devices.</p><nav><select aria-label="Activity" id="activity"></select><button id="phone">Phone</button><button id="wide">Landscape</button><button id="replay">Check touch movement</button></nav><section><iframe id="a" title="Mommy’s game"></iframe><iframe id="b" title="Unique’s game"></iframe></section><p id="report" role="status"></p><script type="module">
import {ParkSession,GAMES} from '../client/playpark/session.mjs?v=hide-2';const frames=[document.getElementById('a'),document.getElementById('b')],players=[{id:'a',name:'Mommy',profile:'mommy'},{id:'b',name:'Unique',profile:'unique'}];let session,game=new URLSearchParams(location.search).get('game')||'hide';if(!Object.hasOwn(GAMES,game))game='hide';const select=document.getElementById('activity');for(const [id,name]of Object.entries(GAMES)){const o=document.createElement('option');o.value=id;o.textContent=name;select.append(o);}function start(){game=select.value;session=new ParkSession();players.forEach(p=>session.request(p,{op:'join',game}));frames.forEach(f=>f.src='../../family-playpark.html?v=hide-2&activity='+game+'#'+game);}select.value=game;select.onchange=start;start();addEventListener('message',e=>{if(e.origin!==location.origin||e.data?.channel!=='jhw-playpark')return;const i=frames.findIndex(f=>f.contentWindow===e.source);if(i<0)return;try{const d=e.data;if(d.type==='context'){const state=session.request(players[i],{op:'join',game});e.source.postMessage({channel:'jhw-playpark',type:'context',id:players[i].id,state},location.origin);}if(d.type==='command')session.request(players[i],d.body);}catch(error){e.source.postMessage({channel:'jhw-playpark',type:'error',error:error.message},location.origin);}});setInterval(()=>{session.tick(.05);frames.forEach((f,i)=>f.contentWindow.postMessage({channel:'jhw-playpark',type:'state',state:session.snapshot(players[i].id)},location.origin));document.getElementById('report').textContent=Object.values(session.games).find(g=>g===session.games[game])?.message||'';},50);document.getElementById('phone').onclick=()=>frames.forEach(f=>{f.style.width='390px';f.style.height='740px';});document.getElementById('wide').onclick=()=>frames.forEach(f=>{f.style.width='844px';f.style.height='390px';});
document.getElementById('replay').onclick=async()=>{const win=frames[1].contentWindow,canvas=win.document.getElementById('game'),rect=canvas.getBoundingClientRect(),before=+canvas.dataset.playerX;const ev=(name,x,y)=>canvas.dispatchEvent(new win.PointerEvent(name,{pointerId:1,pointerType:'touch',clientX:x,clientY:y,bubbles:true}));try{ev('pointerdown',rect.left+80,rect.top+150);}catch{};ev('pointermove',rect.left+120,rect.top+150);await new Promise(r=>setTimeout(r,650));ev('pointerup',rect.left+120,rect.top+150);await new Promise(r=>setTimeout(r,600));const after=+canvas.dataset.playerX;document.getElementById('touch-result').textContent='Touch movement: '+before.toFixed(2)+' → '+after.toFixed(2)+(after>before?' PASS':' FAIL');};
</script><p id="touch-result" role="status"></p></html>
