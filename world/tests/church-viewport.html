<!doctype html><html lang="en"><meta charset="utf-8"><title>Church device layout checks</title><style>body{font:16px system-ui;background:#ddd;color:#222}iframe{display:block;border:2px solid #222;margin:10px 0 30px}button{padding:15px;margin-right:12px}</style><h1>Church device layout checks</h1><button data-size="844,390">Phone landscape</button><button data-size="390,844">Phone portrait</button><button data-size="1024,768">iPad landscape</button><button data-size="768,1024">iPad portrait</button><p id="dimensions">844 × 390</p><iframe id="device" title="Church service on a mobile screen" width="844" height="390" src="../../church.html?check=viewport" allow="autoplay; fullscreen"></iframe><script>document.querySelectorAll('button').forEach(b=>b.onclick=()=>{const [w,h]=b.dataset.size.split(',');device.width=w;device.height=h;dimensions.textContent=w+' × '+h;});</script></html>
