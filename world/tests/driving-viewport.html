<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Town and tractor driving checks</title><style>body{margin:0;padding:16px;display:flex;gap:20px;background:#253f43;color:#fff1d2;font:14px system-ui}aside{width:245px;flex-shrink:0}button{padding:10px;margin:4px;font:inherit}iframe{border:0;width:390px;height:740px;flex-shrink:0}pre{white-space:pre-wrap;line-height:1.5;font-size:12px}</style><aside><h1>Driving checks</h1><p>Developer fixture. Loads the actual existing game pages and drives them with keyboard events.</p><button id="town">Town</button><button id="farm">Tractor</button><button id="phone">Phone 390 × 740</button><button id="wide">Landscape 844 × 390</button><button id="run">Check controls</button><button id="family">Family world</button><pre id="report">Ready.</pre></aside><iframe id="subject" title="Driving game test viewport" src="../../town-driving.html?qa=1&v=drive-2"></iframe><script type="module">
const f=document.getElementById('subject'),report=document.getElementById('report');let running=false;
const log=s=>report.textContent+=s+'\n',wait=ms=>new Promise(r=>setTimeout(r,ms));
async function advance(w,seconds){const start=w.driveSnapshot.time;if(!Number.isFinite(start))throw Error('Old QA module is cached; reload the fixture.');const deadline=Date.now()+25000;while(w.driveSnapshot.time-start<seconds&&Date.now()<deadline)await wait(100);if(Date.now()>=deadline)throw Error('Simulation stalled: '+JSON.stringify(w.driveSnapshot));}
for(const [id,file]of[['town','town-driving'],['farm','tractor-farm']])document.getElementById(id).onclick=()=>{f.src='../../'+file+'.html?qa=1&v=drive-2';};
document.getElementById('phone').onclick=()=>{f.style.width='390px';f.style.height='740px';};document.getElementById('wide').onclick=()=>{f.style.width='844px';f.style.height='390px';};document.getElementById('family').onclick=()=>{f.src='../../index.html?v=drive-1';};
addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==f.contentWindow||e.data?.channel!=='jhw-driving')return;if(e.data.type==='context')e.source.postMessage({channel:'jhw-driving',type:'context',profile:'qa-driving',sound:false},location.origin);if(['exit','destination'].includes(e.data.type))log('Navigation message: '+JSON.stringify(e.data));});
document.getElementById('run').onclick=async()=>{
 if(running)return;running=true;report.textContent='Running…\n';const w=f.contentWindow,d=f.contentDocument,key=(code,down)=>w.dispatchEvent(new w.KeyboardEvent(down?'keydown':'keyup',{code,bubbles:true,cancelable:true})),check=(ok,text)=>{log((ok?'PASS: ':'FAIL: ')+text);if(!ok)throw Error(text);};
 try{d.getElementById('start').click();await wait(300);const before=w.driveSnapshot;key('ArrowUp',true);await advance(w,2.2);key('ArrowUp',false);const moved=w.driveSnapshot;log('Movement: '+JSON.stringify({before:before.player,after:moved.player,time:moved.time}));check(moved.player.z<before.player.z-5&&moved.player.v>4,'Gas moves through the world');key('ArrowUp',true);key('ArrowRight',true);await advance(w,.55);key('ArrowRight',false);key('ArrowUp',false);check(w.driveSnapshot.player.angle>moved.player.angle+.2,'Continuous steering changes heading');key('ArrowDown',true);await advance(w,1.5);key('ArrowDown',false);check(w.driveSnapshot.player.v<.1,'Brake stops vehicle');const at=w.driveSnapshot;key('KeyB',true);await advance(w,.9);key('KeyB',false);check(w.driveSnapshot.player.v<0,'Back pedal reverses');d.getElementById('camera').click();check(w.driveSnapshot.camera!==before.camera,'Camera switches');d.getElementById('pause').click();const paused=w.driveSnapshot;await wait(400);check(!w.driveSnapshot.active&&w.driveSnapshot.player.z===paused.player.z,'Pause releases all driving input');d.getElementById('start').click();
 for(const id of ['wheel','gas','brake','reverse','pause','camera','map-button']){const r=d.getElementById(id).getBoundingClientRect();check(r.left>=0&&r.top>=0&&r.right<=w.innerWidth+1&&r.bottom<=w.innerHeight+1,id+' fits viewport');}
 check(d.documentElement.scrollWidth===w.innerWidth&&d.documentElement.scrollHeight===w.innerHeight,'No trapped page overflow');d.getElementById('map-button').click();check(d.getElementById('map-dialog').open,'Map opens');d.getElementById('close-map').click();check(w.driveSnapshot.active,'Map returns to driving');log('COMPLETE: '+w.driveSnapshot.mode+' '+w.innerWidth+' × '+w.innerHeight);
 }catch(e){log('ERROR: '+e.message);}finally{for(const code of ['ArrowUp','ArrowRight','ArrowDown','KeyB'])key(code,false);running=false;}
};
</script></html>
