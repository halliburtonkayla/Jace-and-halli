<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Playground responsive checks</title><style>body{margin:16px;background:#e9eee8;font:14px system-ui}button{padding:12px;margin:4px}iframe{display:block;width:390px;height:740px;border:0;box-shadow:0 8px 30px #2344}</style><button id="portrait">Phone portrait</button><button id="landscape">Phone landscape</button><button id="walk">Drag right for one second</button><iframe id="game" title="Playground" src="../../school-playground.html?v=illustrated-2"></iframe><script>
const frame=document.getElementById('game');document.getElementById('portrait').onclick=()=>{frame.style.width='390px';frame.style.height='740px';};document.getElementById('landscape').onclick=()=>{frame.style.width='844px';frame.style.height='390px';};document.getElementById('walk').onclick=()=>{const c=frame.contentDocument.getElementById('playground'),r=c.getBoundingClientRect(),win=frame.contentWindow;const fire=(type,x)=>c.dispatchEvent(new win.PointerEvent(type,{bubbles:true,pointerId:7,clientX:r.left+x,clientY:r.top+r.height*.7,pointerType:'touch'}));const old=c.setPointerCapture;c.setPointerCapture=()=>{};fire('pointerdown',100);fire('pointermove',155);setTimeout(()=>{fire('pointerup',155);c.setPointerCapture=old;},1000);};
</script>
