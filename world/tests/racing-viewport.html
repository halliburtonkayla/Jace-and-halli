<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Racing viewport checks — existing arcade</title>
<style>body{margin:0;background:#28313c;color:#e5edf3;font:14px system-ui;display:flex;gap:20px;padding:16px}aside{width:260px}button{padding:10px;margin:4px;font:inherit}iframe{border:0;width:390px;height:740px;background:#081429;flex-shrink:0}pre{white-space:pre-wrap;font-size:12px;line-height:1.6}</style>
<aside><h1>Racing viewport checks</h1><p>Developer test fixture. The frame loads the existing arcade game unchanged.</p><button id="phone">Phone 390 × 740</button><button id="landscape">Landscape 844 × 390</button><button id="replay">Run driving input check</button><p>The replay holds keyboard controls and steers using the game's displayed telemetry. It runs three full laps without changing race state or shortening the track.</p><pre id="report">Ready.</pre></aside>
<iframe id="subject" title="Existing arcade at phone size" src="../../arcade-new.html#race"></iframe>
<script type="module">
const frame=document.getElementById('subject'),report=document.getElementById('report');let running=false;
if(new URLSearchParams(location.search).has('family')){frame.src='../../index.html?race=family&v=family-race-4';frame.title='Existing family world at phone size';document.getElementById('replay').hidden=true;report.textContent='Family mode: use the real room, approval and race controls in the frame.';}
document.getElementById('phone').onclick=()=>{frame.style.width='390px';frame.style.height='740px';};document.getElementById('landscape').onclick=()=>{frame.style.width='844px';frame.style.height='390px';};
document.getElementById('replay').onclick=async()=>{
 if(running)return;const doc=frame.contentDocument,win=frame.contentWindow,root=doc.getElementById('moto');if(!doc.getElementById('race-start'))return;running=true;report.textContent='Starting real input replay…\n';
 const log=s=>report.textContent+=s+'\n',wait=ms=>new Promise(r=>setTimeout(r,ms)),key=(code,down)=>win.dispatchEvent(new KeyboardEvent(down?'keydown':'keyup',{code,bubbles:true,cancelable:true}));
 doc.getElementById('race-start').click();await wait(1200);log('Countdown: '+doc.getElementById('race-banner').textContent);await wait(2100);key('ArrowUp',true);await wait(4500);const fast=+doc.getElementById('race-mph').textContent,s=+root.dataset.distance;log('Held gas: '+fast+' MPH / '+s+' meters');key('ArrowUp',false);await wait(700);log('Coasting: '+doc.getElementById('race-mph').textContent+' MPH');key('ArrowDown',true);await wait(800);key('ArrowDown',false);log('Held brake: '+doc.getElementById('race-mph').textContent+' MPH');key('ArrowUp',true);const x=+root.dataset.lateral;key('ArrowLeft',true);await wait(500);key('ArrowLeft',false);log('Held left: x '+x+' → '+root.dataset.lateral);key('ArrowRight',true);await wait(500);key('ArrowRight',false);log('Held right: x '+root.dataset.lateral);
 const lapSet=new Set();let lastX=+root.dataset.lateral,ticks=0;
 while(!['results','complete'].includes(root.dataset.phase)&&ticks++<3000){const x=+root.dataset.lateral,vx=(x-lastX)*10;lastX=x;const correction=-x*.9-vx*.65;key('ArrowLeft',correction<-.2);key('ArrowRight',correction>.2);lapSet.add(doc.getElementById('race-lap').textContent);if(ticks%100===0)log(doc.getElementById('race-lap').textContent+' · '+doc.getElementById('race-position').textContent+' · '+doc.getElementById('race-time').textContent);await wait(100);}
 for(const code of['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'])key(code,false);log('Lap states: '+[...lapSet].join(', '));log('Collisions: '+root.dataset.collisions);log('No scroll: '+(doc.documentElement.scrollHeight===win.innerHeight));log('Finish: '+doc.getElementById('race-finish-title').textContent);await wait(18000);log(doc.getElementById('race-result-list').innerText);running=false;
};
</script></html>
