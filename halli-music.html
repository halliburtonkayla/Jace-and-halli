<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Music Maker</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Arial,sans-serif;background:#fff8df;color:#17335c;overscroll-behavior:none}
header{padding:20px 12px;text-align:center;font-size:clamp(28px,7vw,44px);font-weight:900;background:linear-gradient(110deg,#65d9ef,#ffe56d,#ff9db4)}
.wrap{max-width:900px;margin:auto;padding:16px}
nav{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
a,button{border:0;border-radius:22px;padding:15px 18px;font-size:clamp(18px,4vw,25px);font-weight:900;background:#ffe36d;color:#17335c;text-decoration:none;box-shadow:0 6px 0 #d3d3d3;touch-action:manipulation}
button:active,a:active{transform:translateY(3px);box-shadow:0 3px 0 #ccc}
.game{position:relative;min-height:520px;border-radius:30px;overflow:hidden;background:white;border:5px solid #eee}
.msg{text-align:center;font-size:24px;font-weight:900;padding:10px}
.big{font-size:70px}
.music{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.music button{min-height:155px;font-size:65px}.music small{display:block;font-size:20px}</style></head>
<body><header>🎵 Music Maker</header><div class="wrap"><nav><a href="halli.html">⬅️ Halli's Games</a></nav><div class="msg">Tap the big music buttons!</div><div class="music"><button data-f="261">🥁<small>Drum</small></button><button data-f="329">🔔<small>Bell</small></button><button data-f="392">🎹<small>Piano</small></button><button data-f="523">🎵<small>High</small></button><button data-f="196">🎶<small>Low</small></button><button id="song">🌟<small>Little Song</small></button></div></div><script>
let ac;function tone(f,d=.35){ac=ac||new(window.AudioContext||window.webkitAudioContext)();let o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(.22,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.start();o.stop(ac.currentTime+d)}
document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>tone(+b.dataset.f));
document.querySelector('#song').onclick=()=>[261,261,392,392,440,440,392].forEach((f,i)=>setTimeout(()=>tone(f,.3),i*330));
</script></body></html>
