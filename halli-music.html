<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Halli Music</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial Rounded MT Bold,Arial;background:linear-gradient(#ffb2d2,#fff29b);color:#5b2451}header{text-align:center;padding:22px;background:linear-gradient(90deg,#ff73ad,#ff626e,#ffe35c);font-size:38px;font-weight:900}.wrap{max-width:800px;margin:auto;padding:16px}.back{display:inline-block;background:white;padding:13px 18px;border-radius:20px;text-decoration:none;color:#5b2451;font-weight:900}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}button{border:5px solid white;border-radius:30px;min-height:180px;background:linear-gradient(145deg,#fff,#ffd1e3);font-size:22px;font-weight:900;color:#5b2451;box-shadow:0 8px 0 #0002}button span{display:block;font-size:70px}button:active{transform:translateY(5px)}#msg{text-align:center;font-size:22px;font-weight:900;padding:16px}</style></head><body><header>🎵 Halli's Music Maker 🎀</header><div class="wrap"><a class="back" href="halli.html">⬅️ Halli's World</a><div id="msg">Tap an instrument — it really plays! 🎶</div><div class="grid"><button data-s="drum"><span>🥁</span>Drum</button><button data-s="bell"><span>🔔</span>Bell</button><button data-s="piano"><span>🎹</span>Piano</button><button data-s="high"><span>🎶</span>High Notes</button><button data-s="low"><span>🎵</span>Low Notes</button><button data-s="song"><span>⭐</span>Little Song</button></div></div><script>
let ac;function A(){ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return ac}
function tone(f,d=.25,type='sine',vol=.22,delay=0){let c=A(),o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,c.currentTime+delay);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+delay+d);o.connect(g);g.connect(c.destination);o.start(c.currentTime+delay);o.stop(c.currentTime+delay+d)}
function drum(){let c=A(),o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(130,c.currentTime);o.frequency.exponentialRampToValueAtTime(45,c.currentTime+.18);g.gain.setValueAtTime(.5,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.2);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.21)}
const play={drum,bell:()=>{tone(880,.7,'sine',.25);tone(1320,.5,'sine',.1)},piano:()=>[262,330,392].forEach((f,i)=>tone(f,.45,'triangle',.2,i*.12)),high:()=>[784,988,1175].forEach((f,i)=>tone(f,.25,'sine',.18,i*.18)),low:()=>[196,165,131].forEach((f,i)=>tone(f,.35,'triangle',.25,i*.2)),song:()=>[262,262,392,392,440,440,392,349,349,330,330,294,294,262].forEach((f,i)=>tone(f,.28,'triangle',.18,i*.27))};
document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{play[b.dataset.s]();document.querySelector('#msg').textContent='🎶 '+b.textContent.trim()+'!'});</script></body></html>
