<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>MUSIC ROOM</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:none;font-family:Arial Rounded MT Bold,Arial,sans-serif;background:#7e62d9}button{font:inherit}.home{position:fixed;z-index:50;left:12px;top:12px;width:62px;height:62px;border-radius:50%;border:4px solid white;background:#ff72aa;color:white;font-size:28px;box-shadow:0 5px 12px #0004}.stage{position:absolute;inset:0;overflow:hidden}.big{position:absolute;border:0;background:transparent;touch-action:none}.pop{animation:pop .3s forwards}@keyframes pop{50%{transform:scale(1.5)}100%{transform:scale(0);opacity:0}}@keyframes bob{50%{transform:translateY(-18px)}}@keyframes wig{50%{transform:rotate(7deg) scale(1.05)}}.label{position:fixed;top:16px;left:85px;right:15px;text-align:center;color:#fff;text-shadow:0 3px 7px #0008;font-size:clamp(20px,5vw,34px);pointer-events:none}</style></head><body><button class="home" onclick="location.href='halli.html'">⌂</button><div class="label">MUSIC ROOM</div><div class="stage" id="stage"><div id="instruments" style="height:100%;display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:95px 18px 18px"></div></div><script>const A=window.AudioContext||window.webkitAudioContext,a=new A;[['PIANO',262],['DRUM',90],['BELL',660],['XYLOPHONE',523],['TAMBOURINE',330],['MARACAS',210]].forEach((v,i)=>{let b=document.createElement('button');b.style.cssText='border:8px solid white;border-radius:35px;background:hsl('+(i*55)+',80%,70%);font-size:clamp(24px,6vw,45px);font-weight:900';b.textContent=v[0];b.onpointerdown=()=>{let o=a.createOscillator(),g=a.createGain();o.type=i==1?'square':'sine';o.frequency.value=v[1];g.gain.value=.15;o.connect(g).connect(a.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.35);o.stop(a.currentTime+.36);b.animate([{transform:'scale(1)'},{transform:'scale(.88)'},{transform:'scale(1)'}],{duration:250})};instruments.append(b)});</script></body></html>
