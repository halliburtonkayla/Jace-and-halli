<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>MAGIC PAINT</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:none;font-family:Arial Rounded MT Bold,Arial,sans-serif;background:white}button{font:inherit}.home{position:fixed;z-index:50;left:12px;top:12px;width:62px;height:62px;border-radius:50%;border:4px solid white;background:#ff72aa;color:white;font-size:28px;box-shadow:0 5px 12px #0004}.stage{position:absolute;inset:0;overflow:hidden}.big{position:absolute;border:0;background:transparent;touch-action:none}.pop{animation:pop .3s forwards}@keyframes pop{50%{transform:scale(1.5)}100%{transform:scale(0);opacity:0}}@keyframes bob{50%{transform:translateY(-18px)}}@keyframes wig{50%{transform:rotate(7deg) scale(1.05)}}.label{position:fixed;top:16px;left:85px;right:15px;text-align:center;color:#fff;text-shadow:0 3px 7px #0008;font-size:clamp(20px,5vw,34px);pointer-events:none}</style></head><body><button class="home" onclick="location.href='halli.html'">⌂</button><div class="label">MAGIC PAINT</div><div class="stage" id="stage"><canvas id="c" style="width:100%;height:100%;background:white;touch-action:none"></canvas><div id="colors" style="position:fixed;bottom:15px;left:10px;right:10px;display:flex;gap:9px;justify-content:center;z-index:4"></div><button id="clear" style="position:fixed;right:12px;top:85px;width:70px;height:70px;border-radius:50%;border:4px solid white;background:#ddd;font-size:28px">↻</button></div><script>let cv=c,x=cv.getContext('2d'),col='#ff4f9a',down=false,last;function fit(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);x.lineCap='round'}fit();addEventListener('resize',fit);['#ff4f9a','#ffcc24','#42c96b','#3e8dff','#9d58e8','#ff702e'].forEach(v=>{let b=document.createElement('button');b.style.cssText='width:62px;height:62px;border-radius:50%;border:5px solid white;background:'+v;b.onclick=()=>col=v;colors.append(b)});function p(e){return{x:e.clientX,y:e.clientY}}cv.onpointerdown=e=>{down=true;last=p(e);cv.setPointerCapture(e.pointerId)};cv.onpointermove=e=>{if(!down)return;let q=p(e);x.strokeStyle=col;x.lineWidth=38;x.beginPath();x.moveTo(last.x,last.y);x.lineTo(q.x,q.y);x.stroke();for(let i=0;i<2;i++){x.fillStyle='#fff8';x.beginPath();x.arc(q.x+(Math.random()-.5)*35,q.y+(Math.random()-.5)*35,3+Math.random()*6,0,7);x.fill()}last=q};cv.onpointerup=cv.onpointercancel=()=>down=false;clear.onclick=()=>x.clearRect(0,0,cv.width,cv.height);</script></body></html>
