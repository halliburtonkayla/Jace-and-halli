<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>⛺ Learning Tent</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial Rounded MT Bold,Arial,sans-serif;background:#fff7df;color:#25324a;touch-action:manipulation}header{padding:18px;text-align:center;background:linear-gradient(135deg,#73d7ff,#ffe274,#ff9fc9);border-bottom:6px solid #fff}h1{margin:0;font-size:clamp(28px,6vw,52px)}main{max-width:1000px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:14px}.card,.btn{display:block;text-decoration:none;color:inherit;text-align:center;border:0;border-radius:26px;padding:20px 12px;font-size:20px;font-weight:800;background:white;box-shadow:0 5px 0 #d5d5d5}.card{min-height:145px}.emo{display:block;font-size:58px;margin-bottom:8px}.btn{display:inline-block;min-height:auto;padding:13px 18px;background:#ffe36f}.back{margin-bottom:15px}.panel{background:white;border-radius:25px;padding:16px;margin:12px 0}.status{text-align:center;font-size:24px;font-weight:900;min-height:40px}button:active,.card:active{transform:translateY(3px)}.letter{font-size:38px;min-height:80px}.choice{font-size:60px;min-height:120px}</style></head><body><header><h1>⛺ Learning Tent</h1></header><main><a class="btn back" href="index.html">🏠 Home</a><div class="panel"><h2>Tap a Letter</h2><div class="grid" id="letters"></div></div><div class="panel"><h2 id="q">What starts with A?</h2><div class="grid" id="choices"></div><div class="status" id="result"></div><button class="btn" id="next">Next Letter ➜</button></div></main><script>const abc='ABCDEFGHIJKLMNOPQRSTUVWXYZ',pics=['🍎','⚽','🚗','🐶','🥚','🐟','🍇','🏠','🍦','🧃','🔑','🦁','🌙','👃','🍊','🐷','👑','🤖','☀️','🌳','☂️','🎻','🍉','🎵','🧶','🦓'];function say(x){if('speechSynthesis'in window)speechSynthesis.speak(new SpeechSynthesisUtterance(x))}for(let x of abc){let b=document.createElement('button');b.className='card letter';b.textContent=x;b.onclick=()=>say(x);letters.appendChild(b)}let i=0;function ask(){q.textContent='What starts with '+abc[i]+'?';choices.innerHTML='';let opts=[i,(i+7)%26,(i+13)%26].sort(()=>Math.random()-.5);opts.forEach(k=>{let b=document.createElement('button');b.className='card choice';b.textContent=pics[k];b.onclick=()=>{result.textContent=k===i?'⭐ Great job!':'Try again!';say(k===i?'Great job':'Try again')};choices.appendChild(b)});result.textContent=''}next.onclick=()=>{i=(i+1)%26;ask()};ask();</script></body></html>
