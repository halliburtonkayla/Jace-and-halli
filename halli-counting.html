<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>MY FIRST COUNTING BOOK</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:none;font-family:Arial Rounded MT Bold,Arial,sans-serif;background:#c8f3ff}button{font:inherit}.home{position:fixed;z-index:50;left:12px;top:12px;width:62px;height:62px;border-radius:50%;border:4px solid white;background:#ff72aa;color:white;font-size:28px;box-shadow:0 5px 12px #0004}.stage{position:absolute;inset:0;overflow:hidden}.big{position:absolute;border:0;background:transparent;touch-action:none}.pop{animation:pop .3s forwards}@keyframes pop{50%{transform:scale(1.5)}100%{transform:scale(0);opacity:0}}@keyframes bob{50%{transform:translateY(-18px)}}@keyframes wig{50%{transform:rotate(7deg) scale(1.05)}}.label{position:fixed;top:16px;left:85px;right:15px;text-align:center;color:#fff;text-shadow:0 3px 7px #0008;font-size:clamp(20px,5vw,34px);pointer-events:none}</style></head><body><button class="home" onclick="location.href='halli.html'">⌂</button><div class="label">MY FIRST COUNTING BOOK</div><div class="stage" id="stage"><div id="card" style="position:absolute;inset:90px 20px 80px;background:#fff;border-radius:40px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;padding:40px"></div><button id="prev" style="position:fixed;bottom:15px;left:20px;width:100px;height:65px;border-radius:30px;border:0;font-size:35px">◀</button><button id="next" style="position:fixed;bottom:15px;right:20px;width:100px;height:65px;border-radius:30px;border:0;font-size:35px">▶</button></div><script>let n=1;function show(){card.innerHTML='';for(let i=0;i<n;i++){let q=document.createElement('i');q.style.cssText='width:90px;height:90px;margin:10px;border-radius:50%;background:hsl('+(i*48)+',80%,65%);border:7px solid #fff;box-shadow:0 4px 12px #0003';card.append(q)}}function say(){let u=new SpeechSynthesisUtterance(Array.from({length:n},(_,i)=>i+1).join('... '));u.rate=.65;speechSynthesis.cancel();speechSynthesis.speak(u);[...card.children].forEach((e,i)=>setTimeout(()=>e.animate([{transform:'scale(1)'},{transform:'scale(1.35)'},{transform:'scale(1)'}],{duration:350}),i*400))}card.onclick=say;next.onclick=()=>{n=n%10+1;show();say()};prev.onclick=()=>{n=n===1?10:n-1;show();say()};show();</script></body></html>
