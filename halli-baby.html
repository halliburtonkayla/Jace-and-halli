<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Halli's Dress-Up Teacher</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:Arial Rounded MT Bold,Arial,sans-serif;background:linear-gradient(#ffafd0,#fff1a2);color:#6b2551}header{text-align:center;padding:18px;background:#ff7bac;font-size:clamp(30px,7vw,42px);font-weight:900}.wrap{max-width:900px;margin:auto;padding:14px}.back{display:inline-block;background:#fff;padding:12px 16px;border-radius:18px;text-decoration:none;color:#6b2551;font-weight:900;box-shadow:0 5px #0002}.room{margin-top:14px;background:#ffeaf3;border:5px solid white;border-radius:32px;padding:14px;text-align:center}.teacher{background:#fff;border-radius:24px;padding:14px;margin-bottom:12px;font-size:21px;font-weight:900;min-height:72px}.scene{display:grid;grid-template-columns:1.1fr .9fr;gap:12px;align-items:center}.doll{position:relative;height:430px;background:linear-gradient(#cfefff 0 58%,#f1d2a9 58%);border-radius:28px;overflow:hidden;border:4px solid #fff}.person{position:absolute;left:50%;top:44px;transform:translateX(-50%);width:240px;height:355px}.hairBack{position:absolute;left:50%;top:10px;transform:translateX(-50%);width:128px;height:128px;border-radius:55%;background:#4b2e23}.head{position:absolute;left:50%;top:28px;transform:translateX(-50%);width:100px;height:105px;border-radius:50%;background:#c98d63;border:4px solid #7b553f}.eye{position:absolute;top:42px;width:9px;height:9px;border-radius:50%;background:#222}.eye.l{left:28px}.eye.r{right:28px}.smile{position:absolute;left:50%;top:68px;transform:translateX(-50%);width:34px;height:16px;border-bottom:4px solid #8d3e53;border-radius:0 0 40px 40px}.body{position:absolute;left:50%;top:124px;transform:translateX(-50%);width:118px;height:150px;background:#dca27a;border-radius:45px 45px 28px 28px}.leg{position:absolute;top:255px;width:38px;height:83px;background:#dca27a;border-radius:20px}.leg.l{left:76px}.leg.r{right:76px}.piece{position:absolute;left:50%;transform:translateX(-50%);z-index:5;pointer-events:none}.hair{top:3px;font-size:74px}.dress{top:135px;font-size:120px}.shoes{top:306px;font-size:56px;letter-spacing:24px}.accessory{top:112px;left:70%;font-size:48px}.side{background:#fff9;border-radius:24px;padding:12px}.items{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.items button{min-height:95px;border:0;border-radius:20px;background:#fff;font-size:42px;font-weight:900;box-shadow:0 5px #0002}.items button small{display:block;font-size:13px;color:#6b2551}.items button.correct{outline:5px solid #67c96d}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}.actions button{border:0;border-radius:18px;padding:12px 16px;font-size:17px;font-weight:900;background:#ffe36d;color:#6b2551}.progress{font-weight:900;padding:10px}@media(max-width:700px){.scene{grid-template-columns:1fr}.doll{height:390px}.person{transform:translateX(-50%) scale(.9);transform-origin:top center}.items{grid-template-columns:repeat(3,1fr)}.items button{min-height:80px;font-size:34px}}</style></head><body>
<header>Halli's Dress-Up Teacher</header><div class="wrap"><a class="back" href="halli.html">Back to Halli's World</a><div class="room"><div class="teacher" id="teacher">Halli, can you help me get our friend dressed?</div><div class="progress" id="progress"></div><div class="scene"><div class="doll"><div class="person"><div class="hairBack" id="hairBack"></div><div class="head" id="head"><span class="eye l"></span><span class="eye r"></span><span class="smile"></span></div><div class="body" id="body"></div><div class="leg l"></div><div class="leg r"></div><div class="piece hair" id="hair"></div><div class="piece dress" id="dress"></div><div class="piece shoes" id="shoes"></div><div class="piece accessory" id="accessory"></div></div></div><div class="side"><h2 id="stepTitle">Step</h2><div class="items" id="items"></div><div class="actions"><button id="repeat">Hear It Again</button><button id="nextFriend" style="display:none">Next Friend</button></div></div></div></div></div>
<script>
const people=[
{name:'Mia',skin:'#c98d63',hair:'#3e281f',steps:[
{type:'hair',ask:"Halli, can you fix Mia's hair?",choices:[['🎀','Bow'],['🌸','Flower'],['🪮','Brush'],['👑','Crown']],correct:2,place:'🪮'},
{type:'dress',ask:"Halli, can you put on Mia's dress?",choices:[['👗','Dress'],['🧥','Jacket'],['👕','Shirt'],['🥋','Pajamas']],correct:0,place:'👗'},
{type:'shoes',ask:"Halli, can you put on Mia's shoes?",choices:[['👟','Sneakers'],['👢','Boots'],['🥿','Flats'],['🧦','Socks']],correct:2,place:'🥿 🥿'},
{type:'accessory',ask:"Halli, can you give Mia her purse?",choices:[['👜','Purse'],['🧸','Teddy'],['📚','Book'],['⚽','Ball']],correct:0,place:'👜'}]},
{name:'Ava',skin:'#8f5d3f',hair:'#1f1a17',steps:[
{type:'hair',ask:"Halli, can you put a bow in Ava's hair?",choices:[['🧢','Cap'],['🎀','Bow'],['🌼','Flower'],['👒','Hat']],correct:1,place:'🎀'},
{type:'dress',ask:"Halli, can you put on Ava's play outfit?",choices:[['👗','Dress'],['🩱','Play outfit'],['🧥','Coat'],['👚','Top']],correct:1,place:'🩱'},
{type:'shoes',ask:"Halli, can you put on Ava's sneakers?",choices:[['👟','Sneakers'],['👢','Boots'],['🥿','Flats'],['🧦','Socks']],correct:0,place:'👟 👟'},
{type:'accessory',ask:"Halli, can you give Ava her teddy bear?",choices:[['📚','Book'],['👜','Bag'],['🧸','Teddy'],['🎈','Balloon']],correct:2,place:'🧸'}]},
{name:'Lily',skin:'#e0ac86',hair:'#81522f',steps:[
{type:'hair',ask:"Halli, can you put a flower in Lily's hair?",choices:[['🌸','Flower'],['🎀','Bow'],['👑','Crown'],['🧢','Cap']],correct:0,place:'🌸'},
{type:'dress',ask:"Halli, can you put on Lily's top?",choices:[['👚','Top'],['👗','Dress'],['🧥','Coat'],['🥋','Pajamas']],correct:0,place:'👚'},
{type:'shoes',ask:"Halli, can you put on Lily's boots?",choices:[['👟','Sneakers'],['👢','Boots'],['🥿','Flats'],['🧦','Socks']],correct:1,place:'👢 👢'},
{type:'accessory',ask:"Halli, can you give Lily her book?",choices:[['⚽','Ball'],['📚','Book'],['🧸','Teddy'],['👜','Purse']],correct:1,place:'📚'}]},
{name:'Zoe',skin:'#70452f',hair:'#161210',steps:[
{type:'hair',ask:"Halli, can you put the crown on Zoe?",choices:[['🎀','Bow'],['👑','Crown'],['🌸','Flower'],['🧢','Cap']],correct:1,place:'👑'},
{type:'dress',ask:"Halli, can you put on Zoe's jacket?",choices:[['👗','Dress'],['👚','Top'],['🧥','Jacket'],['🥋','Pajamas']],correct:2,place:'🧥'},
{type:'shoes',ask:"Halli, can you put on Zoe's sneakers?",choices:[['🥿','Flats'],['👟','Sneakers'],['👢','Boots'],['🧦','Socks']],correct:1,place:'👟 👟'},
{type:'accessory',ask:"Halli, can you give Zoe her balloon?",choices:[['🧸','Teddy'],['📚','Book'],['🎈','Balloon'],['👜','Purse']],correct:2,place:'🎈'}]}];
let pi=0,si=0,locked=false;
function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.rate=.82;u.pitch=1.12;let vs=speechSynthesis.getVoices();let v=vs.find(v=>/Samantha|Ava|Karen|Moira/i.test(v.name));if(v)u.voice=v;speechSynthesis.speak(u)}
function loadPerson(){let p=people[pi];document.getElementById('head').style.background=p.skin;document.getElementById('body').style.background=p.skin;document.querySelectorAll('.leg').forEach(x=>x.style.background=p.skin);document.getElementById('hairBack').style.background=p.hair;['hair','dress','shoes','accessory'].forEach(id=>document.getElementById(id).textContent='');si=0;locked=false;document.getElementById('nextFriend').style.display='none';document.getElementById('progress').textContent='Friend '+(pi+1)+' of '+people.length+' — '+p.name;step()}
function step(){let p=people[pi],s=p.steps[si],items=document.getElementById('items');items.innerHTML='';document.getElementById('stepTitle').textContent='Step '+(si+1)+' of '+p.steps.length;document.getElementById('teacher').textContent=s.ask;s.choices.forEach((c,i)=>{let b=document.createElement('button');b.innerHTML=c[0]+'<small>'+c[1]+'</small>';b.onclick=()=>pick(i,b);items.appendChild(b)});setTimeout(()=>speak(s.ask),200)}
function pick(i,b){if(locked)return;let p=people[pi],s=p.steps[si];if(i!==s.correct){document.getElementById('teacher').textContent='Good try, Halli. Look again.';speak('Good try, Halli. Look again.');return}locked=true;b.classList.add('correct');document.getElementById(s.type).textContent=s.place;document.getElementById('teacher').textContent='Great job, Halli!';speak('Great job, Halli!');setTimeout(()=>{si++;if(si<p.steps.length){locked=false;step()}else{document.getElementById('teacher').textContent='Wonderful job, Halli! '+p.name+' is all dressed. Let us help another friend!';speak('Wonderful job, Halli! '+p.name+' is all dressed. Let us help another friend!');document.getElementById('items').innerHTML='';document.getElementById('stepTitle').textContent='All dressed!';document.getElementById('nextFriend').style.display='inline-block'}},1000)}
document.getElementById('repeat').onclick=()=>{let p=people[pi];speak(si<p.steps.length?p.steps[si].ask:document.getElementById('teacher').textContent)};
document.getElementById('nextFriend').onclick=()=>{pi=(pi+1)%people.length;loadPerson()};loadPerson();
</script></body></html>
