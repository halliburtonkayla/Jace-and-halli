<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Halli's Baby Doll</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial Rounded MT Bold,Arial;background:linear-gradient(#ffdce9,#fff5cf);color:#70465a;min-height:100vh}.top{display:flex;align-items:center;gap:12px;padding:12px}.home{width:56px;height:56px;border:4px solid white;border-radius:50%;background:#ff6fa9;color:white;font-size:28px}.top h1{margin:0;font-size:clamp(24px,5vw,40px)}.nursery{max-width:900px;margin:auto;padding:10px}.scene{height:330px;border:6px solid white;border-radius:34px;background:linear-gradient(#ffeef5 0 70%,#dfc0a8 70%);position:relative;overflow:hidden}.crib{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);width:310px;height:125px;border-radius:28px;background:#fff;border:9px solid #e9b4c9}.baby{position:absolute;left:50%;bottom:65px;transform:translateX(-50%);width:145px;height:170px}.head{position:absolute;left:30px;top:0;width:86px;height:86px;border-radius:50%;background:#a9653d;border:4px solid #fff7}.eye{position:absolute;top:34px;width:9px;height:11px;background:#2c1c18;border-radius:50%}.e1{left:53px}.e2{left:84px}.mouth{position:absolute;left:65px;top:57px;width:24px;height:12px;border-bottom:4px solid #6f302c;border-radius:50%}.body{position:absolute;left:24px;top:77px;width:100px;height:86px;border-radius:35px;background:#f59abb;border:4px solid #fff7}.effect{position:absolute;left:50%;top:16px;transform:translateX(-50%);font-size:28px;font-weight:bold;background:#fff;padding:9px 16px;border-radius:20px;opacity:0;z-index:5}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}.act{min-height:118px;border:4px solid white;border-radius:25px;background:#fff9;font-size:18px;font-weight:bold;color:#70465a}.icon{display:block;font-size:48px;margin-bottom:5px}@media(max-width:620px){.actions{grid-template-columns:repeat(2,1fr)}.scene{height:300px}}
</style></head><body><header class="top"><button class="home" aria-label="Home">⌂</button><h1>Take Care of Baby</h1></header><main class="nursery"><div class="scene"><div class="effect" id="effect"></div><div class="crib"></div><div class="baby" id="baby"><i class="head"></i><i class="eye e1"></i><i class="eye e2"></i><i class="mouth"></i><i class="body"></i></div></div><div class="actions">
<button class="act" data-msg="Baby drinks her bottle!" data-say="Bottle"><span class="icon">🍼</span>Bottle</button>
<button class="act" data-msg="Night-night, baby!" data-say="Blanket"><span class="icon">🛏️</span>Blanket</button>
<button class="act" data-msg="Baby loves her teddy!" data-say="Teddy bear"><span class="icon">🧸</span>Teddy</button>
<button class="act" data-msg="Brush baby's hair!" data-say="Brush"><span class="icon">🪮</span>Brush</button>
<button class="act" data-msg="Fresh diaper!" data-say="Diaper"><span class="icon">👶</span>Diaper</button>
<button class="act" data-msg="Squeak, squeak!" data-say="Duck"><span class="icon">🐤</span>Duck</button>
<button class="act" data-msg="Baby is happy!" data-say="Play"><span class="icon">⚽</span>Play</button>
<button class="act" data-msg="Shhh... baby is sleepy." data-say="Sleep"><span class="icon">🌙</span>Sleep</button></div></main><script>
document.querySelector('.home').onclick=()=>location.href='halli.html';const baby=document.getElementById('baby'),effect=document.getElementById('effect');function say(t){if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.rate=.78;u.pitch=1.2;speechSynthesis.speak(u)}}document.querySelectorAll('.act').forEach((b,i)=>b.onclick=()=>{effect.textContent=b.dataset.msg;effect.animate([{opacity:0,transform:'translate(-50%,-10px)'},{opacity:1,transform:'translate(-50%,0)'},{opacity:1},{opacity:0}],{duration:1700});baby.animate([{transform:'translateX(-50%) rotate(0)'},{transform:'translateX(-50%) rotate(-7deg) scale(1.05)'},{transform:'translateX(-50%) rotate(7deg)'},{transform:'translateX(-50%) rotate(0)'}],{duration:650});say(b.dataset.say)});</script></body></html>
