<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Baby Care</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Arial,sans-serif;background:#fff8df;color:#17335c;overscroll-behavior:none}
header{padding:20px 12px;text-align:center;font-size:clamp(28px,7vw,44px);font-weight:900;background:linear-gradient(110deg,#65d9ef,#ffe56d,#ff9db4)}
.wrap{max-width:900px;margin:auto;padding:16px}
nav{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
a,button{border:0;border-radius:22px;padding:15px 18px;font-size:clamp(18px,4vw,25px);font-weight:900;background:#ffe36d;color:#17335c;text-decoration:none;box-shadow:0 6px 0 #d3d3d3;touch-action:manipulation}
button:active,a:active{transform:translateY(3px);box-shadow:0 3px 0 #ccc}
.game{position:relative;min-height:520px;border-radius:30px;overflow:hidden;background:white;border:5px solid #eee}
.msg{text-align:center;font-size:24px;font-weight:900;padding:10px}
.big{font-size:70px}

.nursery{background:#ffe9f2;border-radius:30px;padding:20px;text-align:center}#baby{font-size:150px;min-height:190px}.care{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.care button{font-size:55px;background:white;min-height:125px}.care small{font-size:18px;display:block}
</style></head>
<body><header>👶 Baby Care</header><div class="wrap"><nav><a href="halli.html">⬅️ Halli's Games</a></nav><div class="msg" id="babymsg">Baby is ready to play! 💕</div><div class="nursery"><div id="baby">👶</div><div class="care"><button data-a="bottle">🍼<small>Bottle</small></button><button data-a="food">🥣<small>Food</small></button><button data-a="bath">🛁<small>Bath</small></button><button data-a="diaper">🧷<small>Diaper</small></button><button data-a="hug">🤗<small>Hug</small></button><button data-a="sleep">🧸<small>Bedtime</small></button></div></div></div><script>
let m=document.querySelector('#babymsg'),baby=document.querySelector('#baby');let msgs={bottle:'Yum! Baby drank the bottle! 🍼',food:'Yummy! Baby ate! 🥣',bath:'Splash splash! Baby is clean! 🛁',diaper:'All clean and comfy! ✨',hug:'A big baby hug! 💕',sleep:'Shhh... baby is sleepy. 🌙'};
document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{let a=b.dataset.a;m.textContent=msgs[a];baby.textContent=a==='sleep'?'😴':a==='bath'?'👶🫧':'👶💕';setTimeout(()=>baby.textContent='👶',1400)})
</script></body></html>
