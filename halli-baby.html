<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Baby Doll</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial Rounded MT Bold,Arial;background:linear-gradient(#ffafd0,#fff1a2);color:#6b2551}header{text-align:center;padding:20px;background:#ff7bac;font-size:36px;font-weight:900}.wrap{max-width:850px;margin:auto;padding:14px}.back{background:#fff;padding:12px 16px;border-radius:18px;text-decoration:none;color:#6b2551;font-weight:900}.room{margin-top:14px;background:#ffe6f1;border:5px solid white;border-radius:32px;padding:15px;text-align:center}.doll{position:relative;height:350px}.head{position:absolute;left:50%;top:20px;transform:translateX(-50%);font-size:110px}.body{position:absolute;left:50%;top:125px;transform:translateX(-50%);width:145px;height:165px;background:#f4bd8d;border-radius:55px 55px 35px 35px}.outfit{position:absolute;left:50%;top:155px;transform:translateX(-50%);font-size:100px;z-index:3}.hat{position:absolute;left:50%;top:2px;transform:translateX(-50%);font-size:65px;z-index:4}.toy{position:absolute;right:15%;bottom:15px;font-size:70px}.status{font-size:22px;font-weight:900;min-height:34px}.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px}.tabs button,.items button{border:0;border-radius:18px;background:#fff;padding:13px;font-size:18px;font-weight:900}.items{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.items button{min-height:90px;font-size:38px}.label{display:block;font-size:14px;color:#6b2551}</style></head><body><header>🎀 Halli's Baby Doll</header><div class="wrap"><a class="back" href="halli.html">⬅️ Halli's World</a><div class="room"><div class="doll"><div class="head">👶</div><div class="body"></div><div class="outfit" id="outfit">👕</div><div class="hat" id="hat"></div><div class="toy" id="toy"></div></div><div class="status" id="status">Let's dress the baby! 💕</div></div><div class="tabs"><button data-tab="clothes">👗 Clothes</button><button data-tab="hats">🎀 Bows & Hats</button><button data-tab="care">🍼 Care</button><button data-tab="toys">🧸 Toys</button></div><div class="items" id="items"></div></div><script>
const sets={clothes:[['👕','Shirt'],['👗','Dress'],['🩱','Play outfit'],['🧥','Jacket'],['👚','Cute top'],['🥋','Pajamas']],hats:[['🎀','Bow'],['👒','Sun hat'],['🧢','Cap'],['👑','Crown'],['🌸','Flower'],['','No hat']],care:[['🍼','Bottle'],['🛁','Bath'],['🧷','Diaper'],['🛌','Bedtime'],['🤗','Hug'],['🧼','Wash up']],toys:[['🧸','Teddy'],['⚽','Ball'],['🪆','Doll'],['🦆','Duck'],['📚','Book'],['🧩','Puzzle']]};let tab='clothes',items=document.querySelector('#items'),status=document.querySelector('#status');
function render(){items.innerHTML='';sets[tab].forEach(x=>{let b=document.createElement('button');b.innerHTML=x[0]+'<span class="label">'+x[1]+'</span>';b.onclick=()=>{if(tab==='clothes')document.querySelector('#outfit').textContent=x[0];if(tab==='hats')document.querySelector('#hat').textContent=x[0];if(tab==='toys')document.querySelector('#toy').textContent=x[0];status.textContent=tab==='care'?'Baby is getting '+x[1].toLowerCase()+'! 💕':'Baby picked '+x[1]+'! ✨'};items.appendChild(b)})}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});render();</script></body></html>
