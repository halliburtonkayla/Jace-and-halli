<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Monster Truck Challenge</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:Arial,sans-serif;background:#fff4d5;color:#17335c;text-align:center}header{padding:16px;font-size:30px;font-weight:900;background:linear-gradient(100deg,#62d8ef,#ffe36d,#ff9ab6)}a,button{border:0;border-radius:18px;background:#ffe36d;color:#17335c;padding:13px 17px;font-size:19px;font-weight:900;box-shadow:0 5px #bbb;text-decoration:none}.bar,.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:12px}.hud{display:flex;justify-content:space-around;max-width:800px;margin:auto;font-weight:900;font-size:18px}.game{max-width:820px;margin:auto;padding:10px}canvas{width:100%;height:auto;aspect-ratio:4/3;background:#9de0ff;border:6px solid white;border-radius:24px;display:block}.controls button{min-width:120px;min-height:70px;font-size:24px;touch-action:none}.tip{font-weight:800}</style></head><body><header>🛻 Monster Truck Challenge</header><div class="bar"><a href="jace.html">⬅️ Jace's Games</a><button id="new">🔄 New Course</button></div><div class="hud"><span>⭐ <b id="score">0</b></span><span>🏁 <b id="pct">0</b>%</span><span id="msg">Get to the finish!</span></div><div class="game"><canvas id="c" width="800" height="600"></canvas><div class="controls"><button id="go">⛽ GO</button><button id="jump">⬆️ JUMP</button><button id="brake">🛑 BRAKE</button></div><div class="tip">Drive over ramps, jump mud pits, crush blocks, collect stars, and reach 🏁!</div></div><script>
const c=document.getElementById('c'),g=c.getContext('2d'),score=document.getElementById('score'),pct=document.getElementById('pct'),msg=document.getElementById('msg');let t,go=false,br=false,last=0;
function reset(){t={x:100,y:430,vy:0,speed:0,world:0,on:true,score:0,done:false};score.textContent=0;pct.textContent=0;msg.textContent='Get to the finish!'}
const items=[{x:500,k:'star'},{x:800,k:'ramp'},{x:1040,k:'mud'},{x:1280,k:'blocks'},{x:1550,k:'star'},{x:1800,k:'ramp'},{x:2080,k:'mud'},{x:2320,k:'blocks'},{x:2600,k:'star'},{x:2900,k:'ramp'},{x:3200,k:'star'}];
function jump(){if(t.on&&!t.done){t.vy=-16;t.on=false;msg.textContent='BIG AIR! 🚀'}}function loop(n){let dt=Math.min(32,n-(last||n))/16.67;last=n;if(go)t.speed=Math.min(8,t.speed+.12*dt);else t.speed=Math.max(0,t.speed-.035*dt);if(br)t.speed=Math.max(0,t.speed-.25*dt);if(!t.done)t.world+=t.speed*dt;t.vy+=.8*dt;t.y+=t.vy*dt;if(t.y>=430){t.y=430;t.vy=0;t.on=true}for(let it of items){if(it.hit)continue;let sx=it.x-t.world+100;if(Math.abs(sx-100)<60){if(it.k==='star'){it.hit=true;t.score++;score.textContent=t.score;msg.textContent='⭐ Collected!'}if(it.k==='blocks'&&t.on){it.hit=true;t.score++;score.textContent=t.score;msg.textContent='💥 CRUSH!'}if(it.k==='mud'&&t.on){t.speed*=.35;msg.textContent='SPLASH! Jump the mud!'}if(it.k==='ramp'&&t.on){t.vy=-12;t.on=false}}}let p=Math.min(100,Math.floor(t.world/34));pct.textContent=p;if(t.world>=3400&&!t.done){t.done=true;t.speed=0;msg.textContent='🏆 FINISH! '+t.score+' stars!'}draw();requestAnimationFrame(loop)}
function draw(){g.clearRect(0,0,800,600);let sky=g.createLinearGradient(0,0,0,600);sky.addColorStop(0,'#8ddcff');sky.addColorStop(1,'#e9f8ff');g.fillStyle=sky;g.fillRect(0,0,800,600);g.fillStyle='#68b74d';g.fillRect(0,485,800,115);g.fillStyle='#7a4c2d';g.fillRect(0,500,800,100);for(let i=0;i<items.length;i++){let it=items[i],sx=it.x-t.world+100;if(sx<-100||sx>900||it.hit)continue;g.font='52px Arial';if(it.k==='star')g.fillText('⭐',sx,390);if(it.k==='ramp'){g.fillStyle='#888';g.beginPath();g.moveTo(sx-30,500);g.lineTo(sx+70,440);g.lineTo(sx+70,500);g.fill()}if(it.k==='mud'){g.fillStyle='#5a351f';g.beginPath();g.ellipse(sx+20,500,70,18,0,0,7);g.fill()}if(it.k==='blocks')g.fillText('🧱🧱',sx-30,490)}let finish=3500-t.world+100;if(finish<900&&finish>-100){g.font='70px Arial';g.fillText('🏁',finish,430)}g.save();g.translate(100,t.y);g.rotate(Math.max(-.25,Math.min(.25,t.vy/50)));g.font='100px Arial';g.fillText('🛻',-55,30);g.restore()}
function hold(id,set){let b=document.getElementById(id);b.onpointerdown=e=>{e.preventDefault();set(true)};['onpointerup','onpointercancel','onpointerleave'].forEach(k=>b[k]=e=>{e.preventDefault();set(false)})}hold('go',v=>go=v);hold('brake',v=>br=v);document.getElementById('jump').onclick=jump;document.getElementById('new').onclick=()=>{items.forEach(i=>i.hit=false);reset()};reset();requestAnimationFrame(loop);
</script></body></html>
