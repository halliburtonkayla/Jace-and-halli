<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Monster Truck</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:Arial Rounded MT Bold,Arial;background:#bdefff;color:#123b66}header{text-align:center;padding:20px;background:linear-gradient(90deg,#24a95b,#35a9ff,#ffdb3f,#ef4b42);font-size:36px;font-weight:900}.wrap{max-width:900px;margin:auto;padding:14px}.back,button{border:0;border-radius:20px;padding:14px;font-size:20px;font-weight:900}.back{display:inline-block;background:#fff;color:#123b66;text-decoration:none}.game{height:470px;position:relative;overflow:hidden;border-radius:30px;background:linear-gradient(#7bdcff 0 48%,#8bd65f 48% 70%,#8b5c39 70%);margin-top:12px;touch-action:none}.sun{position:absolute;right:25px;top:25px;font-size:60px}.track{position:absolute;left:0;right:0;bottom:0;height:140px;background:#93613d}.mud{position:absolute;bottom:42px;left:62%;width:170px;height:45px;background:#4d2c1e;border-radius:50%;font-size:30px;text-align:center}.ramp{position:absolute;bottom:55px;left:42%;font-size:75px}.star{position:absolute;bottom:205px;left:53%;font-size:45px}.truck{position:absolute;left:45px;bottom:75px;width:150px;height:90px;transition:bottom .18s}.body{position:absolute;left:12px;top:18px;width:120px;height:48px;background:#e93232;border-radius:18px 28px 10px 10px;border:5px solid #143b66}.cab{position:absolute;left:72px;top:0;width:55px;height:42px;background:#287ed8;border:5px solid #143b66;border-radius:14px 20px 3px 3px}.wheel{position:absolute;top:55px;width:43px;height:43px;background:#202020;border:7px solid #444;border-radius:50%}.w1{left:10px}.w2{right:3px}.nose{position:absolute;right:-10px;top:39px;font-size:30px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.controls button{background:#ffdc3e;min-height:72px}.score{text-align:center;font-size:22px;font-weight:900;padding:10px}.msg{text-align:center;font-size:20px;font-weight:900;min-height:30px}</style></head><body><header>🛻 Jace's Monster Truck Challenge</header><div class="wrap"><a class="back" href="jace.html">⬅️ Jace's World</a><div class="score">⭐ Stars: <span id="score">0</span></div><div class="game"><div class="sun">☀️</div><div class="star">⭐</div><div class="ramp">📐</div><div class="mud">💦 MUD</div><div class="truck" id="truck"><div class="cab"></div><div class="body"></div><div class="wheel w1"></div><div class="wheel w2"></div><div class="nose">▶</div></div></div><div class="controls"><button id="go">🏁 DRIVE</button><button id="jump">⬆️ BIG JUMP</button></div><div class="msg" id="msg">Drive toward the ramp, then jump! You can clear the mud. 😄</div></div><script>
let x=45,jumping=false,score=0,t=document.querySelector('#truck'),msg=document.querySelector('#msg');
function draw(){t.style.left=x+'px'} document.querySelector('#go').onclick=()=>{x+=45;if(x>720)x=45;draw();msg.textContent='Keep going! 🛻'};
function jump(){if(jumping)return;jumping=true;t.style.bottom='245px';x+=130;draw();msg.textContent='WHEEEE! You cleared the mud! ⭐';setTimeout(()=>{t.style.bottom='75px';score++;document.querySelector('#score').textContent=score},520);setTimeout(()=>jumping=false,800)}
document.querySelector('#jump').onclick=jump;</script></body></html>
