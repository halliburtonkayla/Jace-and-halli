<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Halli Bath Time</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(#a9eaff,#ecfbff);color:#315d70}.top{display:flex;align-items:center;gap:12px;padding:12px}.home{width:56px;height:56px;border:4px solid white;border-radius:50%;background:#ff6fa9;color:white;font-size:28px}.wrap{max-width:900px;margin:auto;padding:10px}.bath{height:360px;border:6px solid white;border-radius:34px;background:linear-gradient(#d8f7ff 0 58%,#9bdcf2 58%);position:relative;overflow:hidden}.tub{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);width:440px;max-width:88%;height:185px;background:white;border-radius:35px 35px 90px 90px;border:8px solid #d8f3ff}.water{position:absolute;left:6%;right:6%;top:20px;height:95px;background:#67d8f5;border-radius:50%}.baby{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);width:105px;height:105px;border-radius:50%;background:#a9653d;border:5px solid #fff;z-index:2}.baby:before{content:"";position:absolute;left:25px;top:37px;width:9px;height:11px;background:#222;border-radius:50%;box-shadow:42px 0 #222}.baby:after{content:"";position:absolute;left:40px;top:65px;width:27px;height:12px;border-bottom:4px solid #733;border-radius:50%}.msg{position:absolute;top:16px;left:50%;transform:translateX(-50%);background:white;padding:9px 15px;border-radius:20px;font-size:21px;font-weight:bold;z-index:4}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}.act{min-height:110px;border:4px solid white;border-radius:25px;background:#fff9;font-size:18px;font-weight:bold;color:#315d70}.icon{display:block;font-size:46px}@media(max-width:620px){.actions{grid-template-columns:repeat(2,1fr)}}</style></head><body><header class="top"><button class="home">⌂</button><h1>Baby's Bath Time</h1></header><main class="wrap"><div class="bath" id="bath"><div class="msg" id="msg">Tap something to play!</div><div class="tub"><div class="water"></div></div><div class="baby" id="baby"></div></div><div class="actions"><button class="act" data-m="Splash splash!"><span class="icon">💦</span>Splash</button><button class="act" data-m="Pop the bubbles!"><span class="icon">🫧</span>Bubbles</button><button class="act" data-m="Quack quack!"><span class="icon">🐤</span>Duck</button><button class="act" data-m="Pour the water!"><span class="icon">🥤</span>Pour</button><button class="act" data-m="Wash baby's hair!"><span class="icon">🧴</span>Wash</button><button class="act" data-m="Scrub-a-dub-dub!"><span class="icon">🧽</span>Washcloth</button><button class="act" data-m="More bubbles!"><span class="icon">🧼</span>Soap</button><button class="act" data-m="All clean!"><span class="icon">⭐</span>All Clean</button></div></main><script>document.querySelector('.home').onclick=()=>location.href='halli.html';const msg=document.getElementById('msg'),baby=document.getElementById('baby');document.querySelectorAll('.act').forEach(b=>b.onclick=()=>{msg.textContent=b.dataset.m;baby.animate([{transform:'translateX(-50%) rotate(-5deg)'},{transform:'translateX(-50%) rotate(6deg)'},{transform:'translateX(-50%) rotate(0)'}],{duration:550});if('speechSynthesis'in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(b.textContent.trim()))}});</script></body></html>
