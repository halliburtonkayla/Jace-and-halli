<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Family Library</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial Rounded MT Bold,Arial,sans-serif;background:linear-gradient(#f6d59a,#c98a4a);color:#402713}.top{text-align:center;padding:18px}.home{position:absolute;left:12px;top:12px;background:#fff;padding:12px;border-radius:16px;text-decoration:none;font-size:25px}.shelf{max-width:1000px;margin:auto;padding:22px;display:grid;grid-template-columns:repeat(3,1fr);gap:18px;background:#8b542b;border:16px solid #6c3e20;border-radius:22px}.book{border:5px solid #fff;border-radius:16px;min-height:220px;padding:12px;font-weight:900;font-size:20px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;box-shadow:0 8px 0 #0003}.book span{font-size:72px}.book:nth-child(3n+1){background:#8ed8ff}.book:nth-child(3n+2){background:#ff9fc7}.book:nth-child(3n){background:#ffe273}.reader{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:10px}.page{background:#fff9dc;width:min(94vw,900px);min-height:80vh;border-radius:28px;padding:24px;text-align:center;display:flex;flex-direction:column;justify-content:space-between}.picture{font-size:clamp(85px,18vw,180px);padding:10px}.story{font-size:clamp(20px,4vw,32px);line-height:1.35}.buttons{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.buttons button{font-size:20px;font-weight:900;padding:14px 20px;border:0;border-radius:18px;background:#74d7ff}.close{background:#ff8585!important}@media(max-width:600px){.shelf{grid-template-columns:repeat(2,1fr)}.book{min-height:180px}}</style></head><body><a class="home" href="jace.html">🏠</a><div class="top"><h1>📚 JACE & HALLI'S FAMILY LIBRARY</h1><p>Touch a picture to open a book.</p></div><div class="shelf" id="shelf"></div><div class="reader" id="reader"><div class="page"><div><h2 id="title"></h2><div class="picture" id="pic"></div><div class="story" id="story"></div></div><div class="buttons"><button id="back">◀ BACK</button><button id="read">🔊 READ TO ME</button><button id="next">TURN PAGE ▶</button><button class="close" id="close">✕ SHELF</button></div></div></div><script>
const books=[
{t:"Jace Goes to Daycare",c:"🚌🦖",p:[["🏠👦🎒","Jace gets ready for daycare. Mommy helps him pack his little bag."],["🚗👩‍👦","Mommy and Jace ride to daycare together."],["🧸👦👧","At daycare, Jace plays, learns, shares, and has fun with his friends."],["🏠❤️","After a busy day, Jace comes home for hugs and family time."]]},
{t:"Halli's Daycare Day",c:"🎀🚌🫧",p:[["🎀👧🎒","Halli gets ready for daycare and brings her happy smile."],["🧸🫧","Halli plays with toys, bubbles, songs, and friends."],["🍎🥛","It is snack time. Halli sits down and enjoys her snack."],["🏠❤️","Then Halli goes home to her family."]]},
{t:"Home With Unique and Keke",c:"🏠👧👧",p:[["🏠👦👧","Jace and Halli are home with Unique and Keke."],["🧱🎨","They build, color, laugh, and play together."],["📚🛋️","Unique and Keke help make story time cozy and fun."],["❤️👨‍👩‍👧‍👦","Being together makes home a happy place."]]},
{t:"Mommy Cooks Dinner",c:"👩‍🍳🍲",p:[["👩‍🍳🥕","Mommy gets the kitchen ready and washes her hands."],["🥣🥄","She measures, mixes, and cooks the food."],["👦👧👃","Jace and Halli smell something yummy cooking."],["🍽️❤️","The family sits down together to enjoy dinner."]]},
{t:"How To Wash Your Hands",c:"🧼👐",p:[["🚰👐","First, turn on the water and wet your hands."],["🧼🫧","Add soap and rub your hands together."],["👐✨","Scrub the fronts, backs, between fingers, and fingertips."],["🚰🧻","Rinse the soap away and dry your hands. Great job!"]]},
{t:"How To Get Dressed",c:"👕👖👟",p:[["👕","First, choose your shirt."],["👖","Next, put on your pants."],["🧦","Put on your socks."],["👟⭐","Last, put on your shoes. You did it!"]]},
{t:"My ABC Picture Book",c:"🔤🍎",p:[["A 🍎  B 🐻  C 🐱","A is for apple. B is for bear. C is for cat."],["D 🐶  E 🐘  F 🐟","D is for dog. E is for elephant. F is for fish."],["G 🍇  H 🏠  I 🍦","G is for grapes. H is for house. I is for ice cream."],["J 🧃  K 🔑  L 🦁","J is for juice. K is for key. L is for lion."],["M 🌙  N 🪺  O 🍊","M is for moon. N is for nest. O is for orange."],["P 🐷  Q 👑  R 🌈","P is for pig. Q is for queen. R is for rainbow."],["S ☀️  T 🐢  U ☂️","S is for sun. T is for turtle. U is for umbrella."],["V 🎻  W 🐳  X ❌","V is for violin. W is for whale. X is for X."],["Y 🪀  Z 🦓","Y is for yo-yo. Z is for zebra."]]},
{t:"My Counting Book",c:"1️⃣2️⃣3️⃣",p:[["1 ⭐","One star."],["2 🦆🦆","Two ducks."],["3 🚗🚗🚗","Three cars."],["4 🍎🍎🍎🍎","Four apples."],["5 🖐️","Five fingers."],["6 ⚽⚽⚽⚽⚽⚽","Six balls."],["7 ⭐⭐⭐⭐⭐⭐⭐","Seven stars."],["8 🐟🐟🐟🐟🐟🐟🐟🐟","Eight fish."],["9 🎈🎈🎈🎈🎈🎈🎈🎈🎈","Nine balloons."],["10 🔟","Ten! Great counting!"]]}
];let bi=0,pi=0;books.forEach((b,i)=>{let d=document.createElement('button');d.className='book';d.innerHTML='<span>'+b.c+'</span>'+b.t;d.onclick=()=>openBook(i);shelf.appendChild(d)});function openBook(i){bi=i;pi=0;reader.style.display='flex';show()}function show(){let b=books[bi],p=b.p[pi];title.textContent=b.t;pic.textContent=p[0];story.textContent=p[1];back.disabled=pi===0;next.textContent=pi===b.p.length-1?'START OVER ↻':'TURN PAGE ▶'}function speak(){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(books[bi].p[pi][1]);u.rate=.85;speechSynthesis.speak(u)}read.onclick=speak;next.onclick=()=>{let b=books[bi];pi=pi===b.p.length-1?0:pi+1;show();speak()};back.onclick=()=>{if(pi>0)pi--;show()};close.onclick=()=>{speechSynthesis.cancel();reader.style.display='none'};</script></body></html>
