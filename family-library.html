<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Jace & Halli Story Library</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:"Arial Rounded MT Bold",Arial,sans-serif;background:linear-gradient(#f7d99a,#c58a4a);color:#17335c;min-height:100vh}.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#fff8;backdrop-filter:blur(10px);border-bottom:4px solid #9a632d}.top a,.top button{border:0;border-radius:22px;background:white;padding:12px 16px;font-weight:900;color:#17335c;box-shadow:0 4px 0 #0002}.title{font-size:clamp(24px,5vw,48px);color:#e93285;text-shadow:2px 2px white}.room{padding:16px}.shelf{max-width:1180px;margin:auto;padding:18px 16px 25px;background:linear-gradient(90deg,#7e481f,#c57a35,#7e481f);border-radius:24px;box-shadow:0 12px 30px #0005 inset,0 8px 18px #0004}.books{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:20px}.book{position:relative;min-height:220px;border:0;border-radius:14px;padding:0;overflow:hidden;background:#fff;box-shadow:8px 10px 0 #633814,0 12px 18px #0005;transform-origin:bottom;transition:.15s}.book:active{transform:scale(.96)}.book img{width:100%;height:220px;object-fit:cover;display:block}.book .label{position:absolute;left:7px;right:7px;top:8px;background:#fffE;border-radius:12px;padding:7px 5px;font-size:17px;font-weight:900;text-align:center;color:#183664;text-shadow:0 1px white}.reader{position:fixed;inset:0;z-index:99;background:#21150feF;display:none;align-items:center;justify-content:center;padding:8px}.reader.open{display:flex}.page{width:min(960px,98vw);height:min(720px,96dvh);background:#fff8e9;border:10px solid #b36d31;border-radius:28px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 60px #0008}.art{flex:1;min-height:0;background:#ccecff;position:relative;overflow:hidden}.art img{width:100%;height:100%;object-fit:cover}.words{min-height:145px;padding:12px 15px;text-align:center;font-size:clamp(18px,3vw,30px);font-weight:800;display:flex;flex-direction:column;justify-content:center;gap:10px}.controls{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}.controls button{min-width:90px;min-height:52px;border:0;border-radius:20px;padding:10px 15px;font-weight:900;font-size:17px;color:#17335c;background:white;box-shadow:0 4px 0 #0002}.controls .read{background:#42bff5}.controls .next{background:#a95be8;color:white}.close{position:absolute;z-index:101;top:max(10px,env(safe-area-inset-top));left:10px;border:0;border-radius:18px;padding:12px 15px;font-weight:900;background:white;color:#17335c}@media(max-width:600px){.top{padding:7px}.title{font-size:24px}.books{grid-template-columns:repeat(2,1fr);gap:15px}.book,.book img{min-height:190px;height:190px}.book .label{font-size:14px}.page{height:96dvh}.words{min-height:170px;font-size:19px}.controls button{min-height:48px}}</style></head><body>
<header class="top"><a href="index.html">HOME</a><div class="title">Jace & Halli's Story Library</div><button id="readShelf">READ</button></header><main class="room"><section class="shelf"><div class="books" id="books"></div></section></main>
<div class="reader" id="reader"><button class="close" id="close">SHELF</button><article class="page"><div class="art"><img id="pageImg" alt=""></div><div class="words"><div id="pageText"></div><div class="controls"><button id="prev">BACK</button><button class="read" id="read">READ TO ME</button><button class="next" id="next">NEXT</button></div></div></article></div>
<script>
const J='assets/jace-photo.jpg',H='assets/halli-photo.jpg';
const stories=[
{t:"Jace Goes to Baseball",c:J,p:[["Jace is ready for baseball! He puts on his uniform and carries his bat to the field.","Jace practices holding the bat and watching the ball.","The ball comes toward Jace. Swing! Jace hits it and runs!","Jace cheers for his teammates, too. Being a good teammate means helping and encouraging others.","After the game, Jace is proud because he practiced, tried, and had fun."]]},
{t:"Jace Plays Basketball",c:J,p:[["Jace takes his basketball to the court.","Bounce, bounce, bounce! Jace practices dribbling.","Jace looks at the basket, bends his knees, and shoots.","Sometimes the ball goes in. Sometimes it does not. Jace keeps practicing.","Jace learns that trying again helps him get better."]]},
{t:"Halli Plays With Her Dolls",c:H,p:[["Halli finds her baby doll and gives her a gentle hug.","Halli gives the baby a bottle and pretends to feed her.","She tucks the baby under a soft blanket.","Halli brushes the doll's hair and gets her ready for the day.","Halli learns that gentle hands help us care for others."]]},
{t:"Jace & Halli Go to the Park",c:H,p:[["Jace and Halli are going to the park together!","Jace waits while Halli climbs the little steps.","They take turns on the slide. First Jace, then Halli.","They find a ball and play together on the grass.","At the park, they learn to share, wait, and help each other."]]},
{t:"Our Trip to the Zoo",c:J,p:[["Jace and Halli arrive at the zoo. What animals will they see?","They see a tall giraffe eating leaves. A giraffe has a very long neck.","They watch elephants. Elephants use their trunks to smell, drink, and pick things up.","They hear monkeys and watch them climb.","Jace and Halli say goodbye to the animals and remember to be kind to living things."]]},
{t:"Going to Daycare",c:H,p:[["Halli gets ready for daycare. She has everything she needs.","At daycare, Halli greets her teacher and her friends.","She plays with toys, listens to a story, and eats her snack.","When it is time to clean up, Halli helps put the toys away.","Mommy comes back! Halli had fun learning and playing while Mommy was away."]]},
{t:"Going to the Library",c:J,p:[["Jace and Halli visit the library, where there are books everywhere.","They use quiet voices while people read.","Jace finds a book about dinosaurs. Halli finds a colorful picture book.","They sit together and turn the pages carefully.","Books can teach us about places, animals, people, and new ideas."]]},
{t:"Our Grocery Store Trip",c:H,p:[["Jace and Halli help shop for groceries.","They look for colorful fruits and vegetables.","Jace helps find bread. Halli helps find milk.","At checkout, the groceries go on the counter.","At home, everyone helps put the food away. Helping makes a big job easier."]]},
{t:"Mommy Cooks for Us",c:H,p:[["Mommy is cooking in the kitchen, and Jace and Halli want to help.","First, everyone washes their hands.","Jace helps with a safe job. Halli watches and helps with her own little job.","The kitchen smells good while the food cooks.","The family eats together and says thank you for the meal."]]},
{t:"Bath Time Fun",c:H,p:[["It is bath time! Halli splashes gently in the warm water.","Soap and water help wash away dirt.","Halli washes her hands, tummy, feet, and toes.","Now it is time to rinse and wrap up in a towel.","Clean, cozy Halli is ready for pajamas."]]},
{t:"Playing at Home",c:J,p:[["Jace and Halli have lots of things to explore at home.","They build with blocks and make a tall tower.","They race toy cars across the floor.","When the tower tumbles, they laugh and build it again.","When playtime is finished, they help put their toys back."]]},
{t:"Jace & Halli Help Clean Up",c:J,p:[["There are toys on the floor. Jace and Halli can help.","Cars go in the toy bin.","Books go back on the shelf.","Blocks go in their box.","The room is ready for the next adventure. Great teamwork!"]]},
{t:"ABC Adventure",c:H,p:[["A is for apple.","B is for ball.","C is for cat.","D is for dog.","E is for elephant. Jace and Halli can keep exploring letters together!"]]},
{t:"Counting With Jace & Halli",c:J,p:[["One bright ball.","Two little ducks.","Three toy cars.","Four colorful blocks.","Five happy stars. One, two, three, four, five!"]]},
{t:"Halli Loves Animals",c:H,p:[["Halli sees a dog. A dog says woof!","Halli sees a cow. A cow says moo!","Halli sees a duck. A duck says quack!","Halli sees a sheep. A sheep says baa!","Animals look and sound different, and we use gentle hands around them."]]},
{t:"Bedtime With Mommy",c:H,p:[["The busy day is almost over.","Mommy helps Jace and Halli get ready for bed.","They choose a bedtime story and snuggle close.","The lights get low and everyone gets quiet.","Good night, Jace. Good night, Halli. Tomorrow brings another adventure."]]}
];
const books=document.getElementById('books'),reader=document.getElementById('reader'),img=document.getElementById('pageImg'),txt=document.getElementById('pageText');let si=0,pi=0;
stories.forEach((s,i)=>{let b=document.createElement('button');b.className='book';b.innerHTML='<img src="'+s.c+'"><div class="label">'+s.t+'</div>';b.addEventListener('pointerup',e=>{e.preventDefault();openBook(i)});books.appendChild(b)});
function openBook(i){si=i;pi=0;reader.classList.add('open');show();speak(stories[si].t)}
function show(){let s=stories[si];img.src=(pi%2?s.c:(si%2?H:J));txt.textContent=s.p[0][pi];document.getElementById('prev').style.visibility=pi?'visible':'hidden';document.getElementById('next').textContent=pi===s.p[0].length-1?'THE END':'NEXT'}
function speak(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.rate=.86;u.pitch=1.08;speechSynthesis.speak(u)}
document.getElementById('read').onclick=()=>speak(txt.textContent);document.getElementById('prev').onclick=()=>{if(pi){pi--;show();speak(txt.textContent)}};document.getElementById('next').onclick=()=>{let s=stories[si];if(pi<s.p[0].length-1){pi++;show();speak(txt.textContent)}else{speechSynthesis.cancel();reader.classList.remove('open')}};document.getElementById('close').onclick=()=>{speechSynthesis.cancel();reader.classList.remove('open')};document.getElementById('readShelf').onclick=()=>speak("Pick a book! Jace and Halli have lots of stories to read.");
</script></body></html>
