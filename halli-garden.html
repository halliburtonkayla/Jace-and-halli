<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>BUTTERFLY GARDEN</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:none;font-family:Arial Rounded MT Bold,Arial,sans-serif;background:#75d8ff}button{font:inherit}.home{position:fixed;z-index:50;left:12px;top:12px;width:62px;height:62px;border-radius:50%;border:4px solid white;background:#ff72aa;color:white;font-size:28px;box-shadow:0 5px 12px #0004}.stage{position:absolute;inset:0;overflow:hidden}.big{position:absolute;border:0;background:transparent;touch-action:none}.pop{animation:pop .3s forwards}@keyframes pop{50%{transform:scale(1.5)}100%{transform:scale(0);opacity:0}}@keyframes bob{50%{transform:translateY(-18px)}}@keyframes wig{50%{transform:rotate(7deg) scale(1.05)}}.label{position:fixed;top:16px;left:85px;right:15px;text-align:center;color:#fff;text-shadow:0 3px 7px #0008;font-size:clamp(20px,5vw,34px);pointer-events:none}</style></head><body><button class="home" onclick="location.href='halli.html'">⌂</button><div class="label">BUTTERFLY GARDEN</div><div class="stage" id="stage"><div id="garden" style="position:absolute;inset:0;background:linear-gradient(#75d8ff 0 55%,#69c95e 55%);"></div></div><script>for(let i=0;i<16;i++){let f=document.createElement('button');f.className='big';f.style.cssText='left:'+(Math.random()*90)+'%;top:'+(55+Math.random()*35)+'%;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle,#ffd52b 0 18%,hsl('+(Math.random()*360)+',80%,65%) 20% 55%,#fff 58%);';f.onclick=()=>f.animate([{transform:'scale(.6)'},{transform:'scale(1.45)'},{transform:'scale(1)'}],{duration:600});garden.append(f)}for(let i=0;i<6;i++){let b=document.createElement('button');b.className='big';b.style.cssText='left:'+(10+Math.random()*80)+'%;top:'+(15+Math.random()*35)+'%;width:80px;height:55px;background:linear-gradient(90deg,#ff8bd0 0 45%,#222 46% 54%,#75a7ff 55%);border-radius:60% 60% 55% 55%;animation:bob 2s infinite';b.onclick=()=>b.animate([{transform:'translate(0,0)'},{transform:'translate(80px,-90px) rotate(20deg)'},{transform:'translate(-40px,-130px)'}],{duration:1400});garden.append(b)}</script></body></html>
